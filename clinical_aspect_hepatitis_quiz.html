<script>
const questions = [{"id": 1, "stem": "A 26 year old develops fatigue, anorexia, nausea, vague right upper quadrant pain, low grade fever, arthralgias, and hives after a recent viral exposure. She is not yet jaundiced. Which phase of acute hepatitis best explains this presentation", "topic": "Acute hepatitis phases", "options": {"A": "Incubation phase", "B": "Icteric phase", "C": "Preicteric phase", "D": "Recovery phase"}, "correct": "C", "explanation": "The preicteric phase of acute hepatitis lasts about 3 to 10 days and causes nonspecific systemic symptoms such as fatigue, anorexia, nausea, vague RUQ pain, flu-like symptoms, fever, and immune-complex hypersensitivity findings such as rash, hives, arthralgias, and angioneurotic edema.", "optionExplanations": {"A": "Incubation is often asymptomatic and antibodies may not yet be detectable.", "B": "Icteric phase is characterized by jaundice, dark urine, light stools, pruritus, and weight loss.", "C": "Correct. Nonspecific constitutional symptoms plus immune-complex symptoms before jaundice fit the preicteric phase.", "D": "Recovery is gradual resolution of symptoms and labs and can take up to 6 months."}}, {"id": 2, "stem": "A patient with acute viral hepatitis develops personality changes, sleep disturbance, hepatic encephalopathy, and rapidly progresses toward coma. Which additional finding would best track severity and prognosis in this setting", "topic": "Fulminant acute hepatitis severity", "options": {"A": "Prolonged INR or prothrombin time", "B": "Isolated mild elevation in alkaline phosphatase", "C": "Serum anti-HAV IgG level", "D": "Low amylase level"}, "correct": "A", "explanation": "Fulminant acute hepatitis presents with severe neuropsychiatric changes, encephalopathy, rapid coma, and possible hemorrhage. INR or prothrombin time prolongation tracks severity and prognosis because it reflects impaired hepatic synthetic function.", "optionExplanations": {"A": "Correct. INR/PT prolongation is the key severity and prognostic marker in acute hepatitis.", "B": "Alkaline phosphatase can rise in cholestatic hepatitis but is not the main prognostic marker here.", "C": "Anti-HAV IgG reflects past immunity or recovery, not acute severity.", "D": "Amylase is not used to assess acute hepatitis prognosis."}}, {"id": 3, "stem": "A virology review asks which acute hepatitis virus never progresses to chronic hepatitis according to the DSA table. Which virus is the best answer", "topic": "Chronic evolution of acute hepatitis viruses", "options": {"A": "HBV", "B": "HCV", "C": "HDV", "D": "HAV"}, "correct": "D", "explanation": "The DSA table lists HAV as never chronic. HBV chronicity depends strongly on age at acquisition, HCV commonly becomes chronic, and HDV chronicity is especially high with superinfection.", "optionExplanations": {"A": "HBV can become chronic, especially after perinatal acquisition.", "B": "HCV becomes chronic in about 50 to 80 percent of cases.", "C": "HDV can become chronic, especially with superinfection.", "D": "Correct. HAV never becomes chronic in the section."}}, {"id": 4, "stem": "A newborn acquires hepatitis B perinatally from an infected mother. Compared with adult acquisition, what is the expected chronicity risk pattern", "options": {"A": "Adult acquisition has greater than 90 percent chronicity, while perinatal acquisition is less than 1 percent", "B": "Perinatal acquisition has greater than 90 percent chronicity, while adult infection is less than 1 percent", "C": "Both perinatal and adult acquisition have no chronic risk", "D": "Both perinatal and adult acquisition have identical chronicity risk"}, "correct": "B", "explanation": "HBV has a strong age-dependent chronicity pattern. The DSA table states that chronic evolution occurs in greater than 90 percent with perinatal acquisition but less than 1 percent with adult infection.", "optionExplanations": {"A": "This reverses the age-dependent risk pattern.", "B": "Correct. Perinatal HBV has very high chronicity risk, whereas adult-acquired HBV rarely becomes chronic.", "C": "HBV can become chronic, especially after perinatal infection.", "D": "Chronicity risk is not identical; it is much higher when infection occurs very early in life."}, "topic": "HBV chronicity by age of acquisition"}, {"id": 5, "stem": "An immunosuppressed transplant recipient develops persistent hepatitis E infection. Which statement best matches the section’s description of HEV chronicity", "topic": "HEV chronicity", "options": {"A": "HEV is always chronic in immunocompetent adults", "B": "HEV never causes chronic infection under any circumstance", "C": "HEV chronicity is expected only when HDV is also present", "D": "HEV can occasionally become chronic in immunosuppressed patients"}, "correct": "D", "explanation": "HEV usually clears in immunocompetent patients, but the DSA notes report chronic HEV mainly in immunosuppressed patients, such as transplant recipients, with persistent HEV RNA.", "optionExplanations": {"A": "HEV usually clears in immunocompetent patients.", "B": "The section specifically notes chronic HEV can occur in immunosuppressed patients.", "C": "HDV is unrelated to HEV chronicity and requires HBV, not HEV.", "D": "Correct. Immunosuppression is the key setting for chronic HEV."}}, {"id": 6, "stem": "A child develops acute hepatitis during a local outbreak. Standard A to E hepatitis testing is negative. The DSA notes list one non-A-to-E viral cause of acute hepatitis outbreaks in children. Which virus is most consistent", "topic": "Other hepatitis-causing viruses", "options": {"A": "Adenovirus", "B": "CMV", "C": "HHV-6", "D": "Parvovirus B19"}, "correct": "A", "explanation": "The section states that adenovirus can cause outbreaks of acute hepatitis in children. CMV, EBV, HSV, HHV-6, and parvovirus B19 may establish chronic infection but are not associated with chronic hepatitis in the stated table.", "optionExplanations": {"A": "Correct. Adenovirus is listed with acute hepatitis outbreaks in children.", "B": "CMV may establish chronic infection but is not the listed outbreak cause in children.", "C": "HHV-6 is listed among viruses that may establish chronic infection but not chronic hepatitis.", "D": "Parvovirus B19 is listed among other viruses but not as the child outbreak cause emphasized here."}}, {"id": 7, "stem": "A patient has suspected acute viral hepatitis. Which initial test group best assesses the acute hepatitis biochemical pattern and provides prognostic information", "topic": "Diagnostic tests in suspected acute viral hepatitis", "options": {"A": "Serum ceruloplasmin and urine copper only", "B": "ANA, anti-SMA, anti-LKM1, and IgG only", "C": "ALT, AST, alkaline phosphatase, and INR", "D": "Alpha-1 antitrypsin phenotype and iron studies only"}, "correct": "C", "explanation": "For suspected acute viral hepatitis, the DSA diagnostic table lists ALT, AST, alkaline phosphatase, and INR as biochemical/severity tests. Transaminases confirm an acute hepatitis pattern, alkaline phosphatase identifies cholestatic pattern, and INR helps gauge severity and prognosis.", "optionExplanations": {"A": "Ceruloplasmin and urine copper are used when evaluating Wilson disease in chronic or unexplained hepatitis.", "B": "Autoimmune antibodies and IgG help evaluate autoimmune hepatitis, not the initial biochemical severity pattern.", "C": "Correct. ALT, AST, alkaline phosphatase, and INR are the biochemical/severity tests for suspected acute hepatitis.", "D": "A1AT and iron studies are used to exclude nonviral causes, not to define the acute hepatitis pattern."}}, {"id": 8, "stem": "A patient presents with acute hepatitis shortly after a high-risk exposure. The clinician is concerned for very early HCV infection before antibody seroconversion. Which test pairing best matches the DSA first-line recommendation for HCV", "topic": "Acute HCV testing", "options": {"A": "Anti-HAV IgM only", "B": "Anti-HCV antibody plus HCV RNA", "C": "HBsAg plus anti-HBc IgM only", "D": "Anti-HEV IgM only"}, "correct": "B", "explanation": "For suspected acute HCV, the section recommends anti-HCV antibody plus HCV RNA. HCV RNA can be positive very early, within days, before anti-HCV antibody appears.", "optionExplanations": {"A": "Anti-HAV IgM tests acute hepatitis A, not early HCV.", "B": "Correct. Anti-HCV antibody plus HCV RNA is recommended, and RNA catches early infection before antibody appears.", "C": "HBsAg plus anti-HBc IgM evaluates acute HBV.", "D": "Anti-HEV IgM evaluates acute HEV."}}, {"id": 9, "stem": "A patient with acute hepatitis has positive HBsAg and positive anti-HBc IgM. Which additional testing is specifically indicated to evaluate for a dependent virus", "topic": "HDV testing indication", "options": {"A": "HAV RNA in stool only", "B": "EBV heterophile antibody only", "C": "HCV genotype only", "D": "HDV antigen and/or anti-HDV antibody"}, "correct": "D", "explanation": "HDV requires HBsAg and should be evaluated when acute HBV markers are present. The DSA diagnostic table states that if HBsAg and anti-HBc IgM are positive, HDV antigen and/or anti-HDV antibody should be ordered.", "optionExplanations": {"A": "HAV RNA is briefly detectable but is not needed and does not assess HDV.", "B": "EBV testing does not evaluate the HBsAg-dependent virus.", "C": "HCV genotype is unrelated to acute HBV-associated HDV testing.", "D": "Correct. HDV testing is indicated because HDV uses the HBV envelope/HBsAg."}}, {"id": 10, "stem": "A 32 year old traveler develops acute hepatitis A. Which diagnostic pattern best confirms the acute infection and expected recovery marker pattern", "topic": "HAV diagnosis and serology", "options": {"A": "HBsAg positive with anti-HBc IgM positive, followed by anti-HBs", "B": "Anti-HCV antibody positive with persistent HCV RNA for more than 6 months", "C": "Anti-HAV IgM by EIA during acute disease, followed by lifelong anti-HAV IgG", "D": "Anti-HDV IgM positive without HBsAg exposure"}, "correct": "C", "explanation": "Acute HAV is diagnosed with anti-HAV IgM, which peaks around the second month and disappears over months. Anti-HAV IgG persists lifelong after resolution.", "optionExplanations": {"A": "This describes acute and recovered HBV serologies, not HAV.", "B": "This describes chronic HCV evaluation, not HAV.", "C": "Correct. Acute HAV is anti-HAV IgM positive, and anti-HAV IgG is lifelong after infection.", "D": "HDV requires HBsAg and is not used to diagnose HAV."}}, {"id": 11, "stem": "A patient exposed to hepatitis A asks about prevention. Which post-exposure approach is most consistent with the DSA notes", "topic": "HAV prevention and post-exposure prophylaxis", "options": {"A": "HAV vaccine with or without immune globulin, which is highly effective after exposure", "B": "Entecavir for 48 weeks after exposure", "C": "No intervention because HAV vaccine is live and contraindicated after exposure", "D": "HBIG plus recombinant HBsAg vaccine only"}, "correct": "A", "explanation": "The notes state that HAV prevention uses inactivated HAV vaccine in 2 doses. Post-exposure vaccine with or without immune globulin is about 98 percent effective and can help prevent secondary cases.", "optionExplanations": {"A": "Correct. HAV vaccine with or without IG is the post-exposure prevention strategy emphasized.", "B": "Entecavir is used for selected severe HBV and chronic HBV control, not HAV prevention.", "C": "HAV vaccine is inactivated, not live, and can be used post-exposure.", "D": "HBIG plus recombinant HBsAg vaccine is HBV post-exposure prophylaxis, not HAV."}}, {"id": 12, "stem": "A nonimmune healthcare worker has a high-risk blood exposure to HBV. Which prophylaxis timing and components best match the DSA notes", "topic": "HBV post-exposure prophylaxis", "options": {"A": "Ribavirin alone within 2 weeks", "B": "Direct-acting antivirals for 8 weeks immediately", "C": "Anti-HAV IgM followed by supportive care only", "D": "HBIG plus recombinant HBsAg vaccine within 48 hours"}, "correct": "D", "explanation": "For HBV post-exposure prophylaxis in nonimmune or low-titer patients, the notes recommend HBIG plus vaccine within 48 hours. The HBV vaccine is recombinant HBsAg, and protective anti-HBs is greater than 10 IU/L.", "optionExplanations": {"A": "Ribavirin is discussed for severe or fulminant HEV, not HBV post-exposure prophylaxis.", "B": "DAAs treat HCV; they are not HBV post-exposure prophylaxis.", "C": "Anti-HAV IgM is a diagnostic test for HAV, not HBV prophylaxis.", "D": "Correct. HBIG plus HBV vaccine within 48 hours is the recommended HBV PEP approach."}}, {"id": 13, "stem": "A mother has hepatitis B infection at delivery. Which intervention best prevents vertical transmission according to the DSA notes", "topic": "HBV vertical transmission prevention", "options": {"A": "Maternal ribavirin during labor", "B": "Infant HBIG plus HBV vaccine within 12 hours of birth", "C": "Infant anti-HCV antibody testing only", "D": "Maternal HAV vaccine after delivery only"}, "correct": "B", "explanation": "For vertical HBV exposure, the DSA section states that infant HBIG plus vaccine within 12 hours reduces transmission from about 95 percent to less than 5 percent.", "optionExplanations": {"A": "Ribavirin is not used for HBV vertical prophylaxis and is not the intervention described.", "B": "Correct. Infant HBIG plus HBV vaccine within 12 hours is the key preventive step.", "C": "Anti-HCV antibody does not prevent HBV transmission.", "D": "HAV vaccine does not prevent HBV transmission."}}, {"id": 14, "stem": "A patient has acute hepatitis B with persistent symptoms and marked jaundice for more than 4 weeks. Coagulation labs also suggest coagulopathy. Which treatment is recommended before liver failure develops", "topic": "Severe acute HBV treatment", "options": {"A": "Supportive care only in all cases", "B": "Ribavirin monotherapy", "C": "Entecavir or tenofovir until severity regresses", "D": "Pegylated interferon as mandatory first-line therapy for every acute case"}, "correct": "C", "explanation": "Most acute HBV cases do not require antivirals. However, severe acute HBV with coagulopathy or persistent symptoms/marked jaundice for more than 4 weeks should be treated with entecavir or tenofovir until severity regresses, ideally before liver failure.", "optionExplanations": {"A": "Most acute HBV is supportive, but severe disease warrants antiviral therapy.", "B": "Ribavirin is discussed for severe HEV, not severe acute HBV.", "C": "Correct. Entecavir or tenofovir is recommended for severe acute HBV.", "D": "Peg-IFN is an alternative selected strategy for chronic HBV, not mandatory for all acute HBV."}}, {"id": 15, "stem": "A patient has HCV RNA detected 5 days after a blood exposure, but the anti-HCV antibody is negative. Which interpretation best fits the DSA notes", "topic": "Early acute HCV interpretation", "options": {"A": "This is strongly suggestive of acute HCV infection and later seroconversion should be confirmed", "B": "This pattern rules out HCV infection", "C": "This proves chronic HCV infection for more than 6 months", "D": "This is diagnostic of acute HAV infection"}, "correct": "A", "explanation": "HCV RNA can become positive within 3 to 7 days, before anti-HCV antibody appears. RNA positive with antibody negative is strongly suggestive of acute HCV, with later seroconversion used for confirmation.", "optionExplanations": {"A": "Correct. Early RNA positivity before antibody is a classic acute HCV pattern.", "B": "RNA positivity does not rule out HCV; it supports early infection.", "C": "Chronic HCV requires persistent HCV RNA for more than 6 months.", "D": "HAV is diagnosed with anti-HAV IgM, not HCV RNA."}}, {"id": 16, "stem": "A patient with acute HCV asks about treatment and follow-up. Which approach matches the DSA notes", "topic": "Acute HCV treatment", "options": {"A": "No treatment is available; only immune globulin prophylaxis after needlestick", "B": "Lamivudine lifelong because HCV cannot be cured", "C": "HBIG plus vaccine because HCV uses HBsAg", "D": "Pan-genotypic direct acting antivirals for 8 to 12 weeks with HCV RNA confirmation of cure"}, "correct": "D", "explanation": "Acute HCV is treated with pan-genotypic direct-acting antivirals for 8 to 12 weeks, such as SOF/VEL or GLE/PIB. Cure is confirmed by HCV RNA at 12 and 24 weeks after treatment. There is no immune globulin PEP after needlestick; monitor and treat if documented.", "optionExplanations": {"A": "The notes state acute HCV can be treated with DAAs, and there is no IG PEP after needlestick.", "B": "Chronic HCV is curable with DAAs; lamivudine is not the regimen described.", "C": "HBIG plus vaccine prevents HBV, not HCV.", "D": "Correct. Pan-genotypic DAAs with post-treatment RNA confirmation is the DSA approach."}}, {"id": 17, "stem": "A patient with chronic HBV infection becomes acutely ill after exposure to HDV. He has severe hepatitis, HDV RNA is detected, and anti-HBc IgM is absent. Which interpretation is most likely", "topic": "HDV coinfection vs superinfection", "options": {"A": "Resolved HAV infection", "B": "HDV superinfection on chronic HBsAg carrier state", "C": "Acute HBV and HDV coinfection", "D": "False positive HDV testing because HDV cannot occur with HBV"}, "correct": "B", "explanation": "HDV superinfection occurs when HDV infects a chronic HBsAg carrier. It is typically severe or fulminant and usually chronic. Anti-HBc IgM is absent because the HBV infection itself is not acute.", "optionExplanations": {"A": "Resolved HAV would involve anti-HAV IgG, not HDV RNA.", "B": "Correct. HDV RNA with absent anti-HBc IgM in an HBsAg carrier supports HDV superinfection.", "C": "Coinfection has acute HBV and HDV together, so anti-HBc IgM is present.", "D": "HDV requires HBsAg and occurs only in HBV-infected patients."}}, {"id": 18, "stem": "A patient develops simultaneous acute HBV and HDV infection. Which serologic feature helps distinguish coinfection from HDV superinfection", "topic": "HDV coinfection marker", "options": {"A": "Anti-HAV IgG positivity", "B": "Anti-HCV antibody negativity", "C": "Anti-HBc IgM positivity", "D": "Absence of HBsAg"}, "correct": "C", "explanation": "In HBV-HDV coinfection, the patient has acute HBV, so anti-HBc IgM is present. In HDV superinfection of a chronic HBsAg carrier, anti-HBc IgM is absent because HBV is not newly acquired.", "optionExplanations": {"A": "Anti-HAV IgG indicates HAV immunity or past infection, not HDV coinfection.", "B": "Anti-HCV antibody does not distinguish HDV coinfection from superinfection.", "C": "Correct. Anti-HBc IgM indicates acute HBV and supports coinfection.", "D": "HDV requires HBsAg, so absence of HBsAg argues against HDV."}}, {"id": 19, "stem": "Which prevention strategy is the key method for preventing hepatitis D infection in a patient who is not yet infected with HBV", "topic": "HDV prevention", "options": {"A": "HBV vaccination", "B": "Ribavirin prophylaxis", "C": "HAV immune globulin only", "D": "HCV direct acting antivirals"}, "correct": "A", "explanation": "HDV requires the HBV envelope/HBsAg. Therefore, HBV vaccination prevents HDV by preventing HBV infection and HBsAg availability.", "optionExplanations": {"A": "Correct. HBV vaccination prevents HDV because HDV requires HBsAg.", "B": "Ribavirin is not HDV prophylaxis in the notes.", "C": "HAV immune globulin does not prevent HBV or HDV.", "D": "HCV DAAs do not prevent HDV."}}, {"id": 20, "stem": "A pregnant patient develops acute hepatitis E after travel with unsafe water exposure. Which statement best reflects the DSA notes about risk and treatment", "topic": "HEV severity and management", "options": {"A": "HEV is always chronic and requires lifelong tenofovir", "B": "Pregnancy protects against severe HEV, so no precautions are needed", "C": "HEV requires HBsAg and is prevented by HBV vaccination", "D": "HEV can be more severe in pregnancy; severe or fulminant disease requires specialized care and ribavirin may be successful"}, "correct": "D", "explanation": "HEV usually clears in immunocompetent patients but can be more severe in pregnancy and chronic liver disease, with rare fulminant disease. Management is usually supportive, but severe or fulminant cases need specialized care, and ribavirin monotherapy can be successful according to the excerpt.", "optionExplanations": {"A": "HEV is not always chronic and tenofovir is not its standard therapy.", "B": "Pregnancy is a risk for more severe HEV, not protection.", "C": "HDV requires HBsAg, not HEV.", "D": "Correct. Pregnancy is a high-risk setting, and severe HEV may be treated with specialized care and ribavirin."}}, {"id": 21, "stem": "A patient has liver inflammation that has persisted for more than 6 months. Which definition best matches chronic hepatitis in the DSA section", "topic": "Definition of chronic hepatitis", "options": {"A": "A transient cholestatic illness lasting less than 1 week", "B": "Any isolated elevation of alkaline phosphatase after a fatty meal", "C": "Chronic necroinflammation of the liver, with viral chronicity generally defined by persistence beyond 6 months", "D": "A congenital absence of bile ducts"}, "correct": "C", "explanation": "The section defines chronic hepatitis as chronic necroinflammation of the liver. For viral etiologies, chronicity generally means persistence beyond 6 months, such as HBsAg more than 6 months for HBV or HCV RNA more than 6 months for HCV.", "optionExplanations": {"A": "This is not chronic hepatitis and is too short in duration.", "B": "An isolated alkaline phosphatase elevation is not the definition of chronic hepatitis.", "C": "Correct. Chronic necroinflammation with persistence beyond 6 months for viral causes is the key definition.", "D": "Congenital absence of bile ducts describes biliary atresia, not chronic hepatitis."}}, {"id": 22, "stem": "A patient with chronic hepatitis has fatigue, right upper quadrant pain, ALT and AST about 3 times the upper limit of normal, normal bilirubin and albumin, and no cirrhosis. Which lab pattern best matches chronic hepatitis before advanced cirrhosis", "topic": "Chronic hepatitis biochemical pattern", "options": {"A": "AST and ALT usually greater than 50 times the upper limit with absent flares", "B": "ALT and AST usually about 2 to 5 times the upper limit, often with ALT greater than AST", "C": "Bilirubin, albumin, and PT are always severely abnormal from the start", "D": "Alkaline phosphatase is always massively elevated while transaminases stay normal"}, "correct": "B", "explanation": "Chronic hepatitis often has mild to moderate transaminase elevation, typically around 2 to 5 times the upper limit of normal, and ALT is usually greater than AST. Bilirubin, albumin, and PT are usually normal unless advanced cirrhosis is present.", "optionExplanations": {"A": "Flares can be high, but chronic hepatitis is usually around 2 to 5 times ULN, not consistently greater than 50 times.", "B": "Correct. This is the usual chronic hepatitis biochemical pattern.", "C": "Synthetic dysfunction markers are usually normal until advanced cirrhosis.", "D": "Alkaline phosphatase and gamma-GT are usually only minimally elevated unless cirrhosis or cholestasis is present."}}, {"id": 23, "stem": "A patient with chronic hepatitis now has platelets of 130,000, AST greater than ALT, elevated bilirubin, low albumin, prolonged PT, increased AFP, and increased globulins. What do these findings suggest", "topic": "Advanced fibrosis clues", "options": {"A": "Advanced fibrosis or cirrhosis", "B": "Uncomplicated acute HAV in recovery", "C": "Isolated functional dyspepsia", "D": "Resolved HBV vaccination response"}, "correct": "A", "explanation": "The DSA notes list advanced fibrosis clues as platelets less than 160,000, AST greater than ALT, increased bilirubin, decreased albumin, increased PT, increased AFP, and increased globulins.", "optionExplanations": {"A": "Correct. This pattern suggests advanced fibrosis/cirrhosis rather than uncomplicated chronic hepatitis.", "B": "Acute HAV recovery would not explain this advanced fibrosis pattern.", "C": "Functional dyspepsia does not cause these liver synthetic and fibrosis clues.", "D": "HBV vaccination response would show anti-HBs without anti-HBc and no liver injury pattern."}}, {"id": 24, "stem": "A clinician evaluates chronic hepatitis and wants a noninvasive first imaging study to assess liver and spleen size, texture, masses, biliary tree, and portal flow. Which study best matches the DSA section", "topic": "Chronic hepatitis imaging evaluation", "options": {"A": "Plain abdominal radiograph", "B": "HIDA scan only", "C": "Ultrasound", "D": "Barium swallow"}, "correct": "C", "explanation": "For chronic hepatitis evaluation, the section lists ultrasound to assess liver and spleen size and texture, masses, the biliary tree, and portal flow. CT or MRI can be used if a mass or abnormality is found on ultrasound.", "optionExplanations": {"A": "Plain radiographs do not provide the listed liver, biliary, and portal flow assessment.", "B": "HIDA scan evaluates gallbladder/biliary function, not the broad chronic hepatitis assessment described.", "C": "Correct. Ultrasound is the initial imaging tool described.", "D": "Barium swallow evaluates esophageal pathology, not chronic hepatitis."}}, {"id": 25, "stem": "A patient has chronic hepatitis with positive ANA and anti-SMA, high IgG, fatigue, jaundice, and no viral markers. Biopsy shows plasma cell rich inflammation. Which diagnosis best fits", "topic": "Autoimmune hepatitis diagnosis", "options": {"A": "Chronic HEV in an immunosuppressed patient", "B": "HBV-HDV superinfection", "C": "Drug-induced liver injury proven by rechallenge", "D": "Autoimmune hepatitis type 1"}, "correct": "D", "explanation": "Autoimmune hepatitis is a chronic inflammatory liver disorder characterized by autoantibodies, elevated IgG or gamma globulin, exclusion of other causes, and supportive biopsy findings such as plasma cell infiltrates. Type 1 is associated with ANA, anti-SMA/anti-actin, and/or anti-SLA/LP.", "optionExplanations": {"A": "Chronic HEV is confirmed by persistent HEV RNA, especially in immunosuppressed patients.", "B": "HDV superinfection requires HBsAg carrier status and HDV RNA/anti-HDV markers.", "C": "Drug-induced injury is considered in the differential but the antibody and IgG pattern with plasma cells supports AIH.", "D": "Correct. ANA/anti-SMA, high IgG, and plasma cell infiltrates support autoimmune hepatitis type 1."}}, {"id": 26, "stem": "A child is evaluated for autoimmune hepatitis. Testing shows anti-LKM1 and anti-LC1 antibodies without ANA or anti-SMA. Which autoimmune hepatitis type does this pattern indicate", "topic": "Autoimmune hepatitis type 2", "options": {"A": "Autoimmune hepatitis type 1", "B": "Autoimmune hepatitis type 2", "C": "Chronic HDV coinfection", "D": "Chronic HBV immune-tolerant phase"}, "correct": "B", "explanation": "The DSA section states that autoimmune hepatitis type 2 is associated with anti-LKM1 and/or anti-LC1 without ANA or anti-SMA. Type 1 is associated with ANA, anti-SMA/anti-actin, and/or anti-SLA/LP.", "optionExplanations": {"A": "Type 1 usually involves ANA, anti-SMA/anti-actin, and/or anti-SLA/LP.", "B": "Correct. Anti-LKM1 and anti-LC1 without ANA/anti-SMA is type 2 AIH.", "C": "HDV diagnosis uses anti-HDV and HDV RNA in HBsAg carriers.", "D": "HBV phases are not defined by anti-LKM1 or anti-LC1."}}, {"id": 27, "stem": "A patient with chronic HBV is started on therapy to suppress viral replication. Which statement best reflects why chronic HBV is controlled rather than fully eradicated", "options": {"A": "cccDNA prevents complete eradication, so treatment suppresses HBV DNA to very low or undetectable levels", "B": "HBV therapy always cures infection after 8 weeks of pan-genotypic oral DAAs", "C": "HBV cannot be treated if cirrhosis is present", "D": "HBV DNA is never used to monitor treatment or replication risk"}, "correct": "A", "explanation": "Chronic HBV treatment is control, not cure, because covalently closed circular DNA persists. The goal is suppression of HBV DNA to very low or undetectable levels, using first-line agents such as tenofovir or entecavir.", "optionExplanations": {"A": "Correct. Persistent cccDNA is why HBV is controlled rather than eradicated.", "B": "Pan-genotypic DAAs cure HCV, not HBV.", "C": "Cirrhosis with detectable HBV DNA is an indication to treat, even if ALT is normal or DNA is low.", "D": "HBV DNA quantifies replication and severity risk and is central to monitoring."}, "topic": "Chronic HBV treatment strategy"}, {"id": 28, "stem": "A patient with chronic HBV has renal disease and osteoporosis risk. Which treatment choice nuance is specifically noted for older patients or those with renal or bone disease risk", "topic": "Chronic HBV drug choice nuances", "options": {"A": "Prefer TDF over all alternatives because it is safest for bone disease", "B": "Avoid all nucleoside or nucleotide analogs and use no therapy", "C": "Prefer entecavir or TAF over TDF", "D": "Use ribavirin monotherapy as first-line chronic HBV therapy"}, "correct": "C", "explanation": "The DSA chronic HBV treatment notes list tenofovir TDF or TAF and entecavir as first-line options, but prefer entecavir or TAF over TDF in older patients over 60, renal disease, or bone disease risk.", "optionExplanations": {"A": "TDF is not preferred when renal or bone disease risk is present.", "B": "Therapy is not avoided solely because of renal or bone disease risk; drug selection is adjusted.", "C": "Correct. Entecavir or TAF is preferred over TDF in older, renal disease, or bone risk patients.", "D": "Ribavirin is not first-line chronic HBV therapy."}}, {"id": 29, "stem": "A patient with chronic HCV completes oral therapy. The clinician explains that cure is defined as undetectable HCV RNA after treatment. Which term best describes this endpoint", "topic": "Chronic HCV treatment endpoint", "options": {"A": "HBsAg seroconversion", "B": "Sustained virologic response", "C": "Anti-HBc IgM window period", "D": "HDV superinfection"}, "correct": "B", "explanation": "For chronic HCV, the goal is SVR, or sustained virologic response, defined as undetectable HCV RNA 12 weeks, and sometimes 24 weeks, after therapy. This is considered cure.", "optionExplanations": {"A": "HBsAg seroconversion relates to HBV, not HCV cure.", "B": "Correct. SVR is the HCV cure endpoint.", "C": "Anti-HBc IgM window period is an HBV serology concept.", "D": "HDV superinfection is infection of an HBsAg carrier by HDV."}}, {"id": 30, "stem": "A patient with autoimmune hepatitis begins induction therapy. Which regimen best matches the DSA section’s initial strategy", "topic": "Autoimmune hepatitis treatment", "options": {"A": "Pan-genotypic SOF/VEL for 8 weeks", "B": "Tenofovir alone until HBsAg disappears in 2 weeks", "C": "No immunosuppression because flares never occur after withdrawal", "D": "Prednisone or prednisolone followed by azathioprine as steroids are tapered"}, "correct": "D", "explanation": "Autoimmune hepatitis is treated with immunosuppression. Induction uses prednisone or prednisolone 0.5 to 1.0 mg/kg/day, then azathioprine is added about 2 weeks in as steroids are tapered. The goal is normalization of ALT and IgG.", "optionExplanations": {"A": "SOF/VEL is an HCV DAA regimen, not AIH treatment.", "B": "Tenofovir treats HBV replication; it is not AIH induction therapy.", "C": "Withdrawal after remission must be cautious because severe flares can occur.", "D": "Correct. Steroid induction followed by azathioprine is the DSA AIH treatment strategy."}}];
let currentIndex = 0;
const answers = {};
const segmentsEl = document.getElementById('segments');
const progressEl = document.getElementById('progress');
const wrongCountEl = document.getElementById('wrongCount');
const rightCountEl = document.getElementById('rightCount');
const qNumEl = document.getElementById('qNum');
const topicEl = document.getElementById('topic');
const stemEl = document.getElementById('stem');
const optionsEl = document.getElementById('options');
const explanationEl = document.getElementById('explanation');
function renderSegments() {
  segmentsEl.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('button');
    b.className = 'seg' + (idx === currentIndex ? ' active' : '') + (answers[q.id] !== undefined ? ' answered' : '');
    b.title = q.topic || `Question ${idx + 1}`;
    b.setAttribute('aria-label', `Go to question ${idx + 1}`);
    b.onclick = () => { currentIndex = idx; render(); };
    segmentsEl.appendChild(b);
  });
}
function renderCounts() {
  let right = 0, wrong = 0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (q && choice === q.correct) right++; else if (q) wrong++;
  });
  rightCountEl.textContent = right;
  wrongCountEl.textContent = wrong;
}
function renderQuestion() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  const showExplanation = selected !== null;
  progressEl.textContent = `${currentIndex + 1} / ${questions.length}`;
  qNumEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  topicEl.textContent = q.topic ? `Topic: ${q.topic}` : '';
  stemEl.textContent = q.stem + '?';
  optionsEl.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (showExplanation && letter === q.correct) btn.className += ' correct';
    else if (showExplanation && letter === selected && letter !== q.correct) btn.className += ' wrong';
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    optionsEl.appendChild(btn);
  });
  explanationEl.innerHTML = '';
  if (showExplanation) {
    const div = document.createElement('div');
    div.className = 'explanation';
    const isCorrect = selected === q.correct;
    const lines = Object.entries(q.optionExplanations || {}).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('');
    div.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p><p class="${isCorrect ? 'correctText' : 'wrongText'}">${isCorrect ? 'Nice job. ' : 'Good attempt. '}${q.explanation}</p><div><p><strong>Why each option is right or wrong:</strong></p>${lines}</div>`;
    explanationEl.appendChild(div);
  }
}
function render() { renderSegments(); renderCounts(); renderQuestion(); }
document.getElementById('prev').onclick = () => { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); };
document.getElementById('next').onclick = () => { currentIndex = (currentIndex + 1) % questions.length; render(); };
render();
</script>
