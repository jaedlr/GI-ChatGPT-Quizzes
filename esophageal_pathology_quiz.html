    let currentIndex = 0;
    let answers = {};

    function renderProgress() {
      const progress = document.getElementById("progress");
      progress.innerHTML = "";
      questions.forEach((q, idx) => {
        const button = document.createElement("button");
        button.className = "segment";
        if (answers[q.id] !== undefined) button.classList.add("answered");
        if (idx === currentIndex) button.classList.add("active");
        button.title = q.topic || `Question ${idx + 1}`;
        button.setAttribute("aria-label", `Go to question ${idx + 1}`);
        button.onclick = () => {
          currentIndex = idx;
          renderQuiz();
        };
        progress.appendChild(button);
      });
    }

    function renderQuiz() {
      const q = questions[currentIndex];
      const selected = answers[q.id];

      document.getElementById("counter").textContent = `${currentIndex + 1} / ${questions.length}`;
      document.getElementById("questionNumber").textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById("topic").textContent = q.topic ? `Topic: ${q.topic}` : "";
      document.getElementById("stem").textContent = q.stem;

      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      Object.entries(q.options).forEach(([letter, text]) => {
        const button = document.createElement("button");
        button.className = "option";
        if (selected !== undefined && letter === q.correct) {
          button.classList.add("correct");
        } else if (selected !== undefined && letter === selected && letter !== q.correct) {
          button.classList.add("incorrect");
        }
        button.innerHTML = `<strong>${letter}.</strong> ${text}`;
        button.onclick = () => {
          answers[q.id] = letter;
          renderQuiz();
        };
        optionsDiv.appendChild(button);
      });

      const explanationDiv = document.getElementById("explanation");
      if (selected !== undefined) {
        const isCorrect = selected === q.correct;
        const optionLines = Object.entries(q.optionExplanations).map(([letter, text]) =>
          `<p><strong>${letter}.</strong> ${text}</p>`
        ).join("");
        explanationDiv.style.display = "block";
        explanationDiv.innerHTML = `
          <p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p>
          <p class="${isCorrect ? "result-correct" : "result-incorrect"}">${isCorrect ? "Nice job. " : "Good attempt. "}${q.explanation}</p>
          <div class="option-exp">
            <p><strong>Why each option is right or wrong:</strong></p>
            ${optionLines}
          </div>
        `;
      } else {
        explanationDiv.style.display = "none";
        explanationDiv.innerHTML = "";
      }

      updateScore();
      renderProgress();
    }

    function updateScore() {
      let right = 0;
      let wrong = 0;
      Object.entries(answers).forEach(([qid, choice]) => {
        const q = questions.find(item => item.id === Number(qid));
        if (!q) return;
        if (choice === q.correct) right++;
        else wrong++;
      });
      document.getElementById("rightCount").textContent = right;
      document.getElementById("wrongCount").textContent = wrong;
    }

    function goNext() {
      currentIndex = (currentIndex + 1) % questions.length;
      renderQuiz();
    }

    function goPrev() {
      currentIndex = (currentIndex - 1 + questions.length) % questions.length;
      renderQuiz();
    }

    function resetQuiz() {
      answers = {};
      currentIndex = 0;
      renderQuiz();
    }

    renderQuiz();
  </script>
