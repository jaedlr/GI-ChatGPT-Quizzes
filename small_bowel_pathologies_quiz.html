<script>
const questions = [{"id": 1, "stem": "A 22 year old man has recurrent right lower quadrant pain, nonbloody diarrhea, and weight loss. Colonoscopy shows patchy areas of inflammation separated by normal mucosa, and biopsy shows transmural inflammation with noncaseating granulomas. Which feature most strongly supports Crohn disease rather than ulcerative colitis", "topic": "Crohn disease vs ulcerative colitis", "options": {"A": "Continuous disease beginning in the rectum", "B": "Inflammation limited to mucosa and superficial submucosa", "C": "Skip lesions with transmural inflammation", "D": "Marked pseudopolyps without granulomas"}, "correct": "C", "explanation": "Crohn disease classically has segmental involvement with skip lesions and transmural inflammation. It may involve any part of the GI tract, most commonly the terminal ileum, ileocecal valve, and cecum.", "optionExplanations": {"A": "Continuous involvement beginning in the rectum favors ulcerative colitis.", "B": "Mucosal and superficial submucosal inflammation favors ulcerative colitis.", "C": "Correct. Skip lesions plus transmural inflammation are core distinguishing features of Crohn disease.", "D": "Marked pseudopolyps and absent granulomas favor ulcerative colitis."}}, {"id": 2, "stem": "A 28 year old woman has bloody diarrhea, urgency, tenesmus, and left lower quadrant pain relieved by defecation. Colonoscopy shows continuous inflammation beginning in the rectum and extending proximally. Which pathologic pattern is expected", "topic": "Ulcerative colitis morphology", "options": {"A": "Mucosal and superficial submucosal inflammation only", "B": "Transmural inflammation with creeping fat", "C": "Patchy ileal disease with skip lesions", "D": "Perianal fistulas with deep knife-like ulcers"}, "correct": "A", "explanation": "Ulcerative colitis is limited to the colon and rectum, always involves the rectum, and extends proximally in a continuous pattern. Inflammation is limited to the mucosa and superficial submucosa.", "optionExplanations": {"A": "Correct. UC is a continuous mucosal/superficial submucosal colitis beginning in the rectum.", "B": "Transmural inflammation with creeping fat is characteristic of Crohn disease.", "C": "Patchy ileal disease with skip lesions supports Crohn disease.", "D": "Perianal fistulas and deep knife-like ulcers support Crohn disease."}}, {"id": 3, "stem": "A colectomy specimen from a patient with chronic bloody diarrhea shows diffuse erythema, broad superficial ulcers, pseudopolyps, and a sharp transition between involved and normal mucosa. Granulomas are absent. Which diagnosis best fits", "topic": "Gross pathology of UC", "options": {"A": "Crohn disease", "B": "Ischemic colitis", "C": "Infectious ileitis", "D": "Ulcerative colitis"}, "correct": "D", "explanation": "Ulcerative colitis shows continuous colonic disease with diffuse erythema, broad superficial ulcers, sharp demarcation from normal mucosa, pseudopolyps, and chronic mucosal atrophy. Granulomas are absent.", "optionExplanations": {"A": "Crohn disease would be more likely to show skip lesions, transmural inflammation, strictures, fistulas, and granulomas.", "B": "Ischemic colitis is not the chronic IBD pattern described in this DSA section.", "C": "Infectious ileitis does not explain continuous chronic colitis with pseudopolyps and absent granulomas.", "D": "Correct. These gross findings are classic for ulcerative colitis."}}, {"id": 4, "stem": "A resected segment of small intestine shows a thickened rubbery bowel wall, linear mucosal ulcers causing a cobblestone appearance, strictures, fissures, fistulas, and creeping fat. Which disease process is most likely", "topic": "Gross pathology of Crohn disease", "options": {"A": "Ulcerative colitis", "B": "Crohn disease", "C": "Pseudomembranous colitis", "D": "Microscopic colitis"}, "correct": "B", "explanation": "Crohn disease produces aphthous ulcers that progress to linear or serpentine ulcers, cobblestoning, thickened rubbery bowel wall, strictures, fissures, fistulas, and creeping fat.", "optionExplanations": {"A": "UC is colon-limited, continuous, mucosal, and does not produce creeping fat or fistulas.", "B": "Correct. The combination of cobblestoning, strictures, transmural disease, fistulas, and creeping fat is Crohn disease.", "C": "Pseudomembranous colitis is not described by creeping fat and transmural fistulas.", "D": "Microscopic colitis is not the gross transmural small bowel process described."}}, {"id": 5, "stem": "A biopsy from an inflamed intestinal segment shows haphazard crypt organization from repeated injury and regeneration, active ulceration with purulent exudate, transmural lymphoid aggregates, and noncaseating granulomas. Which diagnosis is most likely", "topic": "Microscopy of Crohn disease", "options": {"A": "Crohn disease", "B": "Ulcerative colitis", "C": "Irritable bowel syndrome", "D": "Celiac disease"}, "correct": "A", "explanation": "Crohn disease can show patchy inflammation, crypt abscesses, architectural distortion, noncaseating granulomas in about 35 percent of cases, and transmural lymphoid aggregates.", "optionExplanations": {"A": "Correct. Noncaseating granulomas and transmural lymphoid aggregates strongly support Crohn disease.", "B": "UC may have crypt abscesses and distortion but granulomas are absent and inflammation is mucosal.", "C": "IBS does not produce inflammatory histologic injury.", "D": "Celiac disease primarily causes villous atrophy and crypt hyperplasia in the small intestine, not transmural granulomatous IBD."}}, {"id": 6, "stem": "A patient has chronic colitis limited to the colon. Histology shows crypt abscesses, crypt distortion, and pseudopyloric metaplasia. No granulomas are seen. Which associated clinical complication is most characteristic of this disease compared with Crohn disease", "topic": "UC microscopic features and complications", "options": {"A": "Perianal fistulas", "B": "Calcium oxalate stones", "C": "B12 deficiency", "D": "Toxic megacolon"}, "correct": "D", "explanation": "UC has crypt abscesses, crypt distortion, pseudopyloric metaplasia, and absent granulomas. Toxic megacolon is a classic UC complication in this comparison table.", "optionExplanations": {"A": "Perianal fistulas are associated with Crohn disease, especially with colonic involvement.", "B": "Calcium oxalate stones are listed as a Crohn disease complication.", "C": "B12 deficiency can occur in Crohn disease due to terminal ileal involvement.", "D": "Correct. Toxic megacolon is listed under ulcerative colitis, not Crohn disease."}}, {"id": 7, "stem": "A 19 year old patient with IBD has disease affecting the terminal ileum and cecum with patchy segments of normal bowel between inflamed areas. Which additional finding would be expected from the same disease process", "topic": "Crohn disease distinguishing features", "options": {"A": "Always rectal involvement", "B": "No recurrence after surgery", "C": "Fistulae and sinus tract formation", "D": "Inflammation limited to the mucosa"}, "correct": "C", "explanation": "Crohn disease has skip lesions, transmural inflammation, fibrosis, strictures, fistulae, sinuses, perianal fistulas, and common recurrence after surgery.", "optionExplanations": {"A": "Always rectal involvement is characteristic of ulcerative colitis.", "B": "No recurrence after surgery is characteristic of UC after colectomy; Crohn recurrence is common.", "C": "Correct. Transmural Crohn disease predisposes to fistulae and sinus tracts.", "D": "Inflammation limited to the mucosa is a UC feature."}}, {"id": 8, "stem": "A patient with long-standing IBD asks why her disease increases cancer risk. Which statement best describes the pathway emphasized for IBD-associated carcinoma", "topic": "IBD-associated neoplasia", "options": {"A": "A benign adenomatous polyp is always the first lesion", "B": "Chronic inflammation progresses to dysplasia and then carcinoma", "C": "Cancer risk is unrelated to duration of inflammation", "D": "Only Crohn disease without colonic involvement increases risk"}, "correct": "B", "explanation": "IBD-associated carcinoma arises through chronic inflammation leading to dysplasia and then carcinoma, rather than the classic adenoma-carcinoma sequence.", "optionExplanations": {"A": "The section contrasts IBD-associated carcinoma with the classic adenoma-carcinoma sequence.", "B": "Correct. Chronic inflammation → dysplasia → carcinoma is the key IBD-associated pathway.", "C": "Risk increases sharply after 8–10 years of disease.", "D": "Crohn disease without colonic involvement does not increase colonic adenocarcinoma risk."}}, {"id": 9, "stem": "A 25 year old man has Crohn disease. Genetic testing in a research study shows a polymorphism that is the strongest genetic association with Crohn disease and increases risk about tenfold in the section. Which gene is most likely involved", "topic": "IBD genetics", "options": {"A": "APC", "B": "CDH1", "C": "CFTR", "D": "NOD2"}, "correct": "D", "explanation": "NOD2 polymorphisms are listed as the strongest association with Crohn disease, conferring about a 10-fold increased risk and present in about 35 percent of Caucasian patients.", "optionExplanations": {"A": "APC is associated with adenoma-carcinoma biology and FAP, not the strongest Crohn association in this section.", "B": "CDH1 is associated with diffuse gastric cancer, not Crohn disease here.", "C": "CFTR is associated with cystic fibrosis, not the strongest Crohn genetic association.", "D": "Correct. NOD2 is the strongest Crohn disease association emphasized in the section."}}, {"id": 10, "stem": "A patient with Crohn disease has fat malabsorption, low B12, and recurrent calcium oxalate kidney stones. These complications are most directly explained by disease involving which region", "topic": "Crohn terminal ileum complications", "options": {"A": "Terminal ileum", "B": "Rectum only", "C": "Gastric antrum", "D": "Distal esophagus"}, "correct": "A", "explanation": "Crohn disease most commonly involves the terminal ileum, ileocecal valve, and cecum. Terminal ileal disease can cause fat/vitamin malabsorption, B12 deficiency, and calcium oxalate stones.", "optionExplanations": {"A": "Correct. Terminal ileal involvement explains malabsorption, B12 deficiency, and calcium oxalate stones in Crohn disease.", "B": "Rectum-only disease is more compatible with UC proctitis and does not explain B12 malabsorption.", "C": "The gastric antrum is not the classic site explaining these Crohn complications.", "D": "The distal esophagus is unrelated to these small bowel malabsorption complications."}}, {"id": 11, "stem": "A patient has chronic bloody diarrhea. Serology is positive for p-ANCA, and the disease is associated with primary sclerosing cholangitis. Which additional feature is most consistent with this condition", "topic": "Ulcerative colitis associations", "options": {"A": "Anti-Saccharomyces cerevisiae antibody positivity", "B": "Right lower quadrant pain from terminal ileal disease", "C": "Lead-pipe colon from loss of haustra", "D": "Perianal fistula formation"}, "correct": "C", "explanation": "UC is associated with p-ANCA, primary sclerosing cholangitis, Th2 signaling, bloody diarrhea, continuous mucosal colitis, lead-pipe colon from haustral loss, toxic megacolon, pseudopolyps, and crypt abscesses.", "optionExplanations": {"A": "Anti-Saccharomyces cerevisiae antibodies are listed with Crohn disease.", "B": "RLQ pain from terminal ileal disease fits Crohn disease.", "C": "Correct. Lead-pipe colon due to haustral loss is listed for UC.", "D": "Perianal fistulas are a Crohn disease complication."}}, {"id": 12, "stem": "A patient with IBD smokes cigarettes. According to the section comparison, smoking has which relationship to Crohn disease and ulcerative colitis", "topic": "Environmental risk factors", "options": {"A": "Smoking decreases both Crohn disease and UC risk", "B": "Smoking increases Crohn disease risk and decreases UC risk", "C": "Smoking decreases Crohn disease risk and increases UC risk", "D": "Smoking has no relationship to either disease"}, "correct": "B", "explanation": "The DSA section lists smoking as increasing risk for Crohn disease and decreasing risk for ulcerative colitis.", "optionExplanations": {"A": "Smoking does not decrease both risks in the section.", "B": "Correct. Smoking ↑ Crohn risk and ↓ UC risk.", "C": "This reverses the section’s listed relationship.", "D": "The section explicitly lists a smoking relationship for both diseases."}}, {"id": 13, "stem": "A patient with IBD has a colonoscopy showing continuous disease from the rectum proximally. Which statement about surgery is most accurate for this disease compared with Crohn disease", "topic": "Surgery and recurrence", "options": {"A": "Recurrence after surgery is common", "B": "Surgery causes fat malabsorption in all cases", "C": "Surgery increases granuloma formation", "D": "Total colectomy can eliminate recurrence in the colon"}, "correct": "D", "explanation": "Ulcerative colitis is limited to the colon and rectum, so colectomy is considered curative for the colonic disease and recurrence after surgery is not expected. Crohn disease commonly recurs after surgery.", "optionExplanations": {"A": "Common recurrence after surgery is a Crohn feature, not UC.", "B": "Fat malabsorption is associated with Crohn small bowel disease, not all UC surgery.", "C": "Granulomas are absent in UC.", "D": "Correct. Because UC is colon-limited, colectomy removes the involved organ and recurrence is not expected."}}, {"id": 14, "stem": "A patient with Crohn disease has epithelial barrier dysfunction. The notes describe C1orf106 mutation as destabilizing barrier function through which sequence", "topic": "Barrier genetics in Crohn disease", "options": {"A": "Decreased cytohesin-1 leading to decreased ARF6 and stabilized tight junctions", "B": "Increased p53 degradation causing adenoma formation", "C": "Increased cytohesin-1 leading to increased ARF6 and tight junction disruption", "D": "Loss of E-cadherin causing signet-ring cells"}, "correct": "C", "explanation": "The DSA notes list C1orf106 mutation as increasing cytohesin-1, increasing ARF6, and disrupting tight junctions/barrier function.", "optionExplanations": {"A": "This describes the opposite protective direction listed for normal C1orf106 signaling.", "B": "This is not the barrier mechanism described in the IBD section.", "C": "Correct. C1orf106 mutation → ↑ cytohesin-1 → ↑ ARF6 → disrupted tight junctions/barrier dysfunction.", "D": "Loss of E-cadherin is associated with diffuse gastric cancer, not this Crohn barrier pathway."}}, {"id": 15, "stem": "A teen with IBD has oral ulcers, right lower quadrant pain, cobblestoning, a string sign, and noncaseating granulomas. Which immune association from the section best matches this disease", "topic": "Crohn disease immune associations", "options": {"A": "Anti-Saccharomyces cerevisiae antibodies and Th1-mediated inflammation", "B": "p-ANCA and prominent Th2 signaling only", "C": "Absence of Th17 pathway involvement", "D": "IgE-mediated mast cell degranulation"}, "correct": "A", "explanation": "Crohn disease is listed with anti-Saccharomyces cerevisiae antibodies, Th1-mediated inflammation, RLQ pain, cobblestoning/string lesion, granulomas, oral ulcers, and complications such as perianal disease, strictures, and fistulas.", "optionExplanations": {"A": "Correct. ASCA positivity and Th1-mediated inflammation match Crohn disease in the DSA notes.", "B": "p-ANCA and Th2 signaling are associated with ulcerative colitis.", "C": "Th17 pathway involvement is described in both diseases.", "D": "IgE-mediated mast cell degranulation is not the IBD mechanism emphasized here."}}, {"id": 16, "stem": "A patient with IBD has pancolitis and primary sclerosing cholangitis. When should surveillance for colonic neoplasia begin according to the section’s risk discussion", "topic": "IBD cancer surveillance", "options": {"A": "Never, because only sporadic adenomas matter", "B": "Only after gross polyps are seen", "C": "After 30 years regardless of disease extent", "D": "Earlier than usual, with PSC prompting surveillance beginning at diagnosis"}, "correct": "D", "explanation": "IBD cancer risk increases with duration and extent. PSC substantially elevates risk, and surveillance begins at diagnosis when PSC is present rather than waiting the usual timeframe.", "optionExplanations": {"A": "IBD-associated carcinoma is specifically linked to chronic inflammation and dysplasia.", "B": "Dysplasia may be flat and not grossly visible, so surveillance is not limited to gross polyps.", "C": "Surveillance typically begins around 8 years after diagnosis, earlier with PSC.", "D": "Correct. PSC substantially elevates risk and prompts surveillance at diagnosis."}}, {"id": 17, "stem": "A 20 year old woman with chronic diarrhea is found to have IBD. Which epidemiologic statement from the section is most accurate for both ulcerative colitis and Crohn disease", "topic": "IBD epidemiology", "options": {"A": "Both usually begin only after age 70", "B": "Both most commonly present in the teens and early 20s but can occur at any age", "C": "Both are most common in tropical regions with low hygiene", "D": "Both occur exclusively in patients with Ashkenazi Jewish ancestry"}, "correct": "B", "explanation": "Both UC and Crohn disease most commonly present in the teens and early 20s but can occur at any age. They are more common in Caucasians, with 3–5 times higher incidence in Ashkenazi Jews, and have highest prevalence in North America, northern Europe, and Australia.", "optionExplanations": {"A": "The most common onset is teens and early 20s, not exclusively after age 70.", "B": "Correct. This matches the shared age pattern stated in the DSA section.", "C": "Highest prevalence is in North America, northern Europe, and Australia.", "D": "Ashkenazi ancestry increases risk, but disease is not exclusive to that group."}}, {"id": 18, "stem": "A pathology report for an IBD patient states there are deep knife-like ulcers, marked fibrosis, marked serositis, and marked lymphoid reaction. Which diagnosis is favored", "topic": "Crohn microscopic/macroscopic comparison", "options": {"A": "Ulcerative colitis", "B": "Irritable bowel syndrome", "C": "Crohn disease", "D": "Non-inflammatory functional pain"}, "correct": "C", "explanation": "The comparison table lists deep knife-like ulcers, marked fibrosis, marked serositis, marked lymphoid reaction, fistulae/sinuses, and granulomas as Crohn disease features.", "optionExplanations": {"A": "UC has superficial broad-based ulcers, mild to no fibrosis, and mild to no serositis.", "B": "IBS does not produce deep ulcers or fibrosis.", "C": "Correct. Deep knife-like ulcers with marked fibrosis and serositis favor Crohn disease.", "D": "Functional pain does not cause inflammatory pathologic changes."}}, {"id": 19, "stem": "A patient has ulcerative colitis involving the entire colon. Which factor most strongly increases the risk of colonic adenocarcinoma in this patient according to the section", "topic": "IBD neoplasia risk factors", "options": {"A": "Pancolitis with long duration of disease", "B": "Disease limited to the rectum for 1 year", "C": "Crohn disease without colonic involvement", "D": "Absence of neutrophil-rich inflammation"}, "correct": "A", "explanation": "Risk factors for IBD-associated neoplasia include duration of disease with sharp rise after 8–10 years, extent of disease with pancolitis greater than left-sided disease, severe active neutrophil-rich inflammation, and PSC.", "optionExplanations": {"A": "Correct. Long-standing extensive colitis, especially pancolitis, increases cancer risk.", "B": "Short duration and limited proctitis have lower risk than long-standing pancolitis.", "C": "Crohn disease without colonic involvement does not increase colonic adenocarcinoma risk.", "D": "Frequent severe neutrophil-rich inflammation increases risk; its absence does not."}}, {"id": 20, "stem": "A 27 year old patient with IBD develops an intra-abdominal abscess from a fistula. Which layer of involvement explains the fistula risk", "topic": "Crohn transmural inflammation", "options": {"A": "Surface epithelium only", "B": "Lamina propria only", "C": "Mucosa and superficial submucosa only", "D": "Transmural inflammation"}, "correct": "D", "explanation": "Crohn disease has transmural inflammation, which predisposes to fissures, fistulas, strictures, serositis, and perforation. UC is limited to mucosa and superficial submucosa.", "optionExplanations": {"A": "Surface epithelium-only injury would not explain fistulas.", "B": "Lamina propria-only inflammation would not typically cause penetrating fistulas.", "C": "Mucosa and superficial submucosa only describes UC and does not explain fistulas.", "D": "Correct. Transmural inflammation in Crohn disease causes penetrating complications such as fistulas."}}, {"id": 21, "stem": "A patient with chronic colitis has repeated mucosal injury and regeneration. Histology shows crypt abscesses and crypt distortion without granulomas. Which diagnosis and distribution are most consistent", "topic": "Ulcerative colitis distribution", "options": {"A": "Crohn disease involving mouth to anus in skip lesions", "B": "Ulcerative colitis limited to colon and rectum with continuous extension", "C": "Crohn disease limited to stomach only", "D": "Ulcerative colitis with ileal skip lesions as the defining feature"}, "correct": "B", "explanation": "UC is limited to the colon and rectum, always involves the rectum, and spreads proximally in a continuous pattern. Granulomas are absent.", "optionExplanations": {"A": "Mouth-to-anus skip lesions describe Crohn disease, not UC.", "B": "Correct. Continuous colon and rectum involvement with absent granulomas supports UC.", "C": "Crohn disease can involve the GI tract but is not limited to the stomach.", "D": "Skip lesions are not the defining feature of UC."}}, {"id": 22, "stem": "A researcher studying Crohn disease finds abnormal Paneth cell granules in crypts. Which genetic/autophagy pathway from the section is most directly related", "topic": "Autophagy and Paneth cells", "options": {"A": "CDH1 promoter hypermethylation", "B": "APC destruction complex failure", "C": "ATG16L1 mutation impairing autophagy", "D": "Lactase gene downregulation"}, "correct": "C", "explanation": "Autophagy genes ATG16L1 and IRGM are highlighted in IBD. Defective autophagy impairs clearance of intracellular pathogens, and ATG16L1 mutations linked to Crohn disease are associated with abnormal Paneth cell granules.", "optionExplanations": {"A": "CDH1 promoter hypermethylation is linked to diffuse gastric cancer, not Crohn Paneth cell granules here.", "B": "APC pathway failure is not the autophagy pathway emphasized in IBD.", "C": "Correct. ATG16L1 mutation is linked to Crohn disease and abnormal Paneth cell granules.", "D": "Lactase downregulation is unrelated to IBD autophagy in this section."}}, {"id": 23, "stem": "A patient has active IBD. Stool testing is ordered to help distinguish inflammatory bowel disease from irritable bowel syndrome. Which markers are expected to be increased in IBD according to the notes", "topic": "IBD stool inflammatory markers", "options": {"A": "Stool sodium and stool potassium only", "B": "Fecal elastase only", "C": "Urinary 5-HIAA", "D": "Fecal calprotectin and lactoferrin"}, "correct": "D", "explanation": "The notes list increased fecal calprotectin and lactoferrin in IBD. These inflammatory markers help separate IBD from noninflammatory functional disorders such as IBS.", "optionExplanations": {"A": "Stool electrolytes are not the IBD inflammatory markers listed here.", "B": "Fecal elastase evaluates pancreatic exocrine insufficiency, not IBD inflammation in these notes.", "C": "Urinary 5-HIAA is used for carcinoid syndrome, not IBD activity here.", "D": "Correct. Fecal calprotectin and lactoferrin increase with intestinal inflammation in IBD."}}, {"id": 24, "stem": "A clinician is comparing Crohn disease and ulcerative colitis. Which finding is listed as absent in ulcerative colitis but present in Crohn disease in about 35 percent of cases", "topic": "Granulomas in IBD", "options": {"A": "Noncaseating granulomas", "B": "Crypt abscesses", "C": "Pseudopolyps", "D": "Mucosal atrophy"}, "correct": "A", "explanation": "Noncaseating granulomas are present in about 35 percent of Crohn disease cases and are absent in ulcerative colitis. Both can have crypt abnormalities, but granulomas distinguish Crohn when present.", "optionExplanations": {"A": "Correct. Noncaseating granulomas support Crohn disease and are absent in UC.", "B": "Crypt abscesses can occur in both, especially UC, so they do not distinguish Crohn.", "C": "Pseudopolyps are marked in UC.", "D": "Mucosal atrophy can be seen in chronic UC."}}, {"id": 25, "stem": "A patient with chronic IBD has flat dysplasia on surveillance biopsy. The clinician explains that high-grade dysplasia in this setting often changes management. What is the typical management implication listed", "topic": "Dysplasia management in IBD", "options": {"A": "No additional monitoring is needed", "B": "High-grade dysplasia is often associated with invasive carcinoma and usually prompts colectomy", "C": "High-grade dysplasia proves the disease is Crohn without colonic involvement", "D": "High-grade dysplasia decreases cancer risk"}, "correct": "B", "explanation": "Dysplasia in IBD may be flat and not grossly visible. High-grade dysplasia is often associated with invasive carcinoma and usually prompts colectomy.", "optionExplanations": {"A": "High-grade dysplasia is high risk and does require action.", "B": "Correct. High-grade dysplasia often indicates high carcinoma risk and usually prompts colectomy.", "C": "High-grade dysplasia does not prove Crohn disease and can occur in UC or Crohn colitis.", "D": "High-grade dysplasia increases concern for carcinoma; it does not decrease risk."}}, {"id": 26, "stem": "A patient has IBD driven by inappropriate mucosal immune activation. Which combination of processes is emphasized in the section’s pathogenesis overview", "topic": "IBD pathogenesis overview", "options": {"A": "Only dietary fat excess without immune involvement", "B": "Purely infectious disease with no host susceptibility", "C": "Genetic susceptibility, immune dysregulation, epithelial barrier defects, and gut microbiota interactions", "D": "Only congenital absence of enteric neurons"}, "correct": "C", "explanation": "The core mechanism of IBD is inappropriate mucosal immune activation due to interactions among genetic susceptibility, immune dysregulation, epithelial barrier defects, and the gut microbiota.", "optionExplanations": {"A": "Dietary and environmental factors may contribute, but the section emphasizes immune and host-microbiota mechanisms.", "B": "IBD is not described as purely infectious; host susceptibility and dysregulated immunity are central.", "C": "Correct. This is the section’s core pathogenesis framework.", "D": "Congenital absence of enteric neurons describes Hirschsprung disease, not IBD."}}, {"id": 27, "stem": "An IBD patient has broad superficial ulcers, marked pseudopolyps, mild to no fibrosis, and mild to no serositis. Which diagnosis does this pattern support", "topic": "Ulcerative colitis distinguishing features", "options": {"A": "Ulcerative colitis", "B": "Crohn disease", "C": "Whipple disease", "D": "Celiac disease"}, "correct": "A", "explanation": "The comparison table lists UC as having superficial broad-based ulcers, marked pseudopolyps, mild to no fibrosis, and mild to no serositis. Crohn disease has deep knife-like ulcers and marked fibrosis/serositis.", "optionExplanations": {"A": "Correct. Superficial broad ulcers with marked pseudopolyps and minimal fibrosis/serositis favor UC.", "B": "Crohn disease has deep ulcers, transmural re, not a microscopic crypt finding.", "D": "String sign refers to narrowed bowel lumen in Crohn disease, not a histologic finding."}}, {"id": 30, "stem": "A 24 year old patient is diagnosed with Crohn disease. Which constellation of extraintestinal manifestations is listed in the notes as associated with IBD", "topic": "Extraintestinal manifestations", "options": {"A": "Acanthosis nigricans, clubbing only, and malar rash", "B": "Migratory thrombophlebitis, pancreatic insufficiency, and xanthomas", "C": "Arthritis, iritis or uveitis, erythema nodosum, and pyoderma gangrenosum", "D": "Kayser-Fleischer rings, hemiballismus, and telangiectasias"}, "correct": "C", "explanation": "The notes list arthritis, iritis/uveitis, erythema nodosum, and pyoderma gangrenosum among IBD-associated manifestations, particularly in the Crohn disease note block.", "optionExplanations": {"A": "These are not the IBD extraintestinal findings listed in the section.", "B": "These are not the listed IBD extraintestinal manifestations.", "C": "Correct. Arthritis, iritis/uveitis, erythema nodosum, and pyoderma gangrenosum are listed.", "D": "Kayser-Fleischer rings and movement disorder point to Wilson disease, not the IBD findings here."}}];
let currentIndex = 0;
const answers = {};
const segmentsEl = document.getElementById('segments');
const progressEl = document.getElementById('progress');
const wrongCountEl = document.getElementById('wrongCount');
const rightCountEl = document.getElementById('rightCount');
const qNumEl = document.getElementById('qNum');
const topicEl = document.getElementById('topic');
const stemEl = document.getElementById('stem');
const optionsEl = document.getElementById('options');
const explanationEl = document.getElementById('explanation');
function renderSegments() {
  segmentsEl.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('button');
    b.className = 'seg' + (idx === currentIndex ? ' active' : '') + (answers[q.id] !== undefined ? ' answered' : '');
    b.title = q.topic || `Question ${idx + 1}`;
    b.setAttribute('aria-label', `Go to question ${idx + 1}`);
    b.onclick = () => { currentIndex = idx; render(); };
    segmentsEl.appendChild(b);
  });
}
function renderCounts() {
  let right = 0, wrong = 0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (q && choice === q.correct) right++; else if (q) wrong++;
  });
  rightCountEl.textContent = right;
  wrongCountEl.textContent = wrong;
}
function renderQuestion() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  const showExplanation = selected !== null;
  progressEl.textContent = `${currentIndex + 1} / ${questions.length}`;
  qNumEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  topicEl.textContent = q.topic ? `Topic: ${q.topic}` : '';
  stemEl.textContent = q.stem + '?';
  optionsEl.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (showExplanation && letter === q.correct) btn.className += ' correct';
    else if (showExplanation && letter === selected && letter !== q.correct) btn.className += ' wrong';
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    optionsEl.appendChild(btn);
  });
  explanationEl.innerHTML = '';
  if (showExplanation) {
    const div = document.createElement('div');
    div.className = 'explanation';
    const isCorrect = selected === q.correct;
    const lines = Object.entries(q.optionExplanations || {}).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('');
    div.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p><p class="${isCorrect ? 'correctText' : 'wrongText'}">${isCorrect ? 'Nice job. ' : 'Good attempt. '}${q.explanation}</p><div><p><strong>Why each option is right or wrong:</strong></p>${lines}</div>`;
    explanationEl.appendChild(div);
  }
}
function render() { renderSegments(); renderCounts(); renderQuestion(); }
document.getElementById('prev').onclick = () => { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); };
document.getElementById('next').onclick = () => { currentIndex = (currentIndex + 1) % questions.length; render(); };
render();
</script>
