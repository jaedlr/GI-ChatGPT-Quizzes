    let currentIndex = 0;
    const answers = {};

    function renderSegments() {
      const segments = document.getElementById('segments');
      segments.innerHTML = '';
      questions.forEach((q, idx) => {
        const button = document.createElement('button');
        button.className = 'segment' + (answers[q.id] !== undefined ? ' answered' : '') + (idx === currentIndex ? ' active' : '');
        button.title = q.topic || `Question ${idx + 1}`;
        button.setAttribute('aria-label', `Go to question ${idx + 1}`);
        button.onclick = () => { currentIndex = idx; render(); };
        segments.appendChild(button);
      });
    }

    function renderCounts() {
      let right = 0;
      let wrong = 0;
      Object.entries(answers).forEach(([qid, choice]) => {
        const q = questions.find(item => item.id === Number(qid));
        if (q && choice === q.correct) right += 1;
        if (q && choice !== q.correct) wrong += 1;
      });
      document.getElementById('rightCount').textContent = right;
      document.getElementById('wrongCount').textContent = wrong;
      document.getElementById('progressText').textContent = `${currentIndex + 1} / ${questions.length}`;
    }

    function render() {
      const q = questions[currentIndex];
      const selected = answers[q.id] !== undefined ? answers[q.id] : null;
      document.getElementById('questionCount').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById('topicText').textContent = q.topic ? `Topic: ${q.topic}` : '';
      document.getElementById('stem').textContent = q.stem + '?';

      const options = document.getElementById('options');
      options.innerHTML = '';
      Object.entries(q.options).forEach(([letter, text]) => {
        const button = document.createElement('button');
        let cls = 'option';
        if (selected !== null && letter === q.correct) cls += ' correct';
        else if (selected !== null && selected === letter && letter !== q.correct) cls += ' incorrect';
        button.className = cls;
        button.innerHTML = `<strong>${letter}.</strong> ${escapeHtml(text)}`;
        button.onclick = () => { answers[q.id] = letter; render(); };
        options.appendChild(button);
      });

      const explanation = document.getElementById('explanation');
      if (selected === null) {
        explanation.style.display = 'none';
        explanation.innerHTML = '';
      } else {
        const isCorrect = selected === q.correct;
        explanation.style.display = 'block';
        let html = `<p><strong>Correct answer: ${q.correct}</strong> (${escapeHtml(q.options[q.correct])})</p>`;
        html += `<p class="${isCorrect ? 'green-text' : 'red-text'}">${isCorrect ? 'Nice job. ' : 'Good attempt. '}${escapeHtml(q.explanation)}</p>`;
        if (q.optionExplanations) {
          html += '<div class="option-explanations"><p><strong>Why each option is right or wrong:</strong></p>';
          Object.entries(q.optionExplanations).forEach(([letter, text]) => {
            html += `<p><strong>${letter}.</strong> ${escapeHtml(text)}</p>`;
          });
          html += '</div>';
        }
        explanation.innerHTML = html;
      }
      renderSegments();
      renderCounts();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      render();
    }

    function prevQuestion() {
      currentIndex = (currentIndex - 1 + questions.length) % questions.length;
      render();
    }

    render();
  </script>
