let currentIndex = 0;
const answers = {};

function renderProgress() {
  const progress = document.getElementById('progress');
  progress.innerHTML = '';
  questions.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'seg' + (answers[q.id] ? ' answered' : '') + (idx === currentIndex ? ' active' : '');
    btn.title = q.topic || `Question ${idx + 1}`;
    btn.onclick = () => { currentIndex = idx; renderQuestion(); };
    progress.appendChild(btn);
  });
}

function renderScore() {
  let right = 0;
  let wrong = 0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (!q) return;
    if (choice === q.correct) right++; else wrong++;
  });
  document.getElementById('rightCount').textContent = right;
  document.getElementById('wrongCount').textContent = wrong;
}

function renderQuestion() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  document.getElementById('qNum').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('topic').textContent = `Topic: ${q.topic}`;
  document.getElementById('stem').textContent = q.stem;
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    if (selected && letter === q.correct) btn.classList.add('correct');
    if (selected && letter === selected && letter !== q.correct) btn.classList.add('incorrect');
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; renderQuestion(); };
    optionsDiv.appendChild(btn);
  });
  const exp = document.getElementById('explanation');
  if (selected) {
    const isCorrect = selected === q.correct;
    exp.style.display = 'block';
    exp.innerHTML = `
      <p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p>
      <p style="color:${isCorrect ? '#047857' : '#b91c1c'};"><strong>${isCorrect ? 'Nice job.' : 'Good attempt.'}</strong> ${q.explanation}</p>
      <div class="option-explanations"><p><strong>Why each option is right or wrong:</strong></p>
      ${Object.entries(q.optionExplanations).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('')}
      </div>`;
  } else {
    exp.style.display = 'none';
    exp.innerHTML = '';
  }
  renderProgress();
  renderScore();
}

function nextQuestion() { currentIndex = (currentIndex + 1) % questions.length; renderQuestion(); }
function prevQuestion() { currentIndex = (currentIndex - 1 + questions.length) % questions.length; renderQuestion(); }
renderQuestion();
</script>
