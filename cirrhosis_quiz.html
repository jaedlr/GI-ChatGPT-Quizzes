    let currentIndex = 0;
    const answers = {};

    const segmentsEl = document.getElementById("segments");
    const progressText = document.getElementById("progressText");
    const wrongCount = document.getElementById("wrongCount");
    const rightCount = document.getElementById("rightCount");
    const questionCount = document.getElementById("questionCount");
    const topicText = document.getElementById("topicText");
    const stemEl = document.getElementById("stem");
    const optionsEl = document.getElementById("options");
    const explanationEl = document.getElementById("explanation");

    function updateCounts() {
      let right = 0;
      let wrong = 0;
      Object.entries(answers).forEach(([qid, choice]) => {
        const q = questions.find((item) => item.id === Number(qid));
        if (!q) return;
        if (choice === q.correct) right += 1;
        else wrong += 1;
      });
      rightCount.textContent = right;
      wrongCount.textContent = wrong;
    }

    function renderSegments() {
      segmentsEl.innerHTML = "";
      questions.forEach((q, idx) => {
        const button = document.createElement("button");
        button.className = "segment" +
          (answers[q.id] !== undefined ? " answered" : "") +
          (idx === currentIndex ? " active" : "");
        button.title = q.topic || `Question ${idx + 1}`;
        button.setAttribute("aria-label", `Go to question ${idx + 1}`);
        button.addEventListener("click", () => {
          currentIndex = idx;
          render();
        });
        segmentsEl.appendChild(button);
      });
    }

    function renderOptions(q, selectedChoice) {
      optionsEl.innerHTML = "";
      Object.entries(q.options).forEach(([letter, text]) => {
        const button = document.createElement("button");
        let cls = "option";
        if (selectedChoice !== null && letter === q.correct) cls += " correct";
        else if (selectedChoice !== null && letter === selectedChoice && letter !== q.correct) cls += " incorrect";
        button.className = cls;
        button.innerHTML = `<strong>${letter}.</strong> ${text}`;
        button.addEventListener("click", () => {
          answers[q.id] = letter;
          render();
        });
        optionsEl.appendChild(button);
      });
    }

    function renderExplanation(q, selectedChoice) {
      if (selectedChoice === null) {
        explanationEl.style.display = "none";
        explanationEl.innerHTML = "";
        return;
      }
      const isCorrect = selectedChoice === q.correct;
      const optionLines = Object.entries(q.optionExplanations || {})
        .map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`)
        .join("");
      explanationEl.style.display = "block";
      explanationEl.innerHTML = `
        <p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p>
        <p class="${isCorrect ? "green-text" : "red-text"}">${isCorrect ? "Nice job. " : "Good attempt. "}${q.explanation}</p>
        <div class="option-explanations">
          <p><strong>Why each option is right or wrong:</strong></p>
          ${optionLines}
        </div>
      `;
    }

    function goToQuestion(index) {
      if (index < 0) currentIndex = questions.length - 1;
      else if (index >= questions.length) currentIndex = 0;
      else currentIndex = index;
      render();
    }

    function render() {
      const q = questions[currentIndex];
      const selectedChoice = answers[q.id] !== undefined ? answers[q.id] : null;

      progressText.textContent = `${currentIndex + 1} / ${questions.length}`;
      questionCount.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      topicText.textContent = q.topic ? `Topic: ${q.topic}` : "";
      stemEl.textContent = `${q.stem}?`;

      renderSegments();
      renderOptions(q, selectedChoice);
      renderExplanation(q, selectedChoice);
      updateCounts();
    }

    document.getElementById("prevButton").addEventListener("click", () => goToQuestion(currentIndex - 1));
    document.getElementById("nextButton").addEventListener("click", () => goToQuestion(currentIndex + 1));

    render();
  </script>
