<script>
const questions = [{"id": 1, "stem": "A 46 year old woman undergoes abdominal ultrasound for unrelated renal colic. A solitary lesion is found in the right hepatic lobe. Liver function tests are normal, and Tc-99m labeled RBC scan supports a vascular lesion composed of cavernous spaces. Which diagnosis is most likely", "topic": "Hemangioma", "options": {"A": "Hepatic adenoma", "B": "Hepatocellular carcinoma", "C": "Hemangioma", "D": "Pyogenic liver abscess"}, "correct": "C", "explanation": "Hemangioma is the most common benign liver tumor. The notes describe it as a benign vascular tumor with cavernous vascular spaces, usually asymptomatic, often solitary in the right upper lobe, with normal LFTs and imaging by US, CT, MRI, or Tc-99 RBC scan.", "optionExplanations": {"A": "Hepatic adenoma is linked to OCPs, pregnancy, or anabolic steroids and consists of hepatocytes without portal tracts or Kupffer cells.", "B": "HCC is malignant and is suggested by cirrhosis, rising AFP, worsening liver function, and vascular invasion.", "C": "Correct. Normal LFTs plus a vascular cavernous lesion supports hemangioma.", "D": "Pyogenic abscess presents with fever, RUQ pain, jaundice, elevated alkaline phosphatase, and positive cultures."}}, {"id": 2, "stem": "A 30 year old woman who takes combined oral contraceptives develops sudden right upper quadrant pain during menses with hypotension. Imaging shows a hepatic mass, and histology would show sheets of hepatocytes without portal tracts or Kupffer cells. What is the most appropriate next step emphasized in the notes", "topic": "Hepatic adenoma management", "options": {"A": "Stop oral contraceptives and resect if symptomatic", "B": "Needle aspiration to decompress the lesion", "C": "No treatment because malignant transformation is impossible", "D": "Albendazole followed by formalin injection"}, "correct": "A", "explanation": "Hepatic adenoma is associated with OCP/estrogen use, pregnancy, and anabolic steroids. It has hemorrhage risk, especially with menses or pregnancy, and the notes emphasize stopping OCPs and resecting symptomatic lesions.", "optionExplanations": {"A": "Correct. Stop OCPs is the starred management point, and symptomatic/ruptured lesions may require surgical resection.", "B": "Needle aspiration is specifically avoided for hydatid cysts and is not the management of hemorrhagic adenoma.", "C": "Hepatic adenoma has malignant potential listed as less than 12%, so this is not impossible.", "D": "Albendazole and cyst inactivation are used for hydatid cyst, not hepatic adenoma."}}, {"id": 3, "stem": "A 59 year old man with cirrhosis due to chronic hepatitis C has weight loss, abdominal pain, jaundice, and bloody ascites. Labs show worsening liver function, elevated alkaline phosphatase, and AFP greater than 400 ng/mL. Which tumor is most likely", "topic": "Hepatocellular carcinoma", "options": {"A": "Hemangioma", "B": "Metastatic colon cancer to liver", "C": "Simple hepatic cyst", "D": "Hepatocellular carcinoma"}, "correct": "D", "explanation": "Cirrhosis plus AFP greater than 400 ng/mL strongly suggests hepatocellular carcinoma. The section lists cirrhosis, chronic HBV/HCV, alcohol, aflatoxin, hemochromatosis, and steroids as HCC risk factors.", "optionExplanations": {"A": "Hemangioma is benign, usually asymptomatic, and has normal LFTs without AFP elevation.", "B": "Metastases are common liver malignancies in the US, but AFP greater than 400 in a cirrhotic patient points to HCC.", "C": "A simple cyst contains clear fluid, usually has normal labs, and does not explain AFP elevation.", "D": "Correct. Cirrhosis plus markedly elevated AFP is the high-yield HCC pattern."}}, {"id": 4, "stem": "A patient with known cancer develops multiple hepatic lesions. The notes state that secondary malignant tumors are the most common liver malignancy in the United States. Which primary cancer is listed as the most common source", "topic": "Liver metastases", "options": {"A": "Breast", "B": "Lung", "C": "Stomach", "D": "Kidney"}, "correct": "B", "explanation": "The liver masses section lists metastatic tumors as the most common liver malignancy in the US and ranks primary sources as lung greater than colon greater than pancreas greater than breast greater than stomach greater than others.", "optionExplanations": {"A": "Breast is listed after lung, colon, and pancreas as a source of liver metastases.", "B": "Correct. Lung is listed first among primary cancers that metastasize to the liver.", "C": "Stomach is listed, but below lung, colon, pancreas, and breast.", "D": "Kidney is not the top source in the listed sequence."}}, {"id": 5, "stem": "A newborn has several cutaneous hemangiomas. The pediatric team considers screening for an underlying hepatic lesion. Which liver mass does this skin finding suggest", "topic": "Cutaneous hemangiomas and liver hemangioma", "options": {"A": "Hepatic adenoma", "B": "Hydatid cyst", "C": "Hepatic hemangioma", "D": "Amebic abscess"}, "correct": "C", "explanation": "The notes specifically flag cutaneous hemangiomas in children as a marker or clue for underlying hepatic hemangiomas.", "optionExplanations": {"A": "Hepatic adenoma is associated with OCPs, pregnancy, and anabolic steroids, not cutaneous hemangiomas.", "B": "Hydatid cyst is associated with Echinococcus exposure from dog feces and contains hydatid sand.", "C": "Correct. Cutaneous hemangiomas in children are a clue to hepatic hemangiomas.", "D": "Amebic abscess is due to Entamoeba histolytica portal spread after colon invasion."}}, {"id": 6, "stem": "A 37 year old man using anabolic steroids has an incidental hepatic mass. Biopsy would show sheets of hepatocytes lacking portal tracts and Kupffer cells. Which additional feature is most characteristic of this lesion", "topic": "Hepatic adenoma pathology", "options": {"A": "Cavernous vascular spaces with no malignant potential", "B": "Malignant hepatocytes with portal vein invasion", "C": "Hydatid sand within a cystic cavity", "D": "Risk of hemorrhage with possible intraperitoneal shock"}, "correct": "D", "explanation": "Hepatic adenoma is a benign hepatocellular tumor linked to OCPs, estrogen, pregnancy, and anabolic steroids. Its pathology is sheets of hepatocytes without portal tracts or Kupffer cells, and it carries hemorrhage risk that can cause pain or shock.", "optionExplanations": {"A": "Cavernous vascular spaces describe hemangioma.", "B": "Malignant hepatocytes with vascular invasion describe HCC.", "C": "Hydatid sand describes Echinococcus hydatid cyst.", "D": "Correct. Hepatic adenoma can rupture or bleed, especially in menses or pregnancy, causing pain and shock."}}, {"id": 7, "stem": "A cirrhotic patient is enrolled in surveillance because of increased risk for hepatocellular carcinoma. Which screening strategy is listed in the liver masses section", "topic": "HCC screening", "options": {"A": "AFP plus ultrasound every 6 months", "B": "Annual serum alkaline phosphatase only", "C": "CT-guided biopsy every 3 months", "D": "Tc-99m RBC scan every 2 years"}, "correct": "A", "explanation": "The notes list HCC screening in cirrhotic patients as AFP plus ultrasound every 6 months.", "optionExplanations": {"A": "Correct. AFP and ultrasound every 6 months is the stated screening approach.", "B": "Alkaline phosphatase may be elevated in HCC or abscess but is not the listed screening test.", "C": "Routine repeated biopsy is not the listed screening approach.", "D": "Tc-99m RBC scan is used for hemangioma evaluation, not HCC surveillance."}}, {"id": 8, "stem": "A patient from an endemic region has a cystic hepatic lesion. The cyst contents include hydatid sand, and there is concern that rupture could trigger anaphylaxis. Which organism causes this lesion", "topic": "Hydatid cyst", "options": {"A": "Entamoeba histolytica", "B": "Staphylococcus aureus", "C": "Echinococcus", "D": "Clonorchis sinensis"}, "correct": "C", "explanation": "Hydatid cysts are caused by Echinococcus exposure, classically associated with dog feces. They contain hydatid sand and may rupture, causing anaphylaxis, biliary obstruction, or other serious complications.", "optionExplanations": {"A": "Entamoeba histolytica causes amebic liver abscess after trophozoites invade the colon and spread through the portal system.", "B": "Pyogenic liver abscesses are polymicrobial bacterial infections rather than hydatid cysts.", "C": "Correct. Echinococcus causes hydatid cysts with hydatid sand and rupture/anaphylaxis risk.", "D": "Clonorchis is a biliary fluke associated with cholangitis and cholangiocarcinoma, not hydatid sand."}}, {"id": 9, "stem": "A 51 year old woman has a simple hepatic cyst discovered incidentally. She has no symptoms, normal labs, and no evidence of biliary obstruction. What is the recommended management listed in the notes", "topic": "Simple hepatic cyst", "options": {"A": "Immediate formalin injection", "B": "No treatment other than monitoring", "C": "Metronidazole plus iodoquinol", "D": "TACE"}, "correct": "B", "explanation": "Simple hepatic cysts are congenital benign cysts containing clear fluid. They are often asymptomatic, have normal labs, and are managed with no treatment other than monitoring unless complications occur.", "optionExplanations": {"A": "Formalin injection is described for hydatid cyst inactivation, not simple cysts.", "B": "Correct. Simple cysts are monitored when asymptomatic.", "C": "Metronidazole plus a luminal amebicide is for amebic abscess.", "D": "TACE is a treatment option for HCC, not simple cysts."}}, {"id": 10, "stem": "A patient with a hydatid cyst asks why the team will not perform needle aspiration. What is the best explanation", "topic": "Hydatid cyst management", "options": {"A": "Hydatid cysts always regress spontaneously within 24 hours", "B": "Aspiration prevents albendazole from working", "C": "Aspiration converts the cyst into hepatocellular carcinoma", "D": "Rupture or aspiration may spill contents and trigger anaphylaxis or spread"}, "correct": "D", "explanation": "The notes emphasize no needle aspiration for hydatid cysts because rupture of contents can cause infection, anaphylaxis, jaundice, biliary obstruction, and potential mortality.", "optionExplanations": {"A": "Hydatid cysts do not reliably regress spontaneously; treatment includes albendazole and surgical removal when indicated.", "B": "The issue is spillage/rupture risk, not failure of albendazole.", "C": "Hydatid cyst aspiration does not convert the lesion into HCC.", "D": "Correct. Hydatid cyst rupture or aspiration can spill antigenic contents and cause anaphylaxis or other severe complications."}}, {"id": 11, "stem": "A diabetic patient with hepatobiliary disease presents with fever, right upper quadrant pain, jaundice, nausea, and weight loss. Labs show elevated alkaline phosphatase and bilirubin, and blood cultures are positive. Which diagnosis is most likely", "topic": "Pyogenic liver abscess", "options": {"A": "Pyogenic liver abscess", "B": "Hemangioma", "C": "Simple hepatic cyst", "D": "Hepatic adenoma"}, "correct": "A", "explanation": "Pyogenic liver abscess is a polymicrobial bacterial abscess. Risk factors include diabetes, hepatobiliary disease, obstruction, cirrhosis, and transplant; presentation includes fever, RUQ pain, jaundice, weight loss, nausea/vomiting, and malaise with elevated alkaline phosphatase and positive cultures.", "optionExplanations": {"A": "Correct. Fever, RUQ pain, jaundice, elevated alkaline phosphatase, and positive cultures fit pyogenic abscess.", "B": "Hemangioma is usually incidental with normal LFTs.", "C": "Simple cyst is usually asymptomatic with clear fluid and normal labs.", "D": "Hepatic adenoma is linked to OCPs/steroids and hemorrhage, not fever with positive cultures."}}, {"id": 12, "stem": "A man returns from travel to an endemic region and later develops fever, malaise, weight loss, and RUQ pain. He has leukocytosis without eosinophilia, elevated alkaline phosphatase, and a liver abscess. Stool studies are rarely positive. Which definitive test is listed", "topic": "Amebic liver abscess diagnosis", "options": {"A": "Tc-99m RBC scan", "B": "Blood culture only", "C": "Serology by EIA", "D": "AFP level"}, "correct": "C", "explanation": "Amebic liver abscess is caused by Entamoeba histolytica. The notes list serology by EIA as the definitive diagnosis, with stool rarely positive.", "optionExplanations": {"A": "Tc-99m RBC scan is used in hemangioma workup.", "B": "Blood cultures are more relevant to pyogenic abscess, not definitive for amebic abscess.", "C": "Correct. Serology by EIA is listed as the definitive diagnostic test for amebic abscess.", "D": "AFP is used for HCC, especially in cirrhotic patients."}}, {"id": 13, "stem": "A 43 year old patient has a pyogenic liver abscess after ascending cholangitis. Which treatment regimen best matches the notes", "topic": "Pyogenic liver abscess treatment", "options": {"A": "Albendazole alone for 3 to 6 months", "B": "Observation only", "C": "PPI plus clarithromycin and amoxicillin", "D": "Drainage plus broad antibiotics such as piperacillin-tazobactam or ampicillin-sulbactam with metronidazole"}, "correct": "D", "explanation": "The treatment listed for pyogenic liver abscess is drainage plus broad antibiotics, specifically piperacillin-tazobactam or ampicillin-sulbactam plus metronidazole.", "optionExplanations": {"A": "Albendazole is the drug of choice listed for hydatid cyst, not pyogenic abscess.", "B": "Pyogenic abscess requires treatment; observation alone is inappropriate.", "C": "PPI-based therapy is for H. pylori/PUD, not liver abscess.", "D": "Correct. Drainage plus broad-spectrum antibiotics is the listed treatment."}}, {"id": 14, "stem": "A patient with amebic liver abscess is treated with metronidazole. Why is iodoquinol added afterward according to the section", "topic": "Amebic liver abscess treatment", "options": {"A": "To lower AFP", "B": "To eradicate luminal intestinal infection", "C": "To dissolve cavernous vascular spaces", "D": "To prevent OCP-related tumor growth"}, "correct": "B", "explanation": "Amebic liver abscess treatment is metronidazole for tissue disease plus a luminal amebicide such as iodoquinol to eliminate intestinal colonization.", "optionExplanations": {"A": "AFP relates to HCC, not amebic abscess treatment.", "B": "Correct. A luminal amebicide clears remaining intestinal amebae after metronidazole.", "C": "Cavernous vascular spaces describe hemangioma and are not treated with iodoquinol.", "D": "Stopping OCPs is management for hepatic adenoma, not amebic abscess."}}, {"id": 15, "stem": "A 64 year old man with alcoholic cirrhosis has a new solitary hepatic lesion on screening ultrasound. According to the solitary lesion approach in the notes, how should this lesion be considered initially", "topic": "Solitary lesion in cirrhosis", "options": {"A": "Assume HCC until proven otherwise", "B": "Assume simple cyst regardless of imaging", "C": "Ignore unless larger than 5 cm", "D": "Treat as hydatid cyst and avoid all imaging"}, "correct": "A", "explanation": "The solitary lesion approach states that in a cirrhotic patient, a hepatic lesion should be assumed to be HCC until proven otherwise.", "optionExplanations": {"A": "Correct. Cirrhosis shifts concern toward HCC for a new liver lesion.", "B": "A simple cyst is not assumed in a cirrhotic patient with a new lesion.", "C": "Lesion size alone is not the rule; cirrhosis is the key context.", "D": "Hydatid cyst is suggested by dog exposure/endemic cystic disease, not cirrhosis alone."}}, {"id": 16, "stem": "A 6 mm hepatic lesion is found incidentally in a low-risk patient. It is less than 1 cm and has no suspicious features. Which action is recommended by the solitary lesion approach", "topic": "Small solitary liver lesion", "options": {"A": "Immediate TACE", "B": "Transplant evaluation", "C": "Hydatid cyst aspiration", "D": "Observe with follow-up imaging"}, "correct": "D", "explanation": "For a less than 1 cm lesion, the section's solitary lesion approach recommends observation and follow-up imaging.", "optionExplanations": {"A": "TACE is a treatment option for HCC, not an incidental subcentimeter lesion without suspicious features.", "B": "Transplant is an HCC treatment option in selected cases, not initial management here.", "C": "Needle aspiration is contraindicated for hydatid cyst and not indicated for a nonsuspicious small lesion.", "D": "Correct. Lesions under 1 cm are observed with follow-up imaging."}}, {"id": 17, "stem": "A 50 year old patient has a suspicious solid hepatic lesion on ultrasound. The section's solitary lesion approach recommends which next diagnostic step", "topic": "Suspicious solitary liver lesion", "options": {"A": "No follow-up needed", "B": "Empiric albendazole only", "C": "CT or MRI", "D": "Immediate oral contraceptive cessation only"}, "correct": "C", "explanation": "The solitary lesion approach states that suspicious lesions should be evaluated with CT or MRI.", "optionExplanations": {"A": "No follow-up is not appropriate for a suspicious lesion.", "B": "Albendazole is used for hydatid cyst, not all suspicious solid liver lesions.", "C": "Correct. CT or MRI is the recommended next imaging step for suspicious lesions.", "D": "Stopping OCPs is appropriate for hepatic adenoma, but not the general first step for suspicious lesions."}}, {"id": 18, "stem": "A patient has a liver abscess. Imaging cannot distinguish pyogenic from amebic abscess. Which feature supports an amebic rather than pyogenic abscess", "topic": "Pyogenic vs amebic liver abscess", "options": {"A": "Positive blood cultures with polymicrobial bacteria", "B": "Travel or endemic exposure with stool rarely positive", "C": "Cavernous vascular spaces", "D": "AFP greater than 400 ng/mL"}, "correct": "B", "explanation": "The notes state that imaging cannot distinguish pyogenic from amebic abscess. Amebic abscess is supported by travel/endemic exposure; stool is rarely positive, and definitive diagnosis is serology by EIA.", "optionExplanations": {"A": "Positive blood cultures support pyogenic abscess.", "B": "Correct. Endemic exposure with rare stool positivity fits amebic abscess.", "C": "Cavernous vascular spaces describe hemangioma.", "D": "AFP greater than 400 suggests HCC."}}, {"id": 19, "stem": "A hepatic abscess forms after biliary obstruction and ascending cholangitis. According to the notes, which route/pathogenesis is most common in the United States for pyogenic abscess", "topic": "Pyogenic abscess pathogenesis", "options": {"A": "Direct invasion by trophozoites after colonic ulcers only", "B": "Hematogenous spread from lung cancer", "C": "Congenital clear-fluid cyst formation", "D": "Biliary obstruction leading to ascending cholangitis"}, "correct": "D", "explanation": "For pyogenic liver abscess, the notes list biliary obstruction leading to ascending cholangitis as the most common US pathogenesis, followed by portal spread and hematogenous spread.", "optionExplanations": {"A": "Trophozoite invasion with portal spread describes amebic abscess.", "B": "Lung cancer is listed as the most common primary source of liver metastases, not pyogenic abscess pathogenesis.", "C": "Congenital clear-fluid cyst formation describes simple cyst.", "D": "Correct. Ascending cholangitis from biliary obstruction is the most common US pathway."}}, {"id": 20, "stem": "A patient with a confirmed hydatid cyst is treated medically before planned surgical management. Which drug and dosing concept is listed as the drug of choice in the notes", "topic": "Hydatid cyst treatment", "options": {"A": "Albendazole 800 mg three times daily for 3 to 6 months", "B": "Metronidazole 500 to 750 mg three times daily for 7 to 10 days only", "C": "Piperacillin-tazobactam plus metronidazole only", "D": "Ethanol injection for lesions under 2 cm"}, "correct": "A", "explanation": "Hydatid cyst treatment in the section includes albendazole 800 mg three times daily for 3 to 6 months as the drug of choice, surgical removal, and cyst inactivation when appropriate. Needle aspiration is avoided.", "optionExplanations": {"A": "Correct. Albendazole is the listed drug of choice for hydatid cyst.", "B": "Metronidazole plus luminal amebicide is for amebic liver abscess.", "C": "Broad antibiotics plus drainage is for pyogenic liver abscess.", "D": "Ethanol injection is listed as an HCC treatment option for lesions under 2 cm."}}, {"id": 21, "stem": "A man with hemochromatosis develops abdominal pain, weight loss, jaundice, and a hepatic mass. Which statement best connects his underlying disease to the likely malignancy", "topic": "HCC risk factors", "options": {"A": "Hemochromatosis protects against liver malignancy", "B": "Hemochromatosis specifically causes hydatid sand formation", "C": "Hemochromatosis is listed as a risk factor for hepatocellular carcinoma", "D": "Hemochromatosis causes only simple cysts"}, "correct": "C", "explanation": "The HCC risk factors listed include cirrhosis of any cause, chronic HBV/HCV, alcohol, aflatoxin, hemochromatosis, and steroids.", "optionExplanations": {"A": "Hemochromatosis is not protective; it is listed as an HCC risk factor.", "B": "Hydatid sand is from Echinococcus hydatid cyst, not hemochromatosis.", "C": "Correct. Hemochromatosis is one of the listed risk factors for HCC.", "D": "Simple cysts are congenital benign cysts, unrelated to hemochromatosis in the notes."}}, {"id": 22, "stem": "A patient with a hepatic hemangioma asks about prognosis. The lesion is small and asymptomatic. What is the best answer based on the section", "topic": "Hemangioma treatment and prognosis", "options": {"A": "It has high malignant potential and requires chemotherapy", "B": "Prognosis is excellent, and no treatment is needed unless the lesion is larger than 5 cm or symptomatic", "C": "It should be aspirated immediately to prevent anaphylaxis", "D": "It requires AFP plus ultrasound every 6 months"}, "correct": "B", "explanation": "Hemangioma has no malignant potential in the table and an excellent prognosis. Treatment is none unless greater than 5 cm or symptomatic, in which case resection may be considered.", "optionExplanations": {"A": "Hemangioma is benign and has no malignant potential in the table.", "B": "Correct. Small asymptomatic hemangiomas are typically not treated and have excellent prognosis.", "C": "Anaphylaxis risk with aspiration is a hydatid cyst issue, not hemangioma management.", "D": "AFP plus ultrasound surveillance is for HCC screening in cirrhosis."}}, {"id": 23, "stem": "A cirrhotic patient has a 3 cm hepatocellular carcinoma. Which local treatment option is specifically listed for HCC lesions less than 4 cm", "topic": "HCC treatment", "options": {"A": "Luminal iodoquinol", "B": "Albendazole only", "C": "No treatment because survival is excellent overall", "D": "Radiofrequency ablation"}, "correct": "D", "explanation": "The HCC treatment options listed include resection, transplant, radiofrequency ablation for lesions less than 4 cm, TACE, and ethanol injection for lesions less than 2 cm.", "optionExplanations": {"A": "Iodoquinol is a luminal amebicide used after metronidazole for amebic abscess.", "B": "Albendazole is for hydatid cyst.", "C": "The notes list poor overall 5-year survival for HCC; treatment is not observation by default.", "D": "Correct. RFA is specifically listed for HCC smaller than 4 cm."}}, {"id": 24, "stem": "A 1.5 cm hepatocellular carcinoma is being considered for local therapy. Which treatment option is specifically listed for lesions less than 2 cm", "topic": "HCC ethanol injection", "options": {"A": "Ethanol injection", "B": "Formalin injection with cyst removal only", "C": "Luminal amebicide alone", "D": "Beta-blocker prophylaxis"}, "correct": "A", "explanation": "The HCC treatment list includes ethanol injection for lesions less than 2 cm.", "optionExplanations": {"A": "Correct. Ethanol injection is listed for HCC lesions under 2 cm.", "B": "Formalin injection is described for hydatid cyst inactivation, not HCC.", "C": "Luminal amebicide is for intestinal Entamoeba clearance after amebic abscess treatment.", "D": "Beta-blockers relate to portal hypertension/variceal prevention, not HCC local treatment."}}, {"id": 25, "stem": "A patient with untreated amebic liver abscess develops pleuritic symptoms and neurologic findings. Which special note from the section explains this complication", "topic": "Amebic abscess spread", "options": {"A": "Amebic abscesses never spread beyond the liver", "B": "Amebic abscesses transform into hepatic adenomas", "C": "Amebic abscess may spread to heart, lung, or brain", "D": "Amebic abscess always causes eosinophilia"}, "correct": "C", "explanation": "The amebic abscess notes state that it may spread to the heart, lung, or brain. It also emphasizes leukocytosis without eosinophilia.", "optionExplanations": {"A": "The notes specifically say amebic abscess may spread beyond the liver.", "B": "There is no transformation into hepatic adenoma described.", "C": "Correct. Spread to heart, lung, or brain is listed as a special note.", "D": "The notes state leukocytosis without eosinophilia, not eosinophilia."}}, {"id": 26, "stem": "A hepatic lesion contains clear fluid and is described as a congenital benign cyst. It is usually asymptomatic unless large. Which diagnosis best fits", "topic": "Simple cyst vs hydatid cyst", "options": {"A": "Hydatid cyst", "B": "Simple hepatic cyst", "C": "Pyogenic abscess", "D": "Hepatocellular carcinoma"}, "correct": "B", "explanation": "Simple hepatic cysts are congenital benign cysts containing clear fluid. They affect about 1% of the population and are usually asymptomatic unless large.", "optionExplanations": {"A": "Hydatid cyst is due to Echinococcus and contains hydatid sand, not just clear fluid.", "B": "Correct. Congenital benign cyst with clear fluid is a simple hepatic cyst.", "C": "Pyogenic abscess contains pus and presents with infectious symptoms.", "D": "HCC is a primary malignant tumor with malignant hepatocytes and vascular invasion."}}, {"id": 27, "stem": "A woman with a large liver cyst develops jaundice and signs of biliary obstruction after cyst rupture. She also has exposure to dog feces in an endemic area. Which complication is particularly feared with this cyst type", "topic": "Hydatid cyst complications", "options": {"A": "Painless nocturnal perianal pruritus", "B": "Achalasia from loss of inhibitory neurons", "C": "Mallory-Weiss tear", "D": "Anaphylaxis"}, "correct": "D", "explanation": "Hydatid cyst rupture can cause anaphylaxis. The section also lists cholestasis, portal hypertension, Budd-Chiari, infection, jaundice, biliary obstruction, and potential mortality.", "optionExplanations": {"A": "Nocturnal perianal pruritus is Enterobius, not liver hydatid disease.", "B": "Achalasia is an esophageal motility disorder unrelated to hydatid cyst.", "C": "Mallory-Weiss tear is a mucosal tear after retching, not a cyst complication.", "D": "Correct. Anaphylaxis is the classic feared complication of hydatid cyst rupture."}}, {"id": 28, "stem": "A 58 year old man with cirrhosis has a liver mass. Pathology shows malignant hepatocytes with a tendency for vascular invasion. Which vessel invasion pattern is specifically emphasized in the broader liver masses notes", "topic": "HCC pathology", "options": {"A": "Splenic artery only", "B": "Cystic duct only", "C": "Portal vein or inferior vena cava invasion", "D": "Inferior mesenteric vein only"}, "correct": "C", "explanation": "HCC is described as malignant hepatocytes with vascular invasion. The liver neoplasm notes emphasize propensity to invade blood vessels such as the portal vein or inferior vena cava.", "optionExplanations": {"A": "Splenic artery invasion is not the vessel pattern emphasized for HCC.", "B": "Cystic duct involvement is more biliary tract anatomy and not the emphasized HCC patter r.", "C": "Metastases are the most common liver malignancy in the US, but they are secondary, not primary.", "D": "Simple cyst is a congenital benign cyst, not a primary cancer."}}];
let currentIndex = 0;
const answers = {};
const segmentsEl = document.getElementById('segments');
const progressEl = document.getElementById('progress');
const wrongCountEl = document.getElementById('wrongCount');
const rightCountEl = document.getElementById('rightCount');
const qNumEl = document.getElementById('qNum');
const topicEl = document.getElementById('topic');
const stemEl = document.getElementById('stem');
const optionsEl = document.getElementById('options');
const explanationEl = document.getElementById('explanation');
function renderSegments() {
  segmentsEl.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('button');
    b.className = 'seg' + (idx === currentIndex ? ' active' : '') + (answers[q.id] !== undefined ? ' answered' : '');
    b.title = q.topic || `Question ${idx + 1}`;
    b.setAttribute('aria-label', `Go to question ${idx + 1}`);
    b.onclick = () => { currentIndex = idx; render(); };
    segmentsEl.appendChild(b);
  });
}
function renderCounts() {
  let right = 0, wrong = 0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (q && choice === q.correct) right++; else if (q) wrong++;
  });
  rightCountEl.textContent = right;
  wrongCountEl.textContent = wrong;
}
function renderQuestion() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  const showExplanation = selected !== null;
  progressEl.textContent = `${currentIndex + 1} / ${questions.length}`;
  qNumEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  topicEl.textContent = q.topic ? `Topic: ${q.topic}` : '';
  stemEl.textContent = q.stem + '?';
  optionsEl.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (showExplanation && letter === q.correct) btn.className += ' correct';
    else if (showExplanation && letter === selected && letter !== q.correct) btn.className += ' wrong';
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    optionsEl.appendChild(btn);
  });
  explanationEl.innerHTML = '';
  if (showExplanation) {
    const div = document.createElement('div');
    div.className = 'explanation';
    const isCorrect = selected === q.correct;
    const lines = Object.entries(q.optionExplanations || {}).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('');
    div.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p><p class="${isCorrect ? 'correctText' : 'wrongText'}">${isCorrect ? 'Nice job. ' : 'Good attempt. '}${q.explanation}</p><div><p><strong>Why each option is right or wrong:</strong></p>${lines}</div>`;
    explanationEl.appendChild(div);
  }
}
function render() { renderSegments(); renderCounts(); renderQuestion(); }
document.getElementById('prev').onclick = () => { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); };
document.getElementById('next').onclick = () => { currentIndex = (currentIndex + 1) % questions.length; render(); };
render();
</script>
