ts urea to ammonia and carbon dioxide; increased labeled CO2 after ingestion is positive.", "optionExplanations": {"A": "Catalase is not the enzyme measured by the urea breath test.", "B": "Coagulase is a staphylococcal enzyme and is unrelated to H. pylori breath testing.", "C": "Beta-lactamase confers antibiotic resistance in some bacteria but is not the diagnostic target here.", "D": "Correct. Urease splits urea and generates labeled CO2 detected in breath."}}, {"id": 7, "stem": "A patient is diagnosed with peptic ulcer disease. Which two sites are listed as the most common locations for these chronic ulcers", "topic": "Peptic ulcer disease location", "options": {"A": "Proximal duodenum and gastric antrum", "B": "Distal ileum and cecum", "C": "Esophageal mid-third and cardia", "D": "Rectum and sigmoid colon"}, "correct": "A", "explanation": "Peptic ulcer disease most commonly involves the proximal duodenum or the gastric antrum, especially near the body-antrum junction/lesser curvature for gastric ulcers.", "optionExplanations": {"A": "Correct. The proximal duodenum and gastric antrum are the classic PUD sites in this section.", "B": "These are lower intestinal locations, not typical PUD sites.", "C": "Esophageal disease is not the usual location for chronic gastric/duodenal peptic ulcers.", "D": "Rectosigmoid disease is unrelated to the usual PUD distribution."}}, {"id": 8, "stem": "A gastric ulcer is described grossly as solitary, round-to-oval, and sharply punched out with margins level with the surrounding mucosa. Which interpretation best fits this morphology", "topic": "Peptic ulcer gross morphology", "options": {"A": "Typical malignant ulcer with heaped-up margins", "B": "Diffuse-type gastric carcinoma with leather-bottle stomach", "C": "Benign peptic ulcer morphology", "D": "MALT lymphoma with lymphoepithelial lesions"}, "correct": "C", "explanation": "Benign peptic ulcers are usually solitary, round-to-oval, sharply punched-out lesions with margins level eeding occurs in up to 5%", "D": "Perforation occurs in up to 5%, while bleeding is the most common complication and occurs in up to 20%"}, "correct": "D", "explanation": "Bleeding is the most common peptic ulcer complication and occurs in up to 20%; perforation occurs in up to 5% and causes sudden severe pain.", "optionExplanations": {"A": "Bleeding, not perforation, is the most common complication.", "B": "Both perforation and obstruction are listed complications of PUD.", "C": "This reverses the listed frequencies.", "D": "Correct. Bleeding is most common; perforation is less common but serious."}}, {"id": 11, "stem": "A 66-year-old man develops gastric outlet obstruction after years of peptic ulcer disease. Which mechanism is listed for this complication", "topic": "Peptic ulcer obstruction", "options": {"A": "Chronic scarring", "B": "Loss of E-cadherin expression", "C": "Constitutive NF-kB activation in B cells", "D": "CagA-mediated urease production"}, "correct": "A", "explanation": "Chronic peptic ulcers can heal with fibrosis and scarring, producing gastric outlet obstruction.", "optionExplanations": {"A": "Correct. Chronic scarring is the mechanism of gastric outlet obstruction in PUD.", "B": "Loss of E-cadherin is associated with diffuse-type gastric adenocarcinoma.", "C": "Constitutive NF-kB activation is important in MALT lymphoma translocations.", "D": "CagA and urease are H. pylori virulence concepts but do not explain scarring obstruction."}}, {"id": 12, "stem": "A gastric cancer biopsy shows hyperchromatic columnar cells forming glands that infiltrate through desmoplastic stroma. Which Lauren subtype does this most likely represent", "topic": "Intestinal-type gastric adenocarcinoma", "options": {"A": "Diffuse-type adenocarcinoma", "B": "Intestinal-type adenocarcinoma", "C": "Gastric MALT lymphoma", "D": "Benign peptic ulcer disease"}, "correct": "B", "explanation": "Intestinal-type gastric adenocarcinoma is gland-forming and often appears as an exophytic or ulcerated mass; diffuse-type cancer is composed of discohesive signet-ring cells.", "optionExplanations": {"A": "Diffuse-type adenocarcinoma does not form glands; it infiltrates as small clusters or individual signet-ring cells.", "B": "Correct. Gland-forming tumor cells in desmoplastic stroma fit intestinal-type gastric adenocarcinoma.", "C": "MALT lymphoma shows lymphoid infiltration and lymphoepithelial lesions, not malignant glands.", "D": "Benign PUD lacks infiltrative malignant glands."}}, {"id": 13, "stem": "A patient has a thickened gastric wall with partial loss of rugal folds, creating a leather-bottle appearance. Microscopy shows large mucin vacuoles displacing nuclei to the periphery. Which gene abnormality is classically associated with this process", "topic": "Diffuse-type gastric adenocarcinoma genetics", "options": {"A": "APC gain-of-function mutation", "B": "ERBB2 overexpression only", "C": "CDH1 loss-of-function or promoter hypermethylation", "D": "BCR-ABL fusion"}, "correct": "C", "explanation": "Diffuse-type gastric adenocarcinoma is linked to CDH1 loss, causing loss of E-cadherin cell adhesion and discohesive signet-ring cells; grossly it can cause linitis plastica.", "optionExplanations": {"A": "APC loss-of-function, not gain-of-function, is part of the WNT pathway in intestinal-type cancers.", "B": "ERBB2 amplification is listed among intestinal-type molecular changes, not the classic diffuse-type driver.", "C": "Correct. CDH1 encodes E-cadherin; its loss produces discohesive signet-ring cells and linitis plastica.", "D": "BCR-ABL is unrelated to gastric adenocarcinoma in this section."}}, {"id": 14, "stem": "Which feature favors intestinal-type gastric adenocarcinoma over diffuse-type gastric adenocarcinoma", "topic": "Gastric adenocarcinoma subtype comparison", "options": {"A": "Uniform geographic distribution and 1:1 sex ratio", "B": "Signet-ring cells with no precursor lesion", "C": "Worse prognosis with linitis plastica", "D": "Metaplasia-to-dysplasia precursor sequence and gland formation"}, "correct": "D", "explanation": "Intestinal-type gastric adenocarcinoma follows a metaplasia-to-dysplasia precursor sequence, is gland-forming, and has a slightly better prognosis than diffuse-type disease.", "optionExplanations": {"A": "Uniform geography and 1:1 sex ratio describe diffuse-type disease.", "B": "Signet-ring cells and no precursor lesion describe diffuse-type disease.", "C": "Linitis plastica and worse prognosis favor diffuse-type disease.", "D": "Correct. Intestinal-type disease has a metaplasia-to-dysplasia precursor sequence and forms glands."}}, {"id": 15, "stem": "A tumor suppressor protein normally forms a destruction complex with beta-catenin when cells are not exposed to WNT. Loss of this protein allows beta-catenin to accumulate and activate cell-cycle genes. Which protein is lost", "topic": "WNT pathway and intestinal-type gastric cancer", "options": {"A": "E-cadherin", "B": "APC", "C": "CagA", "D": "BCL2"}, "correct": "B", "explanation": "APC is part of the beta-catenin destruction complex. APC loss prevents beta-catenin degradation, allowing nuclear translocation and upregulation of genes involved in cell-cycle progression.", "optionExplanations": {"A": "E-cadherin loss is linked to diffuse-type gastric cancer, not the beta-catenin destruction complex described here.", "B": "Correct. APC loss causes constitutive WNT pathway signaling via beta-catenin accumulation.", "C": "CagA is an H. pylori virulence factor associated with increased adenocarcinoma risk.", "D": "BCL2 is an anti-apoptotic protein and is not the WNT destruction-complex component here."}}, {"id": 16, "stem": "A molecular study of an intestinal-type gastric adenocarcinoma shows HER2 amplification. Which pathway category in the section includes HER2/ERBB2, EGFR, MET, and KRAS abnormalities", "topic": "Intestinal-type gastric adenocarcinoma molecular genetics", "options": {"A": "RTK-RAS pathway", "B": "Mismatch repair pathway only", "C": "NF-kB pathway only", "D": "E-cadherin adhesion pathway"}, "correct": "A", "explanation": "Intestinal-type gastric adenocarcinoma may have RTK-RAS pathway abnormalities including ERBB2/HER2 amplification, EGFR amplification, MET amplification, and KRAS gain-of-function mutations.", "optionExplanations": {"A": "Correct. HER2/ERBB2, EGFR, MET, and KRAS are listed under the RTK-RAS pathway.", "B": "Mismatch repair defects are not the pathway grouping described in this section.", "C": "NF-kB activation is central to MALT lymphoma pathogenesis/translocations, not this gene set.", "D": "E-cadherin/CDH1 is the classic diffuse-type pathway, not the HER2/EGFR/MET/KRAS group."}}, {"id": 17, "stem": "A gastric mass is diagnosed as diffuse-type adenocarcinoma. Which microscopic description is most expected", "topic": "Signet-ring cell morphology", "options": {"A": "Well-formed glands with mucin in an exophytic mass", "B": "Lymphocytes infiltrating gastric glands as lymphoepithelial lesions", "C": "Discohesive cells with large mucin vacuoles and peripheral crescent-shaped nuclei", "D": "Punched-out ulcer with level margins and fibrous scar base"}, "correct": "C", "explanation": "Diffuse-type gastric adenocarcinoma shows discohesive infiltrative cells, often signet-ring cells with large mucin vacuoles and peripherally displaced crescent nuclei.", "optionExplanations": {"A": "Gland formation and exophytic/ulcerated mass favor intestinal-type adenocarcinoma.", "B": "Lymphoepithelial lesions are characteristic of gastric MALT lymphoma.", "C": "Correct. This is the classic signet-ring morphology of diffuse-type gastric adenocarcinoma.", "D": "This describes benign peptic ulcer morphology."}}, {"id": 18, "stem": "A pathologist notes that a gastric malignancy consists of individual infiltrating cells that do not form glands. Which mechanism best explains this growth pattern", "topic": "CDH1 and loss of adhesion", "options": {"A": "APC-mediated beta-catenin destruction", "B": "Urease-mediated acid buffering", "C": "Neutrophil migration into surface epithelium", "D": "Loss of E-cadherin cell adhesion function"}, "correct": "D", "explanation": "Diffuse-type gastric cancer is driven by CDH1/E-cadherin loss, which impairs cell adhesion and produces discohesive infiltrative cells rather than gland formation.", "optionExplanations": {"A": "Loss of APC promotes WNT signaling in intestinal-type cancer, but it does not explain discohesive non-gland-forming cells.", "B": "Urease helps H. pylori survive acid but does not directly produce this carcinoma architecture.", "C": "Intraepithelial neutrophils indicate active H. pylori infection.", "D": "Correct. E-cadherin loss causes discohesive cells and diffuse infiltration."}}, {"id": 19, "stem": "A gastric carcinoma subtype has 50-60% of cases, male predominance of about 2:1, high-risk geographic distribution, and a slightly better prognosis than the other main subtype. Which subtype is this", "topic": "Intestinal-type gastric adenocarcinoma epidemiology", "options": {"A": "Intestinal-type adenocarcinoma", "B": "Diffuse-type adenocarcinoma", "C": "Gastric MALT lymphoma", "D": "Peptic ulcer disease"}, "correct": "A", "explanation": "Intestinal-type gastric adenocarcinoma accounts for about 50-60% of cases, has M:F ratio of about 2:1, is more common in high-risk areas, and has a slightly better prognosis than diffuse-type disease.", "optionExplanations": {"A": "Correct. These features match intestinal-type gastric adenocarcinoma.", "B": "Diffuse-type disease is 30-40% of cases, has a 1:1 sex ratio, uniform geographic distribution, and worse prognosis.", "C": "MALT lymphoma is a B-cell lymphoma associated with H. pylori, not a Lauren adenocarcinoma subtype.", "D": "PUD is ulceration, not a carcinoma subtype."}}, {"id": 20, "stem": "A stomach biopsy shows neoplastic lymphocytes infiltrating and destroying gastric glands. Immunophenotyping shows CD19+, CD20+ monoclonal B cells with clonal IgH let currentIndex = 0;
let answers = {};

function renderProgress() {
  const progress = document.getElementById('progress');
  progress.innerHTML = '';
  questions.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'segment' + (answers[q.id] ? ' answered' : '') + (idx === currentIndex ? ' active' : '');
    btn.title = q.topic || `Question ${idx + 1}`;
    btn.onclick = () => { currentIndex = idx; render(); };
    progress.appendChild(btn);
  });
}

function renderScore() {
  let right = 0;
  let wrong = 0;
  Object.entries(answers).forEach(([id, selected]) => {
    const q = questions.find(item => item.id === Number(id));
    if (!q) return;
    if (selected === q.correct) right++;
    else wrong++;
  });
  document.getElementById('rightCount').textContent = right;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('counter').textContent = `${currentIndex + 1} / ${questions.length}`;
}

function render() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  document.getElementById('questionNumber').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('topic').textContent = q.topic ? `Topic: ${q.topic}` : '';
  document.getElementById('stem').textContent = q.stem + '?';

  const answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (selected) {
      if (letter === q.correct) btn.classList.add('correct');
      else if (letter === selected) btn.classList.add('incorrect');
    }
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => {
      answers[q.id] = letter;
      render();
    };
    answersDiv.appendChild(btn);
  });

  const exp = document.getElementById('explanation');
  if (selected) {
    const correctness = selected === q.correct ? 'Nice job.' : 'Good attempt.';
    const optionRows = Object.entries(q.optionExplanations).map(([letter, text]) =>
      `<p><strong>${letter}.</strong> ${text}</p>`
    ).join('');
    exp.style.display = 'block';
    exp.innerHTML = `
      <p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p>
      <p>${correctness} ${q.explanation}</p>
      <div class="option-exp">
        <p><strong>Why each option is right or wrong:</strong></p>
        ${optionRows}
      </div>
    `;
  } else {
    exp.style.display = 'none';
    exp.innerHTML = '';
  }

  renderProgress();
  renderScore();
}

function goNext() {
  currentIndex = (currentIndex + 1) % questions.length;
  render();
}

function goPrev() {
  currentIndex = (currentIndex - 1 + questions.length) % questions.length;
  render();
}

function resetQuiz() {
  answers = {};
  currentIndex = 0;
  render();
}

render();
</script>
