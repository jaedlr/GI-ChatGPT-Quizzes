let currentIndex = 0;
const answers = {};
function renderSegments() {
  const el = document.getElementById('segments'); el.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('button');
    b.className = 'segment' + (answers[q.id] !== undefined ? ' answered' : '') + (idx === currentIndex ? ' active' : '');
    b.title = q.topic || `Question ${idx + 1}`;
    b.onclick = () => { currentIndex = idx; render(); };
    el.appendChild(b);
  });
}
function renderCounts() {
  let right = 0, wrong = 0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (q && choice === q.correct) right++; else if (q) wrong++;
  });
  document.getElementById('rightCount').textContent = right;
  document.getElementById('wrongCount').textContent = wrong;
}
function render() {
  const q = questions[currentIndex]; const selected = answers[q.id] || null;
  document.getElementById('progressText').textContent = `${currentIndex + 1} / ${questions.length}`;
  document.getElementById('questionNumber').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('topic').textContent = q.topic ? `Topic: ${q.topic}` : '';
  document.getElementById('stem').textContent = q.stem + '?';
  const opts = document.getElementById('options'); opts.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    if (selected && letter === q.correct) btn.classList.add('correct');
    else if (selected && letter === selected && letter !== q.correct) btn.classList.add('incorrect');
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    opts.appendChild(btn);
  });
  const exp = document.getElementById('explanation');
  if (selected) {
    const isCorrect = selected === q.correct;
    exp.style.display = 'block';
    exp.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p><p class="${isCorrect ? 'correct-text' : 'incorrect-text'}">${isCorrect ? 'Nice job. ' : 'Good attempt. '}${q.explanation}</p><div class="option-explanations"><p><strong>Why each option is right or wrong:</strong></p>${Object.entries(q.optionExplanations).map(([l,t]) => `<p><strong>${l}.</strong> ${t}</p>`).join('')}</div>`;
  } else { exp.style.display = 'none'; exp.innerHTML = ''; }
  renderSegments(); renderCounts();
}
function goNext() { currentIndex = (currentIndex + 1) % questions.length; render(); }
function goPrev() { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); }
