<script>
const questions = [{"id": 1, "stem": "A patient develops hypoglycemia after fasting. Which pancreatic islet cell population primarily responds to low blood glucose by increasing blood glucose", "topic": "Pancreatic physiology", "options": {"A": "Beta cells producing insulin", "B": "Alpha cells producing glucagon", "C": "Delta cells producing somatostatin", "D": "Pancreatic polypeptide cells producing pancreatic polypeptide"}, "correct": "B", "explanation": "Alpha cells produce glucagon and are stimulated by low blood glucose. Glucagon increases blood glucose. The section lists alpha cells as about 20 percent of total islet mass.", "optionExplanations": {"A": "Beta cells are stimulated by elevated blood glucose and produce insulin, which lowers blood glucose.", "B": "Correct. Alpha cells secrete glucagon in response to low blood glucose, raising blood glucose.", "C": "Delta cells produce somatostatin, which inhibits insulin and glucagon release.", "D": "Pancreatic polypeptide cells produce pancreatic polypeptide in response to meal intake and fasting and help regulate appetite."}}, {"id": 2, "stem": "A 42 year old man develops severe acute epigastric pain radiating to the back. The pathogenesis is believed to begin with premature activation of pancreatic enzymes inside the gland. Which intracellular change promotes this process", "topic": "Acute pancreatitis pathogenesis", "options": {"A": "Decreased intracellular calcium", "B": "Loss of bile salt secretion", "C": "Increased intracellular potassium", "D": "Increased intracellular calcium"}, "correct": "D", "explanation": "Acute pancreatitis is thought to result from premature activation of pancreatic enzymes, promoted by increased intracellular calcium, leading to autodigestion of pancreatic tissue.", "optionExplanations": {"A": "The section specifically notes increased, not decreased, intracellular calcium as a promoter of enzyme activation.", "B": "Bile obstruction can be an etiologic trigger, but it is not the intracellular change emphasized for premature enzyme activation.", "C": "Intracellular potassium is not the mechanism highlighted in this section.", "D": "Correct. Increased intracellular calcium promotes premature activation of pancreatic enzymes and autodigestion."}}, {"id": 3, "stem": "A 50 year old woman with right upper quadrant pain after meals develops acute pancreatitis. Which etiology is listed as the most common cause of acute pancreatitis", "topic": "Acute pancreatitis etiology", "options": {"A": "Gallstones", "B": "Alcohol use", "C": "Cystic fibrosis", "D": "Autoimmune pancreatitis"}, "correct": "A", "explanation": "The section lists gallstones as the most common obstructive cause of acute pancreatitis and notes ethanol as the most common cause of chronic pancreatitis.", "optionExplanations": {"A": "Correct. Gallstones are the most common cause of acute pancreatitis in this section.", "B": "Alcohol is emphasized as the most common cause of chronic pancreatitis, not the most common acute cause in the section.", "C": "Cystic fibrosis is listed as a miscellaneous association, not the most common acute cause.", "D": "Autoimmune pancreatitis may mimic malignancy or cause duct strictures, but it is not the most common acute cause."}}, {"id": 4, "stem": "A patient with recurrent pancreatic pain has long-standing alcohol use. Imaging later shows pancreatic calcifications and symptoms of malabsorption. Which etiology is listed as the number one cause of chronic pancreatitis", "topic": "Chronic pancreatitis etiology", "options": {"A": "Gallstones", "B": "Pregnancy", "C": "Alcohol", "D": "ERCP"}, "correct": "C", "explanation": "The chronic pancreatitis section states alcohol is the number one cause. Gallstones are specifically excluded as a cause of chronic pancreatitis in this section.", "optionExplanations": {"A": "Gallstones are the most common acute cause, but the chronic pancreatitis section says gallstones are excluded.", "B": "Pregnancy is listed among miscellaneous causes of pancreatitis but not as the leading chronic cause.", "C": "Correct. Alcohol is listed as the number one cause of chronic pancreatitis.", "D": "ERCP is an iatrogenic trigger of acute pancreatitis, not the leading chronic cause."}}, {"id": 5, "stem": "A patient with bipolar disorder is started on a medication and later develops acute pancreatitis. Which drug is specifically included in the section as a cause of drug-induced pancreatitis", "topic": "Drug-induced pancreatitis", "options": {"A": "Metformin", "B": "Amlodipine", "C": "Penicillin V", "D": "Valproate"}, "correct": "D", "explanation": "The section lists multiple drugs that can induce pancreatitis, including valproate, tetracycline, thiazides, nitrofurantoin, sulfasalazine, pentamidine, furosemide, didanosine, estrogens, 5-ASA, 6-MP, corticosteroids, acetaminophen, azathioprine, carbamazepine, ACE inhibitors, and asparaginase.", "optionExplanations": {"A": "Metformin is not listed in this section as a drug-induced pancreatitis cause.", "B": "Amlodipine is not listed in this section as a cause.", "C": "Penicillin V is not listed in this section as a cause.", "D": "Correct. Valproate is one of the drug-induced pancreatitis agents specifically listed."}}, {"id": 6, "stem": "A patient has acute pancreatitis due to congenital ductal anatomy. Which congenital factor is specifically listed as a cause", "topic": "Congenital causes", "options": {"A": "Annular pancreas only", "B": "Pancreas divisum", "C": "Biliary atresia", "D": "Duodenal atresia"}, "correct": "B", "explanation": "The section lists congenital causes of pancreatitis as pancreas divisum, anomalous ducts, and genetic mutations such as PRSS1 and SPINK1.", "optionExplanations": {"A": "Annular pancreas is not the congenital cause emphasized in this section.", "B": "Correct. Pancreas divisum is specifically listed among congenital pancreatitis causes.", "C": "Biliary atresia is not listed here as a pancreatitis cause.", "D": "Duodenal atresia is not listed here as a pancreatitis cause."}}, {"id": 7, "stem": "A family has hereditary pancreatitis. Which pair of genetic mutations is specifically listed among congenital pancreatitis causes", "topic": "Genetic pancreatitis", "options": {"A": "BRCA1 and BRCA2", "B": "APC and KRAS", "C": "PRSS1 and SPINK1", "D": "MLH1 and MSH2"}, "correct": "C", "explanation": "The section lists PRSS1 and SPINK1 as genetic mutations under congenital causes of pancreatitis.", "optionExplanations": {"A": "BRCA genes are not the pancreatitis mutations listed in this section.", "B": "APC and KRAS are not the congenital pancreatitis pair listed here.", "C": "Correct. PRSS1 and SPINK1 are specifically listed.", "D": "MLH1 and MSH2 are mismatch repair genes and are not listed here as pancreatitis genes."}}, {"id": 8, "stem": "A 35 year old man presents with acute onset severe persistent epigastric pain that worsens after eating and improves when he sits upright and leans forward. Which diagnosis best matches this pain pattern", "topic": "Acute pancreatitis presentation", "options": {"A": "Acute pancreatitis", "B": "Viral gastroenteritis", "C": "Uncomplicated lactose intolerance", "D": "Internal hemorrhoids"}, "correct": "A", "explanation": "Acute pancreatitis classically presents with severe persistent epigastric pain, sometimes RUQ or LUQ, often radiating to the back, worsened by food, and relieved by sitting upright, leaning forward, lateral recumbency, or knees to chest.", "optionExplanations": {"A": "Correct. The pain location, food worsening, back radiation pattern, and positional relief match acute pancreatitis.", "B": "Viral gastroenteritis is dominated by watery diarrhea and does not fit this pain pattern.", "C": "Lactose intolerance causes osmotic diarrhea, bloating, and gas rather than severe persistent epigastric pain radiating to the back.", "D": "Internal hemorrhoids cause painless bright red bleeding, not this abdominal pain syndrome."}}, {"id": 9, "stem": "A patient with pancreatitis has ecchymosis over the flanks due to retroperitoneal bleeding after pancreatic enzymes damage abdominal vessels. Which named sign is this", "topic": "Hemorrhagic signs", "options": {"A": "Cullen sign", "B": "Courvoisier sign", "C": "Murphy sign", "D": "Grey Turner sign"}, "correct": "D", "explanation": "Grey Turner sign is flank ecchymosis due to retroperitoneal bleeding. The section contrasts this with Cullen sign, which is periumbilical ecchymosis from hemoperitoneum.", "optionExplanations": {"A": "Cullen sign is periumbilical ecchymosis from hemoperitoneum, not flank ecchymosis.", "B": "Courvoisier sign refers to painless jaundice with an enlarged gallbladder in malignant obstruction.", "C": "Murphy sign is inspiratory arrest with RUQ palpation in cholecystitis.", "D": "Correct. Grey Turner sign is flank ecchymosis from retroperitoneal bleeding."}}, {"id": 10, "stem": "A patient with severe pancreatitis has periumbilical ecchymosis from hemoperitoneum. Which named sign is described", "topic": "Hemorrhagic signs", "options": {"A": "Grey Turner sign", "B": "Rovsing sign", "C": "Cullen sign", "D": "Psoas sign"}, "correct": "C", "explanation": "Cullen sign is periumbilical ecchymosis due to hemoperitoneum. Grey Turner sign is flank discoloration from retroperitoneal bleeding.", "optionExplanations": {"A": "Grey Turner sign is flank ecchymosis, not periumbilical ecchymosis.", "B": "Rovsing sign is associated with appendicitis, not this pancreatitis hemorrhagic finding.", "C": "Correct. Cullen sign is periumbilical ecchymosis due to hemoperitoneum.", "D": "Psoas sign is associated with appendiceal irritation of the psoas muscle, not this finding."}}, {"id": 11, "stem": "A patient presents 4 days after onset of acute pancreatitis symptoms. Amylase has normalized, but one pancreatic enzyme remains elevated and is more specific. Which lab best supports the diagnosis at this time", "topic": "Amylase versus lipase", "options": {"A": "Serum amylase only", "B": "Serum lipase", "C": "Serum ammonia", "D": "Serum lactate dehydrogenase only"}, "correct": "B", "explanation": "Both amylase and lipase can rise early and may be at least 3 times normal within 24 hours, but lipase is more specific and remains elevated longer, usually 4 to 5 days or more. Amylase may normalize within 48 hours and is nonspecific.", "optionExplanations": {"A": "Amylase rises early but may normalize within 48 hours and is less specific.", "B": "Correct. Lipase is more specific and remains elevated longer, making it more useful several days after onset.", "C": "Ammonia is not the pancreatic enzyme used for diagnosis.", "D": "LDH may be part of severity scoring, but it is not the more specific pancreatic enzyme."}}, {"id": 12, "stem": "A patient with acute pancreatitis has volume depletion. Which lab pair best reflects the volume depletion described in the section", "topic": "Laboratory findings", "options": {"A": "Increased BUN and increased hematocrit", "B": "Decreased BUN and decreased hematocrit", "C": "Decreased alkaline phosphatase and decreased bilirubin", "D": "Low CRP and low leukocyte count"}, "correct": "A", "explanation": "The section states BUN and hematocrit increase with volume depletion in acute pancreatitis. Other labs may include leukocytosis, hyperglycemia, elevated bilirubin, LDH, alkaline phosphatase, liver enzymes, low calcium, and elevated CRP.", "optionExplanations": {"A": "Correct. BUN and hematocrit can increase from volume depletion.", "B": "This is the opposite of the volume depletion pattern listed.", "C": "The section lists possible elevations in bilirubin and alkaline phosphatase, not decreases.", "D": "Leukocytosis and elevated CRP can occur, especially with necrosis."}}, {"id": 13, "stem": "A patient with acute pancreatitis has a lab abnormality due to fat necrosis/saponification and calcium shifts. Which electrolyte abnormality is listed", "topic": "Calcium in pancreatitis", "options": {"A": "Hypernatremia", "B": "Hypercalcemia", "C": "Hypermagnesemia", "D": "Hypocalcemia"}, "correct": "D", "explanation": "The section lists low calcium as a laboratory finding in acute pancreatitis and includes serum calcium less than 8 mg/dL as a 48-hour Ranson criterion.", "optionExplanations": {"A": "Sodium abnormality is not the specific electrolyte abnormality emphasized here.", "B": "Hypercalcemia is listed as a metabolic cause of pancreatitis, but acute pancreatitis severity findings include hypocalcemia.", "C": "Hypermagnesemia is not the key electrolyte finding listed.", "D": "Correct. Hypocalcemia is a classic laboratory/severity finding in acute pancreatitis."}}, {"id": 14, "stem": "A patient with suspected acute pancreatitis has an abdominal x-ray. Which finding is specifically listed as possible on plain abdominal radiography", "topic": "Plain film findings", "options": {"A": "Thumbprinting throughout the transverse colon", "B": "Colon cut-off sign", "C": "Apple-core lesion in the sigmoid colon", "D": "Double bubble sign"}, "correct": "B", "explanation": "Plain abdominal x-ray has poor sensitivity and specificity for pancreatitis, but possible findings include gallstones, sentinel loop, pancreatic calcifications in chronic pancreatitis, and the colon cut-off sign.", "optionExplanations": {"A": "Thumbprinting suggests bowel wall edema/ischemia or colitis rather than the listed pancreatitis x-ray findings.", "B": "Correct. The colon cut-off sign is specifically listed as a possible x-ray finding.", "C": "An apple-core lesion suggests colorectal cancer, not a pancreatitis plain film sign.", "D": "Double bubble sign is classically duodenal atresia, not a pancreatitis finding in this section."}}, {"id": 15, "stem": "A patient with acute pancreatitis is suspected to have gallstone disease. Which initial imaging modality is useful for gallstones, biliary dilation or obstruction, and ultrasonic Murphy sign, but may have limited pancreatic visualization due to bowel gas", "topic": "Ultrasound in pancreatitis", "options": {"A": "Plain abdominal x-ray", "B": "ERCP", "C": "Ultrasonography", "D": "CT-guided needle biopsy"}, "correct": "C", "explanation": "Ultrasonography is useful for cholecystitis, gallstones, and biliary dilation/obstruction, but visualization of the pancreas can be limited by bowel gas.", "optionExplanations": {"A": "Plain x-ray has poor sensitivity and specificity and is not the main test for gallstones/biliary dilation.", "B": "ERCP is invasive and generally not indicated in acute pancreatitis unless confirmed choledocholithiasis or urgent cholangitis context exists.", "C": "Correct. Ultrasound evaluates the gallbladder and biliary tree but may be limited by bowel gas for the pancreas.", "D": "CT-guided biopsy is for ruling out infection, necrosis, or tumor and can drain pseudocysts/phlegmons, not first-line gallstone evaluation."}}, {"id": 16, "stem": "A stable patient has suspected choledocholithiasis causing pancreatitis. The team wants a noninvasive duct imaging test that does not inject contrast into the ducts and is safer than ERCP. Which test is preferred", "topic": "MRCP versus ERCP", "options": {"A": "MRCP", "B": "ERCP", "C": "CT-guided needle biopsy", "D": "Plain abdominal x-ray"}, "correct": "A", "explanation": "MRCP is noninvasive, does not inject contrast into the ducts, is not therapeutic, and has no pancreatitis risk. The section describes it as a safer alternative to ERCP and a first step if stable.", "optionExplanations": {"A": "Correct. MRCP is the noninvasive, safer duct imaging option for a stable patient.", "B": "ERCP is invasive, injects contrast into ducts, is therapeutic, and carries pancreatitis risk.", "C": "CT-guided biopsy is not the preferred noninvasive duct imaging test.", "D": "Plain abdominal x-ray does not evaluate the ducts well and has poor sensitivity/specificity."}}, {"id": 17, "stem": "A patient with acute pancreatitis and ascending cholangitis needs urgent duct decompression. Which procedure is invasive, therapeutic, injects contrast into ducts, and carries a risk of pancreatitis", "topic": "ERCP indications", "options": {"A": "MRCP", "B": "HIDA scan", "C": "Plain abdominal x-ray", "D": "ERCP"}, "correct": "D", "explanation": "ERCP is invasive, injects contrast into ducts, is therapeutic, and can worsen pancreatitis. The section notes urgent ERCP is used if cholangitis is present and that ERCP is generally not indicated in acute pancreatitis except confirmed choledocholithiasis.", "optionExplanations": {"A": "MRCP is noninvasive and diagnostic but not therapeutic.", "B": "HIDA evaluates gallbladder filling/ejection and is not duct decompression.", "C": "Plain x-ray cannot provide therapeutic duct decompression.", "D": "Correct. ERCP is invasive and therapeutic, making it appropriate for urgent cholangitis/duct decompression despite pancreatitis risk."}}, {"id": 18, "stem": "A patient with acute pancreatitis undergoes imaging 24 hours after symptom onset, but CT is not impressive. Which statement best matches the section regarding CT in early pancreatitis", "topic": "CT timing", "options": {"A": "CT is always diagnostic in the first 6 hours", "B": "CT is contraindicated in all pancreatitis", "C": "CT may be normal in the first 48 to 72 hours", "D": "CT cannot detect pseudocysts or necrosis"}, "correct": "C", "explanation": "CT can show an enlarged pancreas and help differentiate edema, infection, tumors, pseudocysts, phlegmon, and necrosis, but it is often normal in the first 48 to 72 hours.", "optionExplanations": {"A": "The section says CT may be normal early, not always diagnostic.", "B": "CT is a useful imaging modality in pancreatitis; it is not contraindicated in all cases.", "C": "Correct. CT can be normal during the first 48 to 72 hours.", "D": "CT can help identify pseudocysts and necrosis, among other complications."}}, {"id": 19, "stem": "A patient with acute pancreatitis develops pulmonary failure 5 days after onset. Which systemic complication timing best matches the section", "topic": "Acute pancreatitis complications", "options": {"A": "Pancreatic abscess within the first 12 hours", "B": "ARDS 3 to 7 days after onset", "C": "Pseudocyst within the first 24 hours", "D": "Cholangiocarcinoma within 48 hours"}, "correct": "B", "explanation": "The section lists ARDS as a systemic complication occurring 3 to 7 days after onset. Pancreatic abscess usually appears later at 6 to 8 weeks, and pseudocysts typically occur 4 to 8 weeks after onset.", "optionExplanations": {"A": "Pancreatic abscess is listed as a late complication around 6 to 8 weeks, not within 12 hours.", "B": "Correct. ARDS is listed as occurring 3 to 7 days after onset.", "C": "Pseudocysts usually occur 4 to 8 weeks after onset, not within 24 hours.", "D": "Cholangiocarcinoma is not an early complication of acute pancreatitis."}}, {"id": 20, "stem": "A patient with pancreatitis develops a left-sided pleural effusion and splenic vein thrombosis. Which category of acute pancreatitis complications do these findings fall under in the section", "topic": "Local and vascular complications", "options": {"A": "Admission Ranson criteria", "B": "Drug-induced etiologies", "C": "Physiologic islet cell responses", "D": "Local or vascular complications"}, "correct": "D", "explanation": "The local/vascular complications listed include sterile or infected necrotizing pancreatitis, erosion of arteries, pancreatic ascites, left-sided pleural effusion, splenic vein thrombosis, and pancreatic fistula.", "optionExplanations": {"A": "Ranson criteria are severity/prognostic criteria, not a complication category.", "B": "Drug-induced etiologies are causes, not the category for pleural effusion and splenic vein thrombosis.", "C": "Islet cell physiology does not categorize these complications.", "D": "Correct. Left-sided pleural effusion and splenic vein thrombosis are listed local/vascular complications."}}, {"id": 21, "stem": "A patient is assessed on admission for acute pancreatitis severity using Ranson criteria. Which finding is an admission criterion", "topic": "Ranson admission criteria", "options": {"A": "Age greater than 55 years", "B": "Hematocrit drop greater than 10 percent", "C": "PaO2 less than 60 mm Hg", "D": "Serum calcium less than 8 mg/dL"}, "correct": "A", "explanation": "Admission Ranson criteria listed are age greater than 55 years, WBC greater than 16,000 per microliter, fasting blood glucose greater than 200 mg/dL in a nondiabetic patient, LDH greater than 350 U/L, and AST greater than 250 U/L.", "optionExplanations": {"A": "Correct. Age greater than 55 is an admission criterion.", "B": "Hematocrit drop greater than 10 percent is a 48-hour criterion.", "C": "PaO2 less than 60 mm Hg is a 48-hour criterion.", "D": "Serum calcium less than 8 mg/dL is a 48-hour criterion."}}, {"id": 22, "stem": "A patient with acute pancreatitis is reassessed 48 hours after admission. Which value is a 48-hour Ranson criterion", "topic": "Ranson 48-hour criteria", "options": {"A": "Age greater than 55 years", "B": "WBC greater than 16,000 per microliter", "C": "BUN increase greater than 5 mg/dL", "D": "LDH greater than 350 U/L"}, "correct": "C", "explanation": "The 48-hour Ranson criteria listed include hematocrit drop greater than 10 percent, BUN increase greater than 5 mg/dL, PaO2 less than 60 mm Hg, serum calcium less than 8 mg/dL, base deficit greater than 4 mEq/L, and fluid sequestration greater than 6 L.", "optionExplanations": {"A": "Age greater than 55 is an admission criterion.", "B": "WBC greater than 16,000 is an admission criterion.", "C": "Correct. BUN increase greater than 5 mg/dL is a 48-hour criterion.", "D": "LDH greater than 350 U/L is an admission criterion."}}, {"id": 23, "stem": "A patient has more than 5 Ranson criteria in acute pancreatitis. Which prognosis is emphasized in the section", "topic": "Ranson prognosis", "options": {"A": "Approximately 50 percent mortality", "B": "No increased risk compared with mild disease", "C": "About 1 percent mortality", "D": "Diagnosis of chronic pancreatitis is confirmed"}, "correct": "A", "explanation": "The section states that more than 5 Ranson criteria correspond to about 50 percent mortality. A score of 3 to 5 has 10 to 20 percent mortality, and at least 3 criteria predicts a severe course with about 75 percent sensitivity.", "optionExplanations": {"A": "Correct. More than 5 Ranson criteria is associated with approximately 50 percent mortality.", "B": "More than 5 criteria indicates severe disease, not no increased risk.", "C": "The section lists much higher mortality for this score range.", "D": "Ranson criteria assess severity/prognosis in acute pancreatitis, not the diagnosis of chronic pancreatitis."}}, {"id": 24, "stem": "A patient with acute pancreatitis requires aggressive fluid resuscitation. Which fluid is preferred in the section because it replaces calcium deficit, binds toxic free fatty acids, and provides lactate buffer", "topic": "Acute pancreatitis management", "options": {"A": "Half-normal saline", "B": "Dextrose 5 percent in water", "C": "Albumin only", "D": "Lactated Ringer solution"}, "correct": "D", "explanation": "High-volume IV fluids are central supportive therapy, and the section lists Lactated Ringer solution as preferred because it replaces calcium deficit, binds free fatty acids toxic to the pancreas, and provides lactate buffer.", "optionExplanations": {"A": "Half-normal saline is not listed as preferred in this section.", "B": "D5W is not the preferred resuscitation fluid for acute pancreatitis here.", "C": "Albumin alone is not the preferred high-volume resuscitation fluid described.", "D": "Correct. Lactated Ringer solution is preferred for the reasons listed in the section."}}, {"id": 25, "stem": "A patient with acute pancreatitis has severe pain, persistent emesis, and ileus. Which supportive measure is specifically listed for this scenario", "topic": "Supportive care", "options": {"A": "Immediate high-fat diet", "B": "Nasogastric suction", "C": "Routine ERCP for all cases", "D": "Avoid all pain control"}, "correct": "B", "explanation": "The section lists nasogastric suction for severe pain, persistent emesis, and ileus. General care includes pancreatic and bowel rest, NPO for several days, then clear liquids and low-fat diet, high-volume IV fluids, and pain control.", "optionExplanations": {"A": "Diet is advanced from NPO to clear liquids and then low-fat diet; immediate high-fat diet is not appropriate.", "B": "Correct. NG suction is specifically listed for severe pain, persistent emesis, and ileus.", "C": "ERCP is generally not indicated in acute pancreatitis except selected cases such as confirmed choledocholithiasis/urgent cholangitis.", "D": "Pain control, including morphine sulfate, is part of management."}}, {"id": 26, "stem": "A patient with gallstone pancreatitis improves with conservative therapy. Which etiology-specific treatment is listed to prevent recurrence", "topic": "Etiology-specific management", "options": {"A": "Long-term tetracycline therapy", "B": "Pancreatic enzyme replacement only", "C": "Cholecystectomy", "D": "Celiac plexus block only"}, "correct": "C", "explanation": "Etiology-specific treatment includes cholecystectomy for gallstones and alcohol cessation for alcohol-related disease.", "optionExplanations": {"A": "Tetracycline is listed as a possible drug-induced pancreatitis cause, not preventive treatment.", "B": "Pancreatic enzyme supplementation is part of chronic pancreatitis treatment for steatorrhea/bloating, not the gallstone-specific preventive therapy.", "C": "Correct. Cholecystectomy is listed for gallstone pancreatitis.", "D": "Celiac plexus block may be used for chronic pancreatitis pain management, not gallstone recurrence prevention."}}, {"id": 27, "stem": "A patient with acute pancreatitis has an encapsulated collection of pancreatic juice that appears 5 weeks after disease onset. Which complication is most likely", "topic": "Pancreatic pseudocyst", "options": {"A": "Pancreatic pseudocyst", "B": "Pancreatic abscess only", "C": "Immediate sterile necrosis", "D": "Gallstone ileus"}, "correct": "A", "explanation": "Pancreatic pseudocysts are encapsulated collections of pancreatic juice that occur at least 4 weeks after onset, often 4 to 8 weeks, and occur in about 20 to 25 percent depending on the section note.", "optionExplanations": {"A": "Correct. An encapsulated pancreatic juice collection at least 4 weeks after pancreatitis is a pseudocyst.", "B": "An abscess is a circumscribed pus collection, often 6 to 8 weeks, and requires drainage plus antibiotics.", "C": "Immediate necrosis is not an encapsulated pancreatic juice collection 5 weeks later.", "D": "Gallstone ileus is not a pancreatic fluid complication."}}, {"id": 28, "stem": "A patient has a pancreatic pseudocyst that is larger than 6 cm and persists. Which management is listed", "topic": "Pseudocyst management", "options": {"A": "Observation only regardless of symptoms", "B": "Surgical marsupialization", "C": "Immediate cholecystectomy as the only treatment", "D": "No follow-up because all pseudocysts disappear"}, "correct": "B", "explanation": "For pancreatic pseudocysts, the section lists less than 6 cm as medical management or CT-guided aspiration, while greater than 6 cm or persistent pseudocysts are treated with surgical marsupialization.", "optionExplanations": {"A": "Small uncomplicated pseudocysts may be managed medically, but persistent or >6 cm lesions need intervention.", "B": "Correct. Greater than 6 cm or persistent pseudocysts are managed with surgical marsupialization.", "C": "Cholecystectomy treats gallstone etiology, not the pseudocyst itself.", "D": "Pseudocysts can cause pain, obstruction, infection, erosion, bleeding, or rupture and require monitoring/intervention when large or persistent."}}, {"id": 29, "stem": "A patient with chronic pancreatitis has chronic intermittent epigastric pain radiating to the back, floating stools, and weight loss. Which diagnostic statement best matches this condition", "topic": "Chronic pancreatitis diagnosis", "options": {"A": "Lipase is always markedly elevated late in disease", "B": "Biopsy is first-line because it is risk-free", "C": "Serum amylase alone is the gold standard", "D": "Labs are unreliable and imaging may show calcifications, atrophy, and fibrosis"}, "correct": "D", "explanation": "Chronic pancreatitis is primarily a clinical diagnosis. Labs are unreliable, lipase is often normal, and imaging may show pancreatic calcifications, atrophy, and fibrosis. The secretin stimulation test is the gold standard but has limited availability, and biopsy is avoided due to exacerbation risk.", "optionExplanations": {"A": "Lipase is often normal in chronic pancreatitis, especially later.", "B": "Biopsy is avoided because it can exacerbate pancreatitis.", "C": "The secretin stimulation test is listed as the gold standard, not serum amylase alone.", "D": "Correct. Chronic pancreatitis relies on clinical/imaging features because labs are unreliable."}}, {"id": 30, "stem": "A patient with chronic pancreatitis has steatorrhea and bloating from exocrine pancreatic insufficiency. Which therapy directly addresses these symptoms according to the section", "topic": "Chronic pancreatitis treatment", "options": {"A": "ERCP for every patient regardless of obstruction", "B": "Routine high-fat diet", "C": "Pancreatic enzyme supplementation", "D": "Avoid alcohol only, with no other supportive care"}, "correct": "C", "explanation": "Chronic pancreatitis treatment includes low-fat diet, complete abstinence from alcohol, pain management, endoscopic or surgical stenting/drainage when indicated, pancreatic enzyme supplementation to reduce bloating and steatorrhea, PPIs to reduce gastric acid and prevent lipase inactivation, and supportive care.", "optionExplanations": {"A": "ERCP can help with obstruction but is not required for every patient.", "B": "A low-fat diet is listed, not a high-fat diet.", "C": "Correct. Pancreatic enzyme supplementation reduces bloating and steatorrhea.", "D": "Alcohol abstinence is important, but chronic pancreatitis treatment includes multiple supportive and symptom-directed measures."}}];
let currentIndex = 0;
const answers = {};
const segmentsEl = document.getElementById('segments');
const progressEl = document.getElementById('progress');
const wrongCountEl = document.getElementById('wrongCount');
const rightCountEl = document.getElementById('rightCount');
const qNumEl = document.getElementById('qNum');
const topicEl = document.getElementById('topic');
const stemEl = document.getElementById('stem');
const optionsEl = document.getElementById('options');
const explanationEl = document.getElementById('explanation');
function renderSegments() {
  segmentsEl.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('button');
    b.className = 'seg' + (idx === currentIndex ? ' active' : '') + (answers[q.id] !== undefined ? ' answered' : '');
    b.title = q.topic || `Question ${idx + 1}`;
    b.setAttribute('aria-label', `Go to question ${idx + 1}`);
    b.onclick = () => { currentIndex = idx; render(); };
    segmentsEl.appendChild(b);
  });
}
function renderCounts() {
  let right = 0, wrong = 0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (q && choice === q.correct) right++; else if (q) wrong++;
  });
  rightCountEl.textContent = right;
  wrongCountEl.textContent = wrong;
}
function renderQuestion() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  const showExplanation = selected !== null;
  progressEl.textContent = `${currentIndex + 1} / ${questions.length}`;
  qNumEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  topicEl.textContent = q.topic ? `Topic: ${q.topic}` : '';
  stemEl.textContent = q.stem + '?';
  optionsEl.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (showExplanation && letter === q.correct) btn.className += ' correct';
    else if (showExplanation && letter === selected && letter !== q.correct) btn.className += ' wrong';
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    optionsEl.appendChild(btn);
  });
  explanationEl.innerHTML = '';
  if (showExplanation) {
    const div = document.createElement('div');
    div.className = 'explanation';
    const isCorrect = selected === q.correct;
    const lines = Object.entries(q.optionExplanations || {}).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('');
    div.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p><p class="${isCorrect ? 'correctText' : 'wrongText'}">${isCorrect ? 'Nice job. ' : 'Good attempt. '}${q.explanation}</p><div><p><strong>Why each option is right or wrong:</strong></p>${lines}</div>`;
    explanationEl.appendChild(div);
  }
}
function render() { renderSegments(); renderCounts(); renderQuestion(); }
document.getElementById('prev').onclick = () => { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); };
document.getElementById('next').onclick = () => { currentIndex = (currentIndex + 1) % questions.length; render(); };
render();
</script>
