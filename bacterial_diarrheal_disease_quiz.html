<script>
const questions = [{"id": 1, "stem": "A 3-year-old in daycare develops acute watery diarrhea with nausea and vomiting during the cooler months. A classmate had similar symptoms. Which broad category best describes the expected stool inflammatory findings for this syndrome", "topic": "Watery diarrhea framework", "options": {"A": "Frequent small-volume stool with blood and pus", "B": "Marked fecal leukocytes and RBCs from colonic invasion", "C": "Little to no blood or fecal leukocytes because proximal small intestine fluid loss predominates", "D": "Monocyte-predominant stool due to systemic spread"}, "correct": "C", "explanation": "Watery diarrhea is dominated by intestinal fluid loss, usually from proximal small intestine involvement, with mild accompanying symptoms and usually minimal inflammatory stool findings.", "optionExplanations": {"A": "This describes dysentery rather than watery diarrhea.", "B": "PMNs/RBCs suggest invasive or cytotoxin-mediated dysentery.", "C": "Correct. Watery diarrhea usually reflects fluid loss with minimal blood or leukocytes.", "D": "Monocytes are classically associated with enteric fever such as Salmonella Typhi."}}, {"id": 2, "stem": "A patient has fever, abdominal cramping, tenesmus, and frequent small-volume stools containing blood and pus. Which intestinal site and mechanism best match this presentation", "topic": "Dysentery framework", "options": {"A": "Colon injury from mucosal invasion or cytotoxin production", "B": "Proximal small intestine stimulation by noninvasive enterotoxin only", "C": "Gastric mucosal irritation by preformed toxin only", "D": "Systemic reticuloendothelial spread without intestinal inflammation"}, "correct": "A", "explanation": "Dysentery is frequent small-volume bloody/purulent diarrhea due to colonic inflammation from direct mucosal invasion or cytotoxin production.", "optionExplanations": {"A": "Correct. Blood, pus, tenesmus, fever, and cramps point to colonic inflammation.", "B": "This fits watery diarrhea, not dysentery.", "C": "Preformed toxin often causes abrupt vomiting/watery diarrhea.", "D": "Systemic spread fits enteric fever, which may have delayed or mild diarrhea."}}, {"id": 3, "stem": "A patient develops fever and abdominal pain after ingestion of contaminated water. Diarrhea is mild at first, but blood cultures become positive and the organism spreads to the biliary tract, liver, mesentery, and reticuloendothelial organs. Which syndrome is most likely", "topic": "Enteric fever", "options": {"A": "Watery diarrhea", "B": "Food intoxication", "C": "Pseudomembranous colitis", "D": "Enteric fever"}, "correct": "D", "explanation": "Enteric fever involves penetration of the distal small bowel with systemic spread to the biliary tract, liver, mesentery, and reticuloendothelial organs; bacteremia is common.", "optionExplanations": {"A": "Watery diarrhea is primarily intestinal fluid loss without systemic reticuloendothelial spread.", "B": "Food intoxication is due to preformed toxin with short incubation.", "C": "Pseudomembranous colitis is linked to C. difficile after antibiotics or hospitalization.", "D": "Correct. This is the systemic pattern of enteric fever, classically Salmonella Typhi."}}, {"id": 4, "stem": "A college student travels abroad and develops watery diarrhea after eating raw vegetables and undercooked food. Which pathogen accounts for about half of traveler diarrhea in the section", "topic": "Traveler diarrhea", "options": {"A": "Shigella spp.", "B": "Enterotoxigenic Escherichia coli", "C": "Vibrio cholerae", "D": "Clostridioides difficile"}, "correct": "B", "explanation": "Traveler diarrhea is most commonly due to ETEC, accounting for about 50% of cases in the section. Shigella accounts for about 10–20%.", "optionExplanations": {"A": "Shigella causes a smaller fraction of traveler diarrhea and more often dysentery.", "B": "Correct. ETEC is the most common traveler diarrhea cause listed.", "C": "Vibrio can cause watery rice-water diarrhea but is not listed as the most common traveler diarrhea cause.", "D": "C. difficile is associated with antibiotics and hospitalization."}}, {"id": 5, "stem": "An outbreak of abrupt vomiting occurs after a single shared meal. The epidemiologist focuses on incubation period, food vehicle, symptoms, and storage temperature. What major mechanism is suggested by a very short incubation period", "topic": "Food poisoning mechanisms", "options": {"A": "Delayed autoimmune destruction of villi", "B": "Bacteremia from distal ileal penetration", "C": "New toxin production only after colonic invasion", "D": "Ingestion of preformed toxin in food"}, "correct": "D", "explanation": "Food poisoning may be infection or intoxication. A short incubation period strongly suggests intoxication from preformed toxin in food.", "optionExplanations": {"A": "Autoimmune villous injury is not an acute single-meal food poisoning mechanism.", "B": "Bacteremia is typical of enteric fever rather than abrupt toxin-mediated illness.", "C": "Toxin production after intestinal colonization has a longer incubation than preformed toxin.", "D": "Correct. Very short onset after a meal points to preformed toxin."}}, {"id": 6, "stem": "A microbiology lab plates stool on MacConkey agar. Which property makes this medium useful for many bacterial GI pathogens", "topic": "MacConkey agar", "options": {"A": "It selects for Gram-positive cocci and differentiates catalase activity", "B": "It detects H2S production using black colonies", "C": "Bile salts inhibit Gram-positive organisms and lactose fermentation causes a color change", "D": "It grows Campylobacter jejuni best at 42 C in 5% CO2"}, "correct": "C", "explanation": "MacConkey agar is selective for Gram-negative organisms because bile salts inhibit Gram-positive growth, and it is differential for lactose fermentation by color change.", "optionExplanations": {"A": "MacConkey selects against many Gram-positive organisms; catalase is not the differentiating feature.", "B": "H2S black colonies are emphasized for Hektoen enteric agar.", "C": "Correct. MacConkey selects Gram-negative rods and differentiates lactose fermenters.", "D": "Campylobacter agar grows C. jejuni at 42 C with 5% CO2."}}, {"id": 7, "stem": "A stool culture is plated on a medium selective for Salmonella and Shigella. It has increased bile salts to inhibit common colon flora and shows black colonies when H2S is produced. Which medium is being described", "topic": "Hektoen enteric agar", "options": {"A": "Hektoen enteric agar", "B": "MacConkey agar", "C": "Campylobacter agar", "D": "Mannitol salt agar"}, "correct": "A", "explanation": "Hektoen enteric agar is selective for Salmonella and Shigella, inhibits common colon flora with bile salts, and detects H2S production as black colonies.", "optionExplanations": {"A": "Correct. Hektoen enteric agar is the Salmonella/Shigella medium with H2S detection.", "B": "MacConkey selects Gram-negative bacteria and differentiates lactose fermentation.", "C": "Campylobacter agar supports growth at 42 C in 5% CO2.", "D": "Mannitol salt agar is used for Staphylococcus aureus, not enteric stool pathogens."}}, {"id": 8, "stem": "A patient has dysentery after eating poultry. The organism is best recovered on a medium incubated at 42 C with 5% CO2. Which pathogen is most likely", "topic": "Campylobacter jejuni", "options": {"A": "Enterotoxigenic Escherichia coli", "B": "Vibrio cholerae", "C": "Staphylococcus aureus", "D": "Campylobacter jejuni"}, "correct": "D", "explanation": "Campylobacter jejuni causes dysentery with cramping and fever, is associated with poultry/undercooked eggs in the table, and grows on Campylobacter agar at 42 C with 5% CO2.", "optionExplanations": {"A": "ETEC causes watery traveler diarrhea and is not identified by growth at 42 C with 5% CO2.", "B": "Vibrio causes watery rice-water diarrhea.", "C": "S. aureus causes preformed toxin food intoxication, often with vomiting.", "D": "Correct. Poultry-associated dysentery plus 42 C microaerophilic growth points to Campylobacter jejuni."}}, {"id": 9, "stem": "A Gram-negative bacterial isolate from stool has an O antigen, H antigen, and K antigen. In Salmonella Typhi, a special capsule antigen is emphasized. Which antigen is this", "topic": "Gram-negative serology", "options": {"A": "M antigen", "B": "Vi antigen", "C": "Protein A", "D": "Lancefield group D antigen"}, "correct": "B", "explanation": "The section lists O as somatic/cell wall, H as flagellar, K as capsule, and the Vi antigen in Salmonella Typhi.", "optionExplanations": {"A": "M protein is associated with group A Streptococcus, not Salmonella Typhi capsule antigen.", "B": "Correct. Vi is the special capsular antigen of Salmonella Typhi.", "C": "Protein A is a Staphylococcus aureus virulence factor.", "D": "Group D-like features are discussed for Enterococcus, not Salmonella Typhi."}}, {"id": 10, "stem": "A patient has non-typhoidal Salmonella gastroenteritis after eating undercooked eggs. Which stool finding is most consistent with the section table", "topic": "Salmonella non-typhi", "options": {"A": "No inflammatory cells", "B": "Acid-fast oocysts", "C": "PMNs", "D": "Monocytes only"}, "correct": "C", "explanation": "The table lists Salmonella non-typhi as a dysentery syndrome due to mucosal invasion from poultry/undercooked eggs, with PMNs in stool.", "optionExplanations": {"A": "No inflammatory cells is typical of noninvasive watery diarrhea such as ETEC.", "B": "Acid-fast oocysts are associated with Cryptosporidium.", "C": "Correct. Non-typhoidal Salmonella dysentery shows PMNs.", "D": "Monocytes are listed for Salmonella Typhi enteric fever."}}, {"id": 11, "stem": "A patient has fever and systemic illness after ingestion of contaminated food. Stool findings are monocyte-predominant rather than PMN-predominant. Which organism is most consistent", "topic": "Salmonella Typhi", "options": {"A": "Salmonella Typhi", "B": "Shigella dysenteriae", "C": "Enterohemorrhagic Escherichia coli", "D": "Vibrio cholerae"}, "correct": "A", "explanation": "Salmonella Typhi causes enteric fever through penetration and systemic spread, and the table lists monocytes as the stool finding.", "optionExplanations": {"A": "Correct. Enteric fever with monocytes points to Salmonella Typhi.", "B": "Shigella dysentery has PMNs and RBCs.", "C": "EHEC dysentery is cytotoxin-mediated and is associated with RBCs.", "D": "Vibrio causes watery rice-water diarrhea without inflammatory stool findings."}}, {"id": 12, "stem": "A child in a crowded setting develops dysentery. The organism has an extremely low infectious dose and is associated with war, crowding, and poor sanitation. Which pathogen is most likely", "topic": "Shigella epidemiology", "options": {"A": "Enterotoxigenic E. coli", "B": "Bacillus cereus", "C": "Rotavirus", "D": "Shigella spp."}, "correct": "D", "explanation": "Shigella is emphasized as having an extremely low infectious dose and causing epidemic disease in settings of war, crowding, and poor sanitation.", "optionExplanations": {"A": "ETEC is a common traveler diarrhea organism but not the classic low-infectious-dose crowding organism here.", "B": "B. cereus causes toxin-mediated vomiting or watery diarrhea.", "C": "Rotavirus is common in young children and daycare but is viral watery diarrhea.", "D": "Correct. Low infectious dose plus crowding/poor sanitation points to Shigella."}}, {"id": 13, "stem": "A patient has bloody diarrhea after a recent beef meal. Stool contains RBCs but few to no PMNs in the section table. Which mechanism best explains this pattern", "topic": "EHEC", "options": {"A": "Mucosal invasion like EIEC", "B": "Cytotoxin-mediated injury by enterohemorrhagic E. coli", "C": "Preformed heat-stable toxin from S. aureus", "D": "Penetration and reticuloendothelial spread"}, "correct": "B", "explanation": "EHEC is associated with dysentery after a recent beef meal and cytotoxin-mediated injury; the table lists RBCs in stool.", "optionExplanations": {"A": "EIEC causes dysentery by mucosal invasion with PMNs and RBCs.", "B": "Correct. Recent beef plus RBC stool points to cytotoxin-mediated EHEC.", "C": "S. aureus preformed toxin causes vomiting/watery diarrhea, not bloody diarrhea after beef.", "D": "Systemic spread describes enteric fever."}}, {"id": 14, "stem": "A patient with traveler diarrhea has watery stool without fecal leukocytes or blood. The organism produces enterotoxins and does not invade mucosa. Which E. coli pathotype best fits", "topic": "ETEC", "options": {"A": "EHEC", "B": "EIEC", "C": "ETEC", "D": "EPEC"}, "correct": "C", "explanation": "ETEC causes watery diarrhea through enterotoxins and has no inflammatory stool findings in the table. It is also the major cause of traveler diarrhea.", "optionExplanations": {"A": "EHEC causes dysentery associated with cytotoxin and RBCs.", "B": "EIEC causes dysentery via mucosal invasion with PMNs and RBCs.", "C": "Correct. ETEC is noninvasive enterotoxin-mediated watery diarrhea.", "D": "EPEC causes watery mucoid diarrhea by adherence rather than classic traveler enterotoxin syndrome."}}, {"id": 15, "stem": "A child develops watery, mucoid diarrhea. The organism adheres to the intestinal epithelium without invasion and is associated with pedestal formation through type III secretion in the section. Which pathotype is most likely", "topic": "EPEC adherence", "options": {"A": "EIEC", "B": "EHEC only", "C": "ETEC", "D": "EPEC"}, "correct": "D", "explanation": "EPEC causes watery, mucoid diarrhea by adherence. The section describes type III secretion and pedestal formation involving Tir and Intimin for EPEC/EHEC, but watery mucoid noninvasive disease is EPEC.", "optionExplanations": {"A": "EIEC causes invasive dysentery with PMNs and RBCs.", "B": "EHEC also uses type III secretion, but clinically it is dysentery with RBCs and recent beef exposure.", "C": "ETEC uses enterotoxins and causes watery diarrhea, not the classic pedestal/adherence pattern tested here.", "D": "Correct. Watery mucoid diarrhea from adherence fits EPEC."}}, {"id": 16, "stem": "A child has persistent watery diarrhea. The E. coli strain shows a stacked-brick attachment pattern and is associated with foodborne outbreaks such as hamburger. Which pathotype is most likely", "topic": "EAEC", "options": {"A": "Enteroaggregative E. coli", "B": "Enteroinvasive E. coli", "C": "Enterohemorrhagic E. coli", "D": "Enteropathogenic E. coli"}, "correct": "A", "explanation": "EAEC has a stacked-brick attachment pattern and causes persistent diarrhea in children. The section also notes foodborne outbreaks such as hamburger.", "optionExplanations": {"A": "Correct. Stacked bricks is the classic EAEC attachment pattern.", "B": "EIEC causes invasive dysentery.", "C": "EHEC causes bloody diarrhea after beef via cytotoxin.", "D": "EPEC causes watery mucoid diarrhea by adherence and pedestal formation."}}, {"id": 17, "stem": "A molecular microbiology question asks how EPEC and EHEC form pedestals on enterocytes. Which sequence best matches the section", "topic": "Type III secretion and pedestal formation", "options": {"A": "Bacteria secrete urease, buffering acid and creating an alkaline niche", "B": "Bacteria release preformed toxin that blocks acetylcholine release", "C": "Tir is injected into enterocytes by type III secretion and binds bacterial intimin, causing actin rearrangement", "D": "Vi antigen binds bile ducts and causes bacteremia"}, "correct": "C", "explanation": "EPEC/EHEC use a type III secretion system to inject Tir into enterocytes. Tir binds bacterial intimin, causing stable association, actin rearrangement, tight adherence, and pedestal formation.", "optionExplanations": {"A": "This describes H. pylori-type acid buffering, not EPEC/EHEC pedestal formation.", "B": "This resembles botulinum toxin mechanism, not EPEC/EHEC.", "C": "Correct. Tir-intimin interaction after type III secretion drives pedestal formation.", "D": "Vi antigen is the Salmonella Typhi capsular antigen and does not explain pedestals."}}, {"id": 18, "stem": "A patient presents with massive watery diarrhea described as rice-water stool with minimal inflammatory cells. Which organism category best fits", "topic": "Vibrio watery diarrhea", "options": {"A": "Shigella spp.", "B": "Vibrio spp.", "C": "EIEC", "D": "Entamoeba histolytica"}, "correct": "B", "explanation": "The table lists Vibrio spp. as causing watery diarrhea with rice-water stool due to enterotoxin and no inflammatory stool findings.", "optionExplanations": {"A": "Shigella causes dysentery with PMNs and RBCs.", "B": "Correct. Rice-water watery diarrhea points to Vibrio.", "C": "EIEC causes invasive dysentery with PMNs and RBCs.", "D": "Entamoeba histolytica causes dysentery and may show cysts/PMNs."}}, {"id": 19, "stem": "A hospitalized patient develops diarrhea after recent antibiotic therapy. Stool testing identifies a pathogen that causes disease through both cytotoxin and enterotoxin. Which organism is most likely", "topic": "Clostridioides difficile", "options": {"A": "Campylobacter jejuni", "B": "Vibrio cholerae", "C": "Giardia lamblia", "D": "Clostridioides difficile"}, "correct": "D", "explanation": "C. difficile is associated with recent antibiotic therapy and hospitalization and causes dysentery/pseudomembranous colitis through cytotoxin and enterotoxin.", "optionExplanations": {"A": "Campylobacter is linked to poultry and dysentery with cramping/fever.", "B": "Vibrio causes rice-water watery diarrhea.", "C": "Giardia causes watery diarrhea with flagellates/cysts, often after water exposure.", "D": "Correct. Recent antibiotics/hospitalization plus cytotoxin and enterotoxin points to C. difficile."}}, {"id": 20, "stem": "Several guests develop abrupt severe nausea and vomiting 2 hours after eating custard-filled pastries handled by an asymptomatic food worker. Which mechanism best explains the rapid onset", "topic": "Staphylococcus aureus food poisoning", "options": {"A": "Preformed heat-resistant enterotoxin from Staphylococcus aureus", "B": "Delayed intestinal colonization by C. perfringens spores", "C": "Mucosal invasion by Shigella with PMNs and RBCs", "D": "Systemic spread by Salmonella Typhi"}, "correct": "A", "explanation": "S. aureus food poisoning is an intoxication caused by preformed heat-resistant enterotoxin in foods handled by carriers, often cut/sliced/mixed foods, custard pastries, potato salad, and salted meats. It causes abrupt vomiting.", "optionExplanations": {"A": "Correct. Very rapid vomiting after handled food strongly suggests preformed S. aureus enterotoxin.", "B": "C. perfringens requires spore ingestion/germination and has a later incubation, often with reheated meat.", "C": "Shigella causes dysentery, not abrupt vomiting within hours from preformed toxin.", "D": "Typhoid causes enteric fever with systemic spread, not abrupt vomiting from pastries."}}, {"id": 21, "stem": "A large banquet outbreak occurs after reheated turkey was improperly cooled. Patients develop watery diarrhea and severe abdominal cramps 8 to 14 hours later, usually without fever, chills, vomiting, or headache. Which pathogen best fits", "topic": "Clostridium perfringens food poisoning", "options": {"A": "Staphylococcus aureus", "B": "Bacillus cereus emetic syndrome", "C": "Clostridium perfringens", "D": "Vibrio vulnificus"}, "correct": "C", "explanation": "C. perfringens food poisoning is linked to meat or poultry that is precooked, improperly cooled, and reheated. It causes watery diarrhea and cramping after about 8–14 hours, typically without fever/chills/vomiting/headache.", "optionExplanations": {"A": "S. aureus causes abrupt vomiting from preformed toxin, often within 1–8 hours.", "B": "B. cereus emetic syndrome is classically associated with reheated fried rice and shorter incubation.", "C": "Correct. Reheated meat/poultry with 8–14 hour watery diarrhea fits C. perfringens.", "D": "V. vulnificus is linked to raw oysters or seawater wounds with sepsis/skin lesions."}}, {"id": 22, "stem": "After a community pig feast, several people develop severe abdominal pain, bloody diarrhea, vomiting, and shock. The disease is enteritis necroticans with about 40% mortality. Which organism/type is implicated in the section", "topic": "Enteritis necroticans Pigbel", "options": {"A": "Clostridium perfringens type C", "B": "Clostridioides difficile", "C": "Bacillus cereus", "D": "Staphylococcus aureus"}, "correct": "A", "explanation": "Enteritis necroticans, also called Pigbel, is caused by C. perfringens type C and can cause severe necrotizing small-intestinal disease after pig feasts with high mortality.", "optionExplanations": {"A": "Correct. Pigbel/enteritis necroticans is due to C. perfringens type C.", "B": "C. difficile causes antibiotic-associated diarrhea and pseudomembranous colitis.", "C": "B. cereus causes emetic rice-associated illness or diarrheal syndrome.", "D": "S. aureus causes preformed toxin gastroenteritis intoxication."}}, {"id": 23, "stem": "A family develops nausea, vomiting, and diarrhea followed by diplopia, blurred vision, fixed dilated pupils, cranial nerve paralysis, and descending symmetric paralysis after eating home-canned vegetables. Which toxin mechanism is responsible", "topic": "Clostridium botulinum", "options": {"A": "Inhibition of glucose transport in enterocytes", "B": "Activation of adenylate cyclase with secretory diarrhea only", "C": "Shiga-like cytotoxin injury to colonic mucosa", "D": "Blockade of acetylcholine release at presynaptic cholinergic terminals"}, "correct": "D", "explanation": "Foodborne botulism is caused by preformed botulinum toxin, which binds presynaptic cholinergic terminals, is internalized, cleaves exocytosis proteins, and blocks acetylcholine release, causing flaccid descending paralysis.", "optionExplanations": {"A": "Inhibition of glucose transport is described for C. perfringens enterotoxin.", "B": "Adenylate cyclase activation is described for B. cereus diarrheal syndrome and cholera-like watery diarrhea mechanisms.", "C": "Shiga-like cytotoxin is associated with EHEC-type disease.", "D": "Correct. Botulinum toxin blocks ACh release and causes descending flaccid paralysis."}}, {"id": 24, "stem": "A patient has vomiting 2 hours after eating reheated fried rice. Symptoms resolve within 8 to 10 hours. Which toxin property best matches this syndrome", "topic": "Bacillus cereus emetic syndrome", "options": {"A": "Heat-stable, proteolysis-resistant toxin", "B": "Toxin requiring intestinal colonization for 9 hours", "C": "Toxin that blocks acetylcholine release", "D": "Toxin that causes pseudomembranes after antibiotics"}, "correct": "A", "explanation": "B. cereus emetic syndrome is linked to reheated fried rice, has short incubation around 2 hours, and is caused by a heat-stable, proteolysis-resistant toxin.", "optionExplanations": {"A": "Correct. The short-incubation fried-rice emetic syndrome is due to heat-stable toxin.", "B": "This describes the longer-incubation B. cereus diarrheal syndrome.", "C": "This is botulinum toxin.", "D": "This fits C. difficile disease."}}, {"id": 25, "stem": "A patient develops diarrheal illness about 9 hours after eating meat, vegetables, and spaghetti sauce held between 30 and 50 C. The toxin activates adenylate cyclase, increasing cAMP and causing water and electrolyte secretion. Which organism is most likely", "topic": "Bacillus cereus diarrheal syndrome", "options": {"A": "Staphylococcus aureus", "B": "Clostridium botulinum", "C": "Bacillus cereus", "D": "Giardia lamblia"}, "correct": "C", "explanation": "B. cereus diarrheal syndrome has a longer incubation around 9 hours, requires intestinal colonization, and involves heat-labile enterotoxin with cAMP-mediated water/electrolyte secretion.", "optionExplanations": {"A": "S. aureus causes rapid vomiting from preformed toxin.", "B": "C. botulinum causes neurologic flaccid paralysis.", "C": "Correct. Longer-incubation diarrheal syndrome with adenylate cyclase/cAMP points to B. cereus.", "D": "Giardia is a protozoan watery diarrhea illness with cysts/trophozoites."}}, {"id": 26, "stem": "A patient eats raw oysters in summer and develops vomiting, diarrhea, fever, altered mental status, septic shock, cellulitis, ecchymoses, and bullae. Culture on TCBS agar grows green colonies. Which organism is most likely", "topic": "Vibrio vulnificus", "options": {"A": "Vibrio cholerae", "B": "Vibrio vulnificus", "C": "Yersinia enterocolitica", "D": "Cyclospora cayetanensis"}, "correct": "B", "explanation": "V. vulnificus is a marine organism transmitted by raw/undercooked oysters or seawater wound exposure. It can cause gastroenteritis, primary septicemia, bullous skin lesions, necrotizing fasciitis, and green colonies on TCBS agar.", "optionExplanations": {"A": "V. cholerae causes rice-water diarrhea and yellow colonies on TCBS per the section contrast.", "B": "Correct. Raw oysters plus sepsis, bullae, and green TCBS colonies point to V. vulnificus.", "C": "Yersinia causes enteric fever-like illness and penetration/spread.", "D": "Cyclospora is linked to produce/water and prolonged watery diarrhea."}}, {"id": 27, "stem": "An immunocompromised patient has cholera-like watery diarrhea with severe fluid loss. Stool microscopy using modified acid-fast stain shows small oocysts. Which organism is most likely", "topic": "Cryptosporidium", "options": {"A": "Giardia lamblia", "B": "Entamoeba histolytica", "C": "EHEC", "D": "Cryptosporidium parvum"}, "correct": "D", "explanation": "Cryptosporidium causes watery diarrhea in immunocompetent hosts and cholera-like severe diarrhea in immunocompromised patients. Diagnosis can use modified acid-fast staining of small oocysts.", "optionExplanations": {"A": "Giardia is diagnosed by cysts/trophozoites and classically causes bloating and watery diarrhea.", "B": "Entamoeba causes dysentery and liver abscesses with trophozoites/cysts, not acid-fast oocysts let currentIndex = 0;
let answers = {};
function renderProgress() {
  const progress = document.getElementById('progress');
  progress.innerHTML = '';
  questions.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'segment' + (answers[q.id] ? ' answered' : '') + (idx === currentIndex ? ' active' : '');
    btn.title = q.topic || `Question ${idx + 1}`;
    btn.onclick = () => { currentIndex = idx; render(); };
    progress.appendChild(btn);
  });
}
function renderScore() {
  let right = 0; let wrong = 0;
  Object.entries(answers).forEach(([id, selected]) => {
    const q = questions.find(item => item.id === Number(id));
    if (!q) return;
    if (selected === q.correct) right++; else wrong++;
  });
  document.getElementById('rightCount').textContent = right;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('counter').textContent = `${currentIndex + 1} / ${questions.length}`;
}
function render() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  document.getElementById('questionNumber').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('topic').textContent = q.topic ? `Topic: ${q.topic}` : '';
  document.getElementById('stem').textContent = q.stem + '?';
  const answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (selected) {
      if (letter === q.correct) btn.classList.add('correct');
      else if (letter === selected) btn.classList.add('incorrect');
    }
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    answersDiv.appendChild(btn);
  });
  const exp = document.getElementById('explanation');
  if (selected) {
    const correctness = selected === q.correct ? 'Nice job.' : 'Good attempt.';
    const optionRows = Object.entries(q.optionExplanations).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('');
    exp.style.display = 'block';
    exp.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p><p>${correctness} ${q.explanation}</p><div class="option-exp"><p><strong>Why each option is right or wrong:</strong></p>${optionRows}</div>`;
  } else { exp.style.display = 'none'; exp.innerHTML = ''; }
  renderProgress(); renderScore();
}
function goNext() { currentIndex = (currentIndex + 1) % questions.length; render(); }
function goPrev() { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); }
function resetQuiz() { answers = {}; currentIndex = 0; render(); }
render();
</script>
