<script>
const questions = [{"id": 1, "stem": "A 2-year-old child has a stable gut microbial community after normal early colonization. Which timing best matches when gut microbiota is generally established", "topic": "Gut microbiota development", "options": {"A": "At birth only, with no later development", "B": "Only after puberty", "C": "After age 80", "D": "By about age 1 to 2 years"}, "correct": "D", "explanation": "Gut microbiota is established by about age 1 to 2 years as the intestinal epithelium and mucosal barrier co-develop with commensals.", "optionExplanations": {"A": "Gut microbiota begins early but continues developing after birth.", "B": "The section places establishment in early childhood, not puberty.", "C": "Elderly age is associated with later compositional shifts, not initial establishment.", "D": "Correct. Gut microbiota is established by about age 1 to 2 years as the intestinal epithelium and mucosal barrier co-develop with commensals."}}, {"id": 2, "stem": "A researcher studies bacterial fermentation of dietary fiber. Which products are absorbed by the host and act as hormone-like signaling molecules affecting metabolism, immune modulation, and gut integrity", "topic": "Short-chain fatty acids", "options": {"A": "Intrinsic factor and pepsin", "B": "Short-chain fatty acids such as acetic acid and butyric acid", "C": "Donovan bodies and M protein", "D": "Bile salts only"}, "correct": "B", "explanation": "Microbial fermentation produces SCFAs, including acetic acid and butyric acid, which are absorbed and influence metabolism, immune modulation, and gut integrity.", "optionExplanations": {"A": "These are gastric secretions, not microbial fermentation products.", "B": "Correct. Microbial fermentation produces SCFAs, including acetic acid and butyric acid, which are absorbed and influence metabolism, immune modulation, and gut integrity.", "C": "These are microbial pathology/virulence terms, not SCFAs.", "D": "Bile salts are not the fiber-fermentation products emphasized here."}}, {"id": 3, "stem": "A student asks why normal gut flora is considered beneficial rather than merely harmless. Which host benefit is specifically listed", "topic": "Benefits of gut flora", "options": {"A": "Sterilization of the colon", "B": "Production of gastric hydrochloric acid", "C": "Synthesis of vitamins B and K", "D": "Prevention of all mucosal immune responses"}, "correct": "C", "explanation": "The section lists synthesis of vitamins B and K as a benefit of gut flora, along with fiber fermentation and immune/metabolic effects.", "optionExplanations": {"A": "The colon is normally densely colonized, not sterile.", "B": "HCl is produced by gastric parietal cells, not gut flora.", "C": "Correct. The section lists synthesis of vitamins B and K as a benefit of gut flora, along with fiber fermentation and immune/metabolic effects.", "D": "Gut flora supports immune development and homeostasis rather than eliminating immunity."}}, {"id": 4, "stem": "A fecal sample is analyzed by dry mass, and the clinician explains where the densest microbial ecosystem is found. Which statement best reflects normal regional GI microbiota distribution", "topic": "Regional microbiota distribution", "options": {"A": "The stomach has the highest microbial load because of acidity", "B": "The proximal small intestine has more microbes than the colon", "C": "The colon is dominated by aerobes rather than anaerobes", "D": "The colon is the largest microbial ecosystem and is more than 99 percent anaerobes"}, "correct": "D", "explanation": "The colon contains the largest bacterial density in the body, is more than 99% anaerobes, and bacteria make up about 60% of fecal dry mass.", "optionExplanations": {"A": "High acidity causes only a trace microbial load in the stomach.", "B": "The stomach and small intestine have relatively few microbes compared with the colon.", "C": "The section emphasizes that the colon is dominated by anaerobes.", "D": "Correct. The colon contains the largest bacterial density in the body, is more than 99% anaerobes, and bacteria make up about 60% of fecal dry mass."}}, {"id": 5, "stem": "A stomach organism survives acidity by producing urease and using polar flagella plus a helical shape to penetrate the mucus layer. Which organism is described", "topic": "Helicobacter pylori microbiology", "options": {"A": "Helicobacter pylori", "B": "Staphylococcus aureus", "C": "Clostridium tetani", "D": "Bifidobacterium species"}, "correct": "A", "explanation": "H. pylori is a gram-negative helical organism with polar flagella and urease, which generates ammonia and raises local pH.", "optionExplanations": {"A": "Correct. H. pylori is a gram-negative helical organism with polar flagella and urease, which generates ammonia and raises local pH.", "B": "S. aureus is a gram-positive coccus in clusters with catalase and coagulase activity.", "C": "C. tetani is a spore-forming gram-positive rod with tetanospasmin.", "D": "Bifidobacterium are gram-positive branched rods and common probiotics."}}, {"id": 6, "stem": "A mucosal biopsy overlying Peyer patches shows specialized epithelial cells transcytosing luminal antigens to immune cells underneath, helping initiate an IgA response. Which cells are responsible", "topic": "M cells and GALT", "options": {"A": "Goblet cells", "B": "Paneth cells", "C": "M cells", "D": "Parietal cells"}, "correct": "C", "explanation": "M cells overlie Peyer patches/GALT and perform antigen sampling by transcytosis, delivering antigens to immune cells and initiating IgA mucosal responses.", "optionExplanations": {"A": "Goblet cells produce mucus, not the main transcytosis function described.", "B": "Paneth cells produce antimicrobial products; they are not the antigen-sampling cells here.", "C": "Correct. M cells overlie Peyer patches/GALT and perform antigen sampling by transcytosis, delivering antigens to immune cells and initiating IgA mucosal responses.", "D": "Parietal cells produce acid and intrinsic factor in the stomach."}}, {"id": 7, "stem": "A patient changes to a vegetarian diet. Within a day, the gut microbiota composition starts shifting. Which change is specifically associated with vegetarian diets in the section", "topic": "Diet and microbiota", "options": {"A": "Permanent change that cannot reverse", "B": "Increased plant polysaccharide metabolizers", "C": "Complete loss of anaerobes", "D": "Loss of all Bacteroides species"}, "correct": "B", "explanation": "Diet can change the microbiota rapidly, and vegetarian diets are associated with increased plant polysaccharide metabolizers.", "optionExplanations": {"A": "The section notes diet reversion can lead to microbiota reversion.", "B": "Correct. Diet can change the microbiota rapidly, and vegetarian diets are associated with increased plant polysaccharide metabolizers.", "C": "Anaerobes remain dominant in the colon.", "D": "The section does not state that vegetarian diets eliminate Bacteroides."}}, {"id": 8, "stem": "A malnourished child has disrupted gut microbial ecology. Which pattern is expected based on the section", "topic": "Malnourishment and microbiota", "options": {"A": "Decreased diversity with immature microbiota and increased pathogenic organisms", "B": "Increased diversity with a mature microbiota", "C": "Decreased oral yeast colonization", "D": "Complete absence of pathogens"}, "correct": "A", "explanation": "Malnourishment is associated with decreased diversity, immature microbiota, increased pathogenic organisms, and increased oral yeast colonization.", "optionExplanations": {"A": "Correct. Malnourishment is associated with decreased diversity, immature microbiota, increased pathogenic organisms, and increased oral yeast colonization.", "B": "Malnourishment decreases diversity and maturity.", "C": "The section notes increased oral yeast colonization.", "D": "Pathogenic organisms increase in malnourishment."}}, {"id": 9, "stem": "A patient benefits from bacterial metabolism of sulfasalazine in the gut. Which pharmaceutical interaction best matches this example", "topic": "Microbiota and drug activation", "options": {"A": "Direct binding of levodopa", "B": "Inactivation of digoxin by Eggerthella lenta", "C": "Activation of tetanospasmin", "D": "Microbial activation of a prodrug to an active form"}, "correct": "D", "explanation": "The section lists activation of prodrugs to active drugs as a gut microbial effect, with sulfasalazine as the example.", "optionExplanations": {"A": "Levodopa binding/conversion is a different listed interaction.", "B": "This is deactivation, not sulfasalazine prodrug activation.", "C": "Tetanospasmin is a C. tetani toxin, not a drug activation example.", "D": "Correct. The section lists activation of prodrugs to active drugs as a gut microbial effect, with sulfasalazine as the example."}}, {"id": 10, "stem": "A patient taking digoxin has reduced therapeutic effect because a gut microbe inactivates the drug. Which organism is specifically named for this interaction", "topic": "Microbiota and digoxin deactivation", "options": {"A": "Lactobacillus species", "B": "Eggerthella lenta", "C": "Bacteroides fragilis", "D": "Enterococcus faecalis"}, "correct": "B", "explanation": "Eggerthella lenta is specifically listed as a gut microbe that can inactivate digoxin.", "optionExplanations": {"A": "Lactobacillus is discussed as protective/probiotic, not the digoxin-inactivating organism.", "B": "Correct. Eggerthella lenta is specifically listed as a gut microbe that can inactivate digoxin.", "C": "B. fragilis supports anaerobic ecosystem stability but is not the named digoxin interaction.", "D": "Enterococcus is normal intestinal flora, but not the listed digoxin-inactivating species."}}, {"id": 11, "stem": "A patient has reduced response to a Parkinson medication because gut microbes bind the drug and convert it in the intestine. Which drug example is listed", "topic": "Microbiota and levodopa", "options": {"A": "Levodopa converted to dopamine in the gut", "B": "Omeprazole activated in parietal canaliculi", "C": "Warfarin activated by M cells", "D": "Amoxicillin converted to acetylcholine"}, "correct": "A", "explanation": "Direct binding/metabolism of levodopa to dopamine in the gut is listed as a microbiota-pharmaceutical interaction.", "optionExplanations": {"A": "Correct. Direct binding/metabolism of levodopa to dopamine in the gut is listed as a microbiota-pharmaceutical interaction.", "B": "This is pharmacology of PPIs, not a microbiota interaction in this section.", "C": "M cells sample antigens; they do not activate warfarin.", "D": "This conversion is not described."}}, {"id": 12, "stem": "A chemotherapy agent increases gut permeability and microbial translocation, producing immune modulation. Which drug is the example in this section", "topic": "Microbiota and immune modulation", "options": {"A": "Cimetidine", "B": "Metformin", "C": "Cyclophosphamide", "D": "Clarithromycin"}, "correct": "C", "explanation": "Cyclophosphamide is listed as increasing gut permeability and microbial translocation as an immune-modulating microbiota interaction.", "optionExplanations": {"A": "Cimetidine is not the named drug for microbial translocation here.", "B": "Metformin is not the example listed in this section.", "C": "Correct. Cyclophosphamide is listed as increasing gut permeability and microbial translocation as an immune-modulating microbiota interaction.", "D": "Clarithromycin is not the immune-modulation example described."}}, {"id": 13, "stem": "A gram-positive coccus in clusters is catalase-positive, coagulase-positive, and grows on mannitol salt agar. Which virulence factor binds the Fc portion of IgG and inhibits opsonization", "topic": "Staphylococcus aureus Protein A", "options": {"A": "M protein", "B": "Tetanospasmin", "C": "CagA", "D": "Protein A"}, "correct": "D", "explanation": "S. aureus Protein A binds the Fc portion of IgG, preventing effective opsonization and phagocytosis.", "optionExplanations": {"A": "M protein is a Group A Streptococcus anti-phagocytic factor.", "B": "Tetanospasmin is a C. tetani exotoxin.", "C": "CagA is an H. pylori virulence factor associated with cancer risk.", "D": "Correct. S. aureus Protein A binds the Fc portion of IgG, preventing effective opsonization and phagocytosis."}}, {"id": 14, "stem": "A gram-positive coccus in chains is catalase-negative, bacitracin-sensitive, and beta-hemolytic. Its anti-phagocytic factor destroys C3 convertase and antibodies against it may cross-react with heart muscle. Which factor is described", "topic": "Group A Streptococcus M protein", "options": {"A": "M protein", "B": "Protein A", "C": "Coagulase", "D": "Cytochrome bd oxidase"}, "correct": "A", "explanation": "M protein is the Group A Streptococcus anti-phagocytic factor described; antibodies against it can cross-react with heart muscle.", "optionExplanations": {"A": "Correct. M protein is the Group A Streptococcus anti-phagocytic factor described; antibodies against it can cross-react with heart muscle.", "B": "Protein A is the Fc-binding factor of S. aureus.", "C": "Coagulase is an S. aureus enzyme that clots blood.", "D": "Cytochrome bd oxidase is discussed with Bacteroides fragilis oxygen reduction."}}, {"id": 15, "stem": "A probiotic organism is a gram-positive branched rod and obligate anaerobe that ferments carbohydrates through the fructose-6-phosphate phosphoketolase pathway. Which organism group fits", "topic": "Bifidobacterium species", "options": {"A": "Bacteroides fragilis", "B": "Escherichia coli", "C": "Proteus species", "D": "Bifidobacterium species"}, "correct": "D", "explanation": "Bifidobacterium species are gram-positive branched rods, obligate anaerobes, common probiotics, and ferment carbohydrates by the fructose-6-phosphate phosphoketolase pathway.", "optionExplanations": {"A": "B. fragilis is a gram-negative anaerobic rod.", "B": "E. coli is a gram-negative facultative anaerobic bacillus and lactose fermenter.", "C": "Proteus species are motile gram-negative bacilli with swarming and urease positivity.", "D": "Correct. Bifidobacterium species are gram-positive branched rods, obligate anaerobes, common probiotics, and ferment carbohydrates by the fructose-6-phosphate phosphoketolase pathway."}}, {"id": 16, "stem": "In the colon, one organism breaks down polysaccharides and uses cytochrome bd oxidase to reduce oxygen, helping obligate anaerobes survive. Which organism is described", "topic": "Bacteroides fragilis ecosystem role", "options": {"A": "Clostridium tetani", "B": "Bacteroides fragilis", "C": "Enterobacter species", "D": "Staphylococcus aureus"}, "correct": "B", "explanation": "Bacteroides fragilis ferments glycans, breaks down polysaccharides, and uses cytochrome bd oxidase to reduce oxygen, supporting other obligate anaerobes.", "optionExplanations": {"A": "C. tetani produces tetanospasmin and is not the oxygen-reducing ecosystem stabilizer.", "B": "Correct. Bacteroides fragilis ferments glycans, breaks down polysaccharides, and uses cytochrome bd oxidase to reduce oxygen, supporting other obligate anaerobes.", "C": "Enterobacter are motile gram-negative rods with citrate use and VP positivity.", "D": "S. aureus is a gram-positive coccus in clusters."}}, {"id": 17, "stem": "A normal colon flora isolate is a gram-negative bacillus that ferments lactose, is indole-positive, methyl-red-positive, VP-negative, citrate-negative, and reduces nitrate to nitrite. Which organism best fits", "topic": "Escherichia coli lab features", "options": {"A": "Klebsiella granulomatis", "B": "Enterococcus faecalis", "C": "Escherichia coli", "D": "Clostridioides difficile"}, "correct": "C", "explanation": "E. coli is a gram-negative bacillus that ferments lactose, is indole-positive, methyl-red-positive, VP-negative, citrate-negative, and nitrate-reducing.", "optionExplanations": {"A": "K. granulomatis is associated with painless beefy red ulcers and Donovan bodies.", "B": "Enterococcus is a gram-positive coccus that grows in bile esculin and 6.5% NaCl.", "C": "Correct. E. coli is a gram-negative bacillus that ferments lactose, is indole-positive, methyl-red-positive, VP-negative, citrate-negative, and nitrate-reducing.", "D": "C. difficile is a gram-positive spore-forming anaerobic rod causing toxin-mediated colitis."}}, {"id": 18, "stem": "A wound culture grows gram-negative bacilli with swarming colonies on nonselective media. The organism is urease-positive and H2S-positive. Which organism group is most likely", "topic": "Proteus species", "options": {"A": "Proteus species", "B": "Bifidobacterium species", "C": "Lactobacillus species", "D": "Group A Streptococcus"}, "correct": "A", "explanation": "Proteus species are motile gram-negative bacilli with swarming colonies, urease positivity, and H2S production.", "optionExplanations": {"A": "Correct. Proteus species are motile gram-negative bacilli with swarming colonies, urease positivity, and H2S production.", "B": "Bifidobacterium are gram-positive branched rods and do not swarm.", "C": "Lactobacillus are gram-positive non-spore-forming rods used as probiotics.", "D": "Group A Streptococcus is gram-positive cocci in chains, not a swarming gram-negative bacillus."}}, {"id": 19, "stem": "A gram-negative rod is motile, urease-negative, VP-positive, methyl-red-negative, citrate-positive, ferments glucose with gas, and reduces nitrate to nitrite. Which genus best matches", "topic": "Enterobacter species", "options": {"A": "Clostridium perfringens", "B": "Enterobacter species", "C": "Escherichia coli", "D": "Enterococcus species"}, "correct": "B", "explanation": "Enterobacter species are motile gram-negative rods that are urease-negative, VP-positive, methyl-red-negative, citrate-positive, ferment glucose with gas, and reduce nitrate.", "optionExplanations": {"A": "C. perfringens is a gram-positive spore-forming rod with double-zone hemolysis.", "B": "Correct. Enterobacter species are motile gram-negative rods that are urease-negative, VP-positive, methyl-red-negative, citrate-positive, ferment glucose with gas, and reduce nitrate.", "C": "E. coli is typically indole-positive, MR-positive, VP-negative, and citrate-negative.", "D": "Enterococcus species are gram-positive cocci, bile-esculin positive, and grow in 6.5% NaCl."}}, {"id": 20, "stem": "A patient has a painless beefy red genital ulcer. Tissue shows macrophages containing Donovan bodies. Which organism is associated with this presentation in the section", "topic": "Klebsiella granulomatis", "options": {"A": "Bacteroides oralis", "B": "Clostridium tetani", "C": "Staphylococcus aureus", "D": "Klebsiella granulomatis"}, "correct": "D", "explanation": "Klebsiella granulomatis is a gram-negative rod causing painless beefy red ulcers with Donovan bodies in macrophages.", "optionExplanations": {"A": "Bacteroides oralis is listed among colon microbiota, not this ulcer syndrome.", "B": "C. tetani causes tetanus via tetanospasmin.", "C": "S. aureus is a gram-positive coccus in clusters and does not produce Donovan bodies.", "D": "Correct. Klebsiella granulomatis is a gram-negative rod causing painless beefy red ulcers with Donovan bodies in macrophages."}}, {"id": 21, "stem": "A normal intestinal flora organism is a gram-positive coccus with Group D-like features. It is bile-esculin positive, PYR positive, and grows in 6.5 percent NaCl. Which group is most likely", "topic": "Enterococcus species", "options": {"A": "Group A Streptococcus", "B": "Escherichia coli", "C": "Enterococcus species", "D": "Bacteroides fragilis"}, "correct": "C", "explanation": "Enterococcus species are gram-positive cocci that are bile-esculin positive, grow in 6.5% NaCl, and are PYR positive.", "optionExplanations": {"A": "GAS is bacitracin-sensitive and beta-hemolytic but not defined by 6.5% NaCl growth.", "B": "E. coli is a gram-negative bacillus, not a gram-positive coccus.", "C": "Correct. Enterococcus species are gram-positive cocci that are bile-esculin positive, grow in 6.5% NaCl, and are PYR positive.", "D": "B. fragilis is a gram-negative anaerobic rod."}}, {"id": 22, "stem": "A blood agar plate shows double-zone hemolysis from a gram-positive spore-forming anaerobic rod. The inner zone is complete hemolysis from theta toxin and the outer zone is partial hemolysis from alpha toxin. Which organism is described", "topic": "Clostridium perfringens", "options": {"A": "Clostridium perfringens", "B": "Clostridioides difficile", "C": "Clostridium tetani", "D": "Bacillus anthracis"}, "correct": "A", "explanation": "Clostridium perfringens produces alpha toxin and theta toxin, generating double-zone hemolysis on blood agar.", "optionExplanations": {"A": "Correct. Clostridium perfringens produces alpha toxin and theta toxin, generating double-zone hemolysis on blood agar.", "B": "C. difficile causes toxin-mediated colitis and yellow ground-glass colonies on CCFA agar.", "C": "C. tetani produces tetanospasmin and typically presents with tetanus.", "D": "Bacillus anthracis is not the double-zone hemolysis organism in this GI microbiota table."}}, {"id": 23, "stem": "A patient develops antibiotic-associated diarrhea and pseudomembranous colitis. Testing suggests a gram-positive, spore-forming, motile obligate anaerobe that grows on CCFA agar with yellow ground-glass colonies. Which organism is most likely", "topic": "Clostridioides difficile", "options": {"A": "Lactobacillus species", "B": "Clostridioides difficile", "C": "Bacteroides fragilis", "D": "Proteus mirabilis"}, "correct": "B", "explanation": "C. difficile causes toxin-mediated colitis, antibiotic-associated diarrhea, and pseudomembranous colitis, and grows on CCFA agar with yellow ground-glass colonies.", "optionExplanations": {"A": "Lactobacillus is protective/probiotic, not the cause of pseudomembranous colitis.", "B": "Correct. C. difficile causes toxin-mediated colitis, antibiotic-associated diarrhea, and pseudomembranous colitis, and grows on CCFA agar with yellow ground-glass colonies.", "C": "B. fragilis supports anaerobic ecosystem stability, not the CCFA pseudomembranous colitis organism.", "D": "Proteus is a swarming urease-positive gram-negative bacillus."}}, {"id": 24, "stem": "A patient with trismus has infection by a gram-positive spore-forming rod with a spherical endospore. Its plasmid-coded exotoxin blocks inhibitory neurons and causes sustained muscle contraction. Which toxin is responsible", "topic": "Clostridium tetani toxin", "options": {"A": "Alpha toxin", "B": "CagA", "C": "Protein A", "D": "Tetanospasmin"}, "correct": "D", "explanation": "Tetanospasmin is the plasmid-coded exotoxin of C. tetani; it blocks inhibitory neurons and causes sustained muscle contraction, often beginning with trismus.", "optionExplanations": {"A": "Alpha toxin is associated with C. perfringens membrane destruction.", "B": "CagA is an H. pylori virulence factor associated with gastric cancer risk.", "C": "Protein A is the Fc-binding virulence factor of S. aureus.", "D": "Correct. Tetanospasmin is the plasmid-coded exotoxin of C. tetani; it blocks inhibitory neurons and causes sustained muscle contraction, often beginning with trismus."}}, {"id": 25, "stem": "A probiotic gram-positive non-spore-forming rod produces hydrogen peroxide, antagonizes Staphylococcus aureus and Pseudomonas, and may be used with antibiotics for H. pylori. Which organism group is described", "topic": "Lactobacillus species", "options": {"A": "Bacteroides species", "B": "Enterobacter species", "C": "Lactobacillus species", "D": "Clostridioides species"}, "correct": "C", "explanation": "Lactobacillus species are gram-positive non-spore-forming rods that produce hydrogen peroxide, protect against pathogens, and can be used as probiotics.", "optionExplanations": {"A": "Bacteroides are gram-negative anaerobic rods, not hydrogen peroxide-producing probiotics here.", "B": "Enterobacter are gram-negative rods with citrate use and let currentIndex = 0;
let answers = {};

function renderProgress() {
  const progress = document.getElementById('progress');
  progress.innerHTML = '';
  questions.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'segment' + (answers[q.id] ? ' answered' : '') + (idx === currentIndex ? ' active' : '');
    btn.title = q.topic || `Question ${idx + 1}`;
    btn.onclick = () => { currentIndex = idx; render(); };
    progress.appendChild(btn);
  });
}

function renderScore() {
  let right = 0;
  let wrong = 0;
  Object.entries(answers).forEach(([id, selected]) => {
    const q = questions.find(item => item.id === Number(id));
    if (!q) return;
    if (selected === q.correct) right++;
    else wrong++;
  });
  document.getElementById('rightCount').textContent = right;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('counter').textContent = `${currentIndex + 1} / ${questions.length}`;
}

function render() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  document.getElementById('questionNumber').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('topic').textContent = q.topic ? `Topic: ${q.topic}` : '';
  document.getElementById('stem').textContent = q.stem + '?';

  const answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (selected) {
      if (letter === q.correct) btn.classList.add('correct');
      else if (letter === selected) btn.classList.add('incorrect');
    }
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => {
      answers[q.id] = letter;
      render();
    };
    answersDiv.appendChild(btn);
  });

  const exp = document.getElementById('explanation');
  if (selected) {
    const correctness = selected === q.correct ? 'Nice job.' : 'Good attempt.';
    const optionRows = Object.entries(q.optionExplanations).map(([letter, text]) =>
      `<p><strong>${letter}.</strong> ${text}</p>`
    ).join('');
    exp.style.display = 'block';
    exp.innerHTML = `
      <p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p>
      <p>${correctness} ${q.explanation}</p>
      <div class="option-exp">
        <p><strong>Why each option is right or wrong:</strong></p>
        ${optionRows}
      </div>
    `;
  } else {
    exp.style.display = 'none';
    exp.innerHTML = '';
  }

  renderProgress();
  renderScore();
}

function goNext() {
  currentIndex = (currentIndex + 1) % questions.length;
  render();
}

function goPrev() {
  currentIndex = (currentIndex - 1 + questions.length) % questions.length;
  render();
}

function resetQuiz() {
  answers = {};
  currentIndex = 0;
  render();
}

render();
</script>
