<script>
const questions = [{"id": 1, "stem": "A patient tells you she uses several over the counter botanical products with her prescription medications because they are natural. Which counseling point best reflects the regulatory and pharmacologic concern emphasized for herbal medicines", "topic": "CAM regulatory status and safety", "options": {"A": "Herbal medicines are regulated as drugs with standardized pharmacokinetic testing", "B": "Herbal medicines are routinely reimbursed by insurance because safety is well documented", "C": "Herbal products may contain multiple active compounds with variable concentrations and poorly studied drug interactions", "D": "Herbal medicines should be considered interaction free when used adjunctively"}, "correct": "C", "explanation": "The section emphasizes that herbal medicines are botanicals rather than drugs and often lack sufficient documentation of safety and efficacy. They commonly contain multiple active compounds with variable concentrations, pharmacologic profiles, pharmacokinetics, and poorly studied drug interactions, so concomitant use with conventional medications should generally be avoided.", "optionExplanations": {"A": "Herbal medicines are listed as botanicals, not drugs, and do not have the same standardized drug documentation.", "B": "The notes state herbal medicines are not reimbursable by insurance and lack sufficient safety and efficacy documentation.", "C": "Correct. Multiple active compounds, variable concentration, and poorly studied interactions are the key concerns.", "D": "Adjunctive use increases the risk of polypharmacy and interactions rather than eliminating it."}}, {"id": 2, "stem": "A pharmacology lecturer uses foxglove leaves as an example of a plant part used medicinally. Which plant derived drug and mechanism are most closely linked to this source", "topic": "Digitalis from foxglove", "options": {"A": "Digitalis or digitoxin inhibiting Na/K ATPase to increase intracellular calcium and contractility", "B": "Vincristine stabilizing microtubules to prevent mitotic spindle breakdown", "C": "Paclitaxel inhibiting Na/K ATPase to increase myocardial contractility", "D": "Paragoric binding tubulin monomers to inhibit microtubule polymerization"}, "correct": "A", "explanation": "Foxglove leaves are the source of digitalis and digitoxin. These cardiac glycosides inhibit Na/K ATPase, which decreases Na/Ca exchange, increases intracellular calcium, and strengthens cardiac contractions.", "optionExplanations": {"A": "Correct. Foxglove corresponds to digitalis or digitoxin with Na/K ATPase inhibition.", "B": "Vincristine is a vinca alkaloid that binds tubulin monomers and decreases microtubule polymerization.", "C": "Paclitaxel is Taxol from yew bark and is a microtubule stabilizer, not a cardiac glycoside.", "D": "Paragoric is listed as a natural product from opium, not a tubulin-binding chemotherapy drug."}}, {"id": 3, "stem": "A patient with leukemia is treated with a plant derived antimitotic chemotherapy agent originally associated with Catharanthus roseus, the Madagascar periwinkle. Which mechanism matches this drug class", "topic": "Vinca alkaloids", "options": {"A": "Irreversible inhibition of H/K ATPase in gastric parietal cells", "B": "Stabilization of microtubules so they cannot break down during cell division", "C": "Weak MAO inhibition with decreased serotonin and norepinephrine reuptake", "D": "Binding tubulin monomers and decreasing microtubule polymerization"}, "correct": "D", "explanation": "Vinca alkaloids such as vinblastine and vincristine come from Catharanthus roseus. Their mechanism is binding tubulin monomers, decreasing microtubule polymerization, and inhibiting mitosis.", "optionExplanations": {"A": "This describes PPIs, not vinca alkaloids.", "B": "Microtubule stabilization is the mechanism of Taxol/paclitaxel.", "C": "This describes St. John's wort mechanisms, not vinca chemotherapy.", "D": "Correct. Vinca alkaloids bind tubulin monomers and prevent microtubule polymerization."}}, {"id": 4, "stem": "A chemotherapy drug derived from yew tree bark causes mitotic arrest by stabilizing microtubules and preventing them from breaking down during cell division. Which agent is being described", "topic": "Taxol paclitaxel", "options": {"A": "Digitoxin", "B": "Paclitaxel", "C": "Vincristine", "D": "Hypericin"}, "correct": "B", "explanation": "Taxol, or paclitaxel, is derived from the bark of the yew tree. The notes describe it as a microtubule-targeting stabilizer that prevents microtubule breakdown during cell division, causing cell death and mitotic arrest.", "optionExplanations": {"A": "Digitoxin is a foxglove-derived cardiac glycoside.", "B": "Correct. Paclitaxel is Taxol from yew bark and stabilizes microtubules.", "C": "Vincristine is a vinca alkaloid that blocks microtubule polymerization rather than stabilizing microtubules.", "D": "Hypericin is an active component of St. John's wort."}}, {"id": 5, "stem": "An older adult with vascular dementia and tinnitus starts taking a whole leaf extract supplement. She is scheduled for surgery next week and also takes an antiplatelet medication. Which recommendation is most appropriate based on the notes", "topic": "Ginkgo biloba bleeding risk", "options": {"A": "Stop ginkgo before surgery because it decreases platelet aggregation and increases bleeding risk", "B": "Increase the dose because ginkgo improves platelet aggregation before surgery", "C": "Continue ginkgo because it has no interaction with antiplatelet or anticoagulant drugs", "D": "Switch to kava because it reverses antiplatelet effects"}, "correct": "A", "explanation": "Ginkgo biloba is used for Alzheimer disease, vascular dementia, peripheral claudication, and tinnitus. It decreases platelet aggregation and increases bleeding risk, so it should be avoided with antiplatelets or anticoagulants and stopped before surgery.", "optionExplanations": {"A": "Correct. Ginkgo is the “go bleed” supplement and should be stopped preoperatively.", "B": "Ginkgo decreases, not improves, platelet aggregation.", "C": "The notes specifically warn against combining ginkgo with antiplatelets or anticoagulants.", "D": "Kava is an anxiolytic sedative with hepatotoxicity concerns, not a reversal agent for bleeding risk."}}, {"id": 6, "stem": "A man with benign prostatic hyperplasia starts an herbal supplement and reports improved nocturia, dysuria, peak urinary flow, and post void residual volume after several weeks. Which mechanism best matches this supplement", "topic": "Saw palmetto BPH mechanism", "options": {"A": "Selective cartilage uptake as a substrate for glycosaminoglycan synthesis", "B": "Weak MAO inhibition and decreased serotonin reuptake", "C": "Decreased 5 alpha reductase activity with decreased DHT effects and alpha 1 receptor antagonism", "D": "Potentiation of GABA mediated inhibition similar to benzodiazepines"}, "correct": "C", "explanation": "Saw palmetto is used for BPH. The notes list mechanisms including decreased 5 alpha reductase leading to decreased DHT, decreased DHT binding at androgen receptors, decreased prostaglandin synthesis, and alpha 1 receptor antagonism.", "optionExplanations": {"A": "This describes glucosamine cartilage support.", "B": "This describes St. John's wort antidepressant mechanisms.", "C": "Correct. Saw palmetto targets DHT biology and also has alpha 1 receptor antagonist activity.", "D": "This describes kava."}}, {"id": 7, "stem": "A patient taking a supplement for BPH has an unexpectedly low screening marker during evaluation for possible prostate disease. The notes also warn that this supplement may interfere with iron absorption. Which supplement is most likely", "topic": "Saw palmetto adverse effects", "options": {"A": "Black cohosh", "B": "Ginkgo biloba", "C": "Echinacea", "D": "Saw palmetto"}, "correct": "D", "explanation": "Saw palmetto is used for BPH and can improve urinary symptoms, but the notes warn that it can cause false negative PSA levels and interfere with iron absorption.", "optionExplanations": {"A": "Black cohosh is used for menopausal symptoms and has hepatotoxicity risk.", "B": "Ginkgo is associated with bleeding risk, not false negative PSA.", "C": "Echinacea is used for common cold symptoms and can cause allergic reactions or autoimmune exacerbation.", "D": "Correct. Saw palmetto can lower PSA and interfere with iron absorption."}}, {"id": 8, "stem": "A woman with hot flashes asks about an herbal product commonly used for menopausal symptoms and menstrual dysfunction. The notes list uncertain estrogen receptor mediated effects, GI distress, hepatotoxicity risk, and avoidance in breast cancer. Which supplement is this", "topic": "Black cohosh", "options": {"A": "Garlic", "B": "Black cohosh", "C": "Glucosamine", "D": "Noni"}, "correct": "B", "explanation": "Black cohosh is used for menopausal symptoms and menstrual dysfunction. Its mechanism may be estrogen receptor mediated but is uncertain. It can cause GI distress, carries hepatotoxicity risk, and should be avoided in patients with breast cancer.", "optionExplanations": {"A": "Garlic is used for cardiovascular and antimicrobial support and increases anticoagulation.", "B": "Correct. Black cohosh is the menopausal symptom supplement with hepatotoxicity and breast cancer cautions.", "C": "Glucosamine is used for cartilage and joint support.", "D": "Noni has limited data and proposed anti-tumor, anti-inflammatory, and weight loss effects."}}, {"id": 9, "stem": "A patient with a history of breast cancer asks about supplements for menopausal symptoms. Which option from the section should be avoided in patients with a positive history of breast cancer", "topic": "Soy and breast cancer caution", "options": {"A": "Glucosamine", "B": "Fennel", "C": "Soy", "D": "Coenzyme Q10"}, "correct": "C", "explanation": "The notes list soy for menopausal symptoms, cholesterol reduction, and osteoporosis, but specifically mark it as avoid if there is a positive history of breast cancer.", "optionExplanations": {"A": "Glucosamine is for cartilage and joint support, not the breast cancer caution listed here.", "B": "Fennel is listed for dysmenorrhea and cough with anti-inflammatory and anti-cancer properties.", "C": "Correct. Soy is specifically labeled avoid if there is a positive history of breast cancer.", "D": "Coenzyme Q10 is listed for migraine, hypertension, lower blood pressure, and heart failure symptom improvement."}}, {"id": 10, "stem": "A patient with migraines and hypertension starts a supplement listed as lowering blood pressure and improving heart failure symptoms. Which adverse effect or warning is specifically attached to this supplement in the notes", "topic": "Coenzyme Q10", "options": {"A": "Hepatic dysfunction", "B": "False negative PSA", "C": "Severe kava dermopathy", "D": "Serotonin syndrome with SSRIs"}, "correct": "A", "explanation": "Coenzyme Q10 is listed for migraine and hypertension, with effects including decreased blood pressure and heart failure symptom improvement. The warning noted is hepatic dysfunction.", "optionExplanations": {"A": "Correct. Hepatic dysfunction is the warning listed under Coenzyme Q10.", "B": "False negative PSA is a saw palmetto warning.", "C": "Kava dermopathy is associated with kava.", "D": "Serotonin syndrome with SSRIs is a St. John's wort concern."}}, {"id": 11, "stem": "A patient with mild depression starts St. John’s wort while taking warfarin, simvastatin, a protease inhibitor, and an oral contraceptive. Which pharmacokinetic change best explains why several of these drugs may become less effective", "topic": "St. Johns wort CYP induction", "options": {"A": "Direct inhibition of platelet aggregation", "B": "Chelation of iron and calcium in the gut", "C": "Irreversible inhibition of H/K ATPase", "D": "Increased CYP450 activity involving 1A2, 2C9, and 3A4"}, "correct": "D", "explanation": "St. John’s wort contains hyperforin and hypericin and is used for mild to moderate depression, anxiety, and sleep disorders. The notes emphasize that it increases CYP450 enzymes including 1A2, 2C9, and 3A4, which can decrease warfarin, simvastatin, protease inhibitors, and oral contraceptive effectiveness.", "optionExplanations": {"A": "Decreased platelet aggregation is more relevant for ginkgo, garlic, and ginseng bleeding risk.", "B": "Iron absorption interference is noted for saw palmetto, not St. John's wort.", "C": "This describes PPIs, not St. John's wort.", "D": "Correct. CYP induction by St. John's wort explains decreased levels/effectiveness of multiple drugs."}}, {"id": 12, "stem": "A patient taking an SSRI for depression adds an herbal antidepressant that weakly inhibits MAO and decreases reuptake of serotonin, norepinephrine, and dopamine. Which complication is most concerning", "topic": "St. Johns wort serotonin syndrome", "options": {"A": "False negative PSA screening", "B": "Painless hematuria from bladder irritation", "C": "Serotonin syndrome", "D": "Lithium battery perforation"}, "correct": "C", "explanation": "St. John’s wort can weakly inhibit MAO and decrease reuptake of serotonin, norepinephrine, and dopamine. The notes specifically warn to avoid combining it with SSRIs because of serotonin syndrome risk.", "optionExplanations": {"A": "False negative PSA is associated with saw palmetto.", "B": "This is not a listed herbal supplement adverse effect in this section.", "C": "Correct. St. John's wort plus SSRIs increases serotonin syndrome risk.", "D": "Lithium battery perforation belongs to esophageal foreign body material, not herbal supplements."}}, {"id": 13, "stem": "A patient takes an herbal supplement at the first sign of a cold because she heard it can decrease symptom severity and duration by 1 to 3 days. She has autoimmune disease and uses NSAIDs regularly. Which warning is most relevant", "topic": "Echinacea adverse effects", "options": {"A": "It causes false negative PSA levels", "B": "It may exacerbate autoimmune disease and increase NSAID related GI hemorrhage risk", "C": "It must be stopped because it causes lithium battery burns", "D": "It prevents all allergic reactions by suppressing mast cells"}, "correct": "B", "explanation": "Echinacea is used for the common cold and infectious diseases and may reduce severity and duration of cold symptoms by 1 to 3 days. Adverse effects include allergic reactions or anaphylaxis, dry mouth, constipation, GERD, autoimmune exacerbation, decreased CYP3A4, and increased NSAID effects leading to GI hemorrhage.", "optionExplanations": {"A": "False negative PSA is saw palmetto.", "B": "Correct. Autoimmune exacerbation and increased NSAID-related GI hemorrhage are specific echinacea warnings.", "C": "Lithium battery burns are unrelated to this herbal supplement section.", "D": "Echinacea can cause allergic reactions and anaphylaxis, not prevent them."}}, {"id": 14, "stem": "A patient on immunosuppressant therapy starts a supplement marketed for vitality, immunity, cognition, and libido. The notes describe increased monocyte activation and increased TNF, IL-2, and IFN-gamma. Which clinical concern is most appropriate", "topic": "Ginseng immune effects", "options": {"A": "The supplement will reliably increase immunosuppressant effectiveness", "B": "The supplement is contraindicated only because it causes false negative PSA levels", "C": "The supplement has no immune effects despite its marketing", "D": "The supplement may decrease the effectiveness of immunosuppressants"}, "correct": "D", "explanation": "Ginseng is marketed for vitality, immunity, cognition, and libido. It has immune modulation effects with increased monocyte activation and increased TNF, IL-2, and IFN-gamma, and the notes warn that it decreases the effectiveness of immunosuppressants.", "optionExplanations": {"A": "The notes state the opposite: ginseng can decrease immunosuppressant effectiveness.", "B": "False negative PSA is linked to saw palmetto, not ginseng.", "C": "The notes explicitly describe immune modulation by ginseng.", "D": "Correct. Ginseng can counteract immunosuppressants."}}, {"id": 15, "stem": "A patient using a supplement for vitality and cognition develops insomnia, diarrhea, vaginal bleeding, hypoglycemia, increased QT interval, and reduced platelet aggregation. Which supplement best fits this adverse effect pattern", "topic": "Ginseng adverse effects", "options": {"A": "Ginseng", "B": "Kava", "C": "Glucosamine", "D": "Black cohosh"}, "correct": "A", "explanation": "The notes list ginseng adverse effects as insomnia, diarrhea, vaginal bleeding, schizophrenia exacerbation, decreased platelet aggregation, increased QT interval, hypoglycemia, and decreased effectiveness of immunosuppressants.", "optionExplanations": {"A": "Correct. This cluster is the ginseng adverse effect profile.", "B": "Kava is associated with GABA-like sedation, hepatotoxicity, Parkinson disease exacerbation, and kava dermopathy.", "C": "Glucosamine is for cartilage support and is not linked to this adverse effect cluster.", "D": "Black cohosh is linked to GI distress, hepatotoxicity, and avoidance in breast cancer."}}, {"id": 16, "stem": "A patient uses an herbal product for anxiety and muscle relaxation. The supplement contains kavalactones and has benzodiazepine like potentiation of GABA mediated inhibition. Which warning is most important", "topic": "Kava mechanism and toxicity", "options": {"A": "It strongly induces CYP450 and causes oral contraceptive failure", "B": "It causes false negative PSA levels", "C": "It can cause severe hepatotoxicity and should be avoided with alcohol or CNS depressants", "D": "It prevents microtubule breakdown and causes mitotic arrest"}, "correct": "C", "explanation": "Kava contains kavalactones and potentiates GABA mediated inhibition, producing anxiolytic, muscle relaxant, and sedative effects. The notes warn of severe hepatotoxicity, especially pills, Parkinson disease exacerbation, kava dermopathy, and avoidance with alcohol or CNS depressants.", "optionExplanations": {"A": "CYP induction and oral contraceptive failure are St. John's wort concerns.", "B": "False negative PSA is saw palmetto.", "C": "Correct. Severe hepatotoxicity plus avoidance with alcohol/CNS depressants are key kava warnings.", "D": "Microtubule stabilization describes paclitaxel."}}, {"id": 17, "stem": "A patient with Parkinson disease and chronic alcohol use asks about taking kava for anxiety. Which response best reflects the section", "topic": "Kava contraindication style warnings", "options": {"A": "Kava is preferred because it has no neurologic or hepatic adverse effects", "B": "Kava should be avoided because it can worsen Parkinson disease and has severe hepatotoxicity risk", "C": "Kava should be used to increase CYP450 metabolism of alcohol", "D": "Kava is indicated because it reliably reverses CNS depressant effects"}, "correct": "B", "explanation": "Kava is an anxiolytic supplement with sedative properties, but the notes list severe hepatotoxicity, Parkinson disease exacerbation, kava dermopathy, and avoidance with alcohol and CNS depressants.", "optionExplanations": {"A": "The notes list both neurologic and hepatic concerns.", "B": "Correct. Parkinson disease exacerbation and hepatotoxicity make kava a poor choice here.", "C": "Kava is not described as a CYP inducer for alcohol metabolism.", "D": "Kava can add CNS depressant effects; it does not reverse them."}}, {"id": 18, "stem": "A patient drinks Tahitian Noni Juice for proposed anti tumor, anti inflammatory, and weight loss effects. Which statement is most consistent with the notes", "topic": "Noni", "options": {"A": "It is proven to prevent all drug interactions", "B": "It is a standardized drug with well defined toxicity", "C": "It is the preferred supplement for BPH because it lowers DHT", "D": "There is limited data on toxicity and interactions"}, "correct": "D", "explanation": "Noni is listed as Tahitian Noni Juice with decreased superoxide radical formation and proposed anti-tumor, anti-inflammatory, and weight loss effects. The notes emphasize limited data on toxicity and interactions.", "optionExplanations": {"A": "The notes do not say Noni prevents interactions.", "B": "It is not presented as a standardized drug with well defined toxicity.", "C": "Saw palmetto, not Noni, is used for BPH and DHT-related mechanisms.", "D": "Correct. Limited toxicity and interaction data is the key Noni warning."}}, {"id": 19, "stem": "A patient with joint pain takes a seashell extract supplement for cartilage and joint support. Which mechanism best matches this agent", "topic": "Glucosamine", "options": {"A": "Substrate for glycosaminoglycan and proteoglycan synthesis with selective cartilage uptake", "B": "Weak MAO inhibition and decreased serotonin reuptake", "C": "Decreased 5 alpha reductase activity and decreased DHT", "D": "Binding to tubulin monomers to inhibit mitosis"}, "correct": "A", "explanation": "Glucosamine is listed for cartilage and joint support. It is a seashell extract that serves as a substrate for glycosaminoglycan and proteoglycan synthesis, has selective cartilage uptake, and decreases pro-inflammatory cytokines, PGE, phagocytosis, and lysozyme.", "optionExplanations": {"A": "Correct. This is the glucosamine mechanism and use.", "B": "This describes St. John's wort.", "C": "This describes saw palmetto.", "D": "This describes vinca alkaloids."}}, {"id": 20, "stem": "A patient using warfarin starts chewing a supplement for cardiovascular and antimicrobial support. The notes list decreased cholesterol synthesis, decreased blood pressure, decreased platelet aggregation, and antibacterial, antiviral, and antifungal effects. Which supplement is this", "topic": "Garlic", "options": {"A": "Fennel", "B": "Soy", "C": "Garlic", "D": "Black cohosh"}, "correct": "C", "explanation": "Garlic is listed for cardiovascular and antimicrobial support. It decreases cholesterol synthesis, blood pressure, and platelet aggregation and has antibacterial, antiviral, and antifungal effects. It can increase oral anticoagulation, decrease saquinavir bioavailability, and cause GI irritation and malodorous breath or body odor.", "optionExplanations": {"A": "Fennel is listed for dysmenorrhea and cough.", "B": "Soy is used for menopausal symptoms, cholesterol reduction, and osteoporosis.", "C": "Correct. Garlic matches the cardiovascular, antimicrobial, and bleeding-risk profile.", "D": "Black cohosh is used for menopausal symptoms and has hepatotoxicity risk."}}, {"id": 21, "stem": "A patient taking an HIV protease inhibitor has reduced exposure to the drug after starting a supplement that also causes GI irritation and malodorous breath. Which interaction is specifically listed", "topic": "Garlic interaction", "options": {"A": "Increased warfarin clearance through CYP induction", "B": "Decreased saquinavir bioavailability", "C": "Increased PSA false positives", "D": "Reduced glucose transport in intestinal epithelium"}, "correct": "B", "explanation": "Garlic is associated with increased oral anticoagulation, decreased saquinavir bioavailability, GI irritation, and malodorous breath or body odor.", "optionExplanations": {"A": "St. John's wort increases CYP450 activity; garlic is listed as increasing oral anticoagulation rather than clearing warfarin.", "B": "Correct. Decreased saquinavir bioavailability is specifically listed for garlic.", "C": "False negative PSA, not increased false positives, is listed for saw palmetto.", "D": "Reduced glucose transport is a Clostridium perfringens toxin concept, not garlic."}}, {"id": 22, "stem": "A student makes a memory hook for herbal supplements that increase warfarin effect using the “4 G’s.” Which set matches the notes", "topic": "Four Gs warfarin effect", "options": {"A": "Glucosamine, garlic, grapefruit, gentian", "B": "Ginkgo, ginger, glucosamine, goserelin", "C": "Ginseng, garlic, goldenseal, galactose", "D": "Garlic, ginseng, ginkgo biloba, ginger"}, "correct": "D", "explanation": "The board pearl lists the “4 G’s” that increase warfarin effect: garlic, ginseng, ginkgo biloba, and ginger.", "optionExplanations": {"A": "Glucosamine is not part of the listed 4 G warfarin pearl.", "B": "Glucosamine and goserelin are not in the 4 G list.", "C": "Goldenseal and galactose are not the listed board pearl items.", "D": "Correct. Garlic, ginseng, ginkgo biloba, and ginger are the 4 G’s that increase warfarin effect."}}, {"id": 23, "stem": "A patient on warfarin asks which supplements from her list could increase anticoagulation. Which supplement is specifically included in the notes as increasing warfarin effect", "topic": "Ginger and warfarin", "options": {"A": "Soy", "B": "Fennel", "C": "Ginger", "D": "Noni"}, "correct": "C", "explanation": "The notes include ginger in the board pearl “4 G’s” that increase warfarin effect, along with garlic, ginseng, and ginkgo biloba.", "optionExplanations": {"A": "Soy is listed for menopausal symptoms, cholesterol reduction, and osteoporosis, not the 4 G warfarin effect.", "B": "Fennel is listed for dysmenorrhea and cough.", "C": "Correct. Ginger is one of the 4 G supplements that increase warfarin effect.", "D": "Noni has limited toxicity and interaction data but is not one of the 4 G’s listed."}}, {"id": 24, "stem": "A patient asks why physicians are cautious when patients use herbal products together with conventional medications. Which general statement from the section best answers this", "topic": "Herbal supplement polypharmacy", "options": {"A": "Drug drug interactions are poorly studied, so concomitant use with conventional medications is generally discouraged", "B": "All herbal supplements are single active ingredients with predictable pharmacokinetics", "C": "FDA regulation guarantees equivalent safety documentation to prescription drugs", "D": "Herbal products are always inactive unless converted into pure compounds"}, "correct": "A", "explanation": "The section stresses that most herbal products contain multiple active compounds with variable active ingredient concentrations, pharmacologic profiles, and pharmacokinetics. Drug-drug interactions are poorly studied, and concomitant use with conventional medications should generally be avoided.", "optionExplanations": {"A": "Correct. Poorly studied interactions and variable pharmacology are the core concern.", "B": "The notes state most contain multiple active compounds.", "C": "The notes state they lack sufficient documentation of safety and efficacy.", "D": "Herbal products can have active pharmacologic effects without being purified drugs."}}, {"id": 25, "stem": "A patient reports using fennel. According to the section, which indication is listed for this supplement", "topic": "Fennel", "options": {"A": "Benign prostatic hyperplasia", "B": "Mild to moderate depression", "C": "Peripheral claudication", "D": "Dysmenorrhea and cough"}, "correct": "D", "explanation": "Fennel is listed for dysmenorrhea and cough, with anti-inflammatory and anti-cancer properties and use in cough remedies.", "optionExplanations": {"A": "BPH is associated with saw palmetto.", "B": "Mild to moderate depression is associated with St. John's wort.", "C": "Peripheral claudication is listed under ginkgo biloba.", "D": "Correct. Fennel is listed for dysmenorrhea and cough."}}, {"id": 26, "stem": "A patient taking oral contraceptives begins St. John’s wort for anxiety and sleep. Which outcome should be discussed based on the notes", "topic": "St. Johns wort oral contraceptive failure", "options": {"A": "Increased contraceptive effectiveness through CYP inhibition", "B": "Contraceptive failure due to decreased oral contraceptive effectiveness", "C": "Improved PSA screening accuracy", "D": "Complete prevention of serotonin syndrome"}, "correct": "B", "explanation": "St. John’s wort increases CYP450 enzymes and can decrease the effectiveness of oral contraceptives, leading to contrace ntraceptive failure"}, "correct": "A", "explanation": "Ginkgo biloba is used for Alzheimer disease, vascular dementia, peripheral claudication, and tinnitus. Its mechanisms include anti-inflammatory and antioxidant effects, radical scavenging, decreased platelet aggregation, and increased blood supply/circulation and oxygen tension. Decreased platelet aggregation creates increased bleeding risk.", "optionExplanations": {"A": "Correct. Ginkgo supports circulation but increases bleeding risk through decreased platelet aggregation.", "B": "This describes kava.", "C": "This describes saw palmetto.", "D": "This describes St. John's wort."}}, {"id": 29, "stem": "A student is differentiating categories of natural medical products. Which example best matches the “pure compound” category in the section", "topic": "Botanical pharmaceuticals categories", "options": {"A": "Foxglove leaves", "B": "Taxol", "C": "Opium to paragoric", "D": "Whole leaf ginkgo extract"}, "correct": "B", "explanation": "The section distinguishes herbal products as plant parts used medicinally, natural products as crude extracts refined into fractions, and pure compounds. Taxol is listed as the example of a pure compound.", "optionExplanations": {"A": "Foxglove leaves are an example of plant parts used medicinally, an herbal product.", "B": "Correct. Taxol is the listed pure compound example.", "C": "Opium to paragoric is listed as a natural product example involving crude extract to refined fraction.", "D": "Whole leaf ginkgo extract is an herbal supplement, not the listed pure compound example."}}, {"id": 30, "stem": "A patient with mild to moderate depression chooses a supplement containing hyperforin and hypericin. In addition to weak MAO inhibition, which neurotransmitter effect is described", "topic": "St. Johns wort mechanism", "options": {"A": "Selective blockade of dopamine D2 receptors in the chemoreceptor trigger zone", "B": "Irreversible inhibition of Na/K ATPase in cardiac myocytes", "C": let currentIndex = 0;
const answers = {};
const segmentsEl = document.getElementById('segments');
const progressEl = document.getElementById('progress');
const wrongCountEl = document.getElementById('wrongCount');
const rightCountEl = document.getElementById('rightCount');
const qNumEl = document.getElementById('qNum');
const topicEl = document.getElementById('topic');
const stemEl = document.getElementById('stem');
const optionsEl = document.getElementById('options');
const explanationEl = document.getElementById('explanation');
function renderSegments() {
  segmentsEl.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('button');
    b.className = 'seg' + (idx === currentIndex ? ' active' : '') + (answers[q.id] !== undefined ? ' answered' : '');
    b.title = q.topic || `Question ${idx + 1}`;
    b.setAttribute('aria-label', `Go to question ${idx + 1}`);
    b.onclick = () => { currentIndex = idx; render(); };
    segmentsEl.appendChild(b);
  });
}
function renderCounts() {
  let right = 0, wrong = 0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (q && choice === q.correct) right++; else if (q) wrong++;
  });
  rightCountEl.textContent = right;
  wrongCountEl.textContent = wrong;
}
function renderQuestion() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  const showExplanation = selected !== null;
  progressEl.textContent = `${currentIndex + 1} / ${questions.length}`;
  qNumEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  topicEl.textContent = q.topic ? `Topic: ${q.topic}` : '';
  stemEl.textContent = q.stem + '?';
  optionsEl.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (showExplanation && letter === q.correct) btn.className += ' correct';
    else if (showExplanation && letter === selected && letter !== q.correct) btn.className += ' wrong';
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    optionsEl.appendChild(btn);
  });
  explanationEl.innerHTML = '';
  if (showExplanation) {
    const div = document.createElement('div');
    div.className = 'explanation';
    const isCorrect = selected === q.correct;
    const lines = Object.entries(q.optionExplanations || {}).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('');
    div.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p><p class="${isCorrect ? 'correctText' : 'wrongText'}">${isCorrect ? 'Nice job. ' : 'Good attempt. '}${q.explanation}</p><div><p><strong>Why each option is right or wrong:</strong></p>${lines}</div>`;
    explanationEl.appendChild(div);
  }
}
function render() { renderSegments(); renderCounts(); renderQuestion(); }
document.getElementById('prev').onclick = () => { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); };
document.getElementById('next').onclick = () => { currentIndex = (currentIndex + 1) % questions.length; render(); };
render();
</script>
