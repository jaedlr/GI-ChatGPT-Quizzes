<script>
const questions = [{"id": 1, "stem": "A student is organizing parasites into board-relevant groups. They place Ascaris, hookworms, Enterobius, Strongyloides, and Trichuris into the same category. Which classification best describes this group", "topic": "Helminth classification", "options": {"A": "Cestodes", "B": "Trematodes", "C": "Nematodes", "D": "Arthropods"}, "correct": "C", "explanation": "Ascaris, hookworms, Enterobius, Strongyloides, and Trichuris are nematodes, or roundworms. The section separates helminths into nematodes, cestodes, and trematodes.", "optionExplanations": {"A": "Cestodes are tapeworms such as Taenia species and Echinococcus.", "B": "Trematodes are flukes such as liver, biliary, intestinal flukes, and Schistosoma.", "C": "Correct. These listed organisms are intestinal nematodes, also called roundworms.", "D": "Arthropods include organisms such as ticks and lice, not these helminths."}}, {"id": 2, "stem": "A patient from an endemic area has a low helminth burden and is asymptomatic, while a child from the same village has a high worm burden and develops intestinal obstruction. Which general principle explains this difference", "topic": "General helminth disease principles", "options": {"A": "Adult worms generally do not multiply in humans, so disease severity is proportional to worm burden", "B": "All adult helminths multiply rapidly inside human blood", "C": "Clinical disease is unrelated to parasite number", "D": "Only protozoa can cause symptoms in humans"}, "correct": "A", "explanation": "The section emphasizes that adult worms do not multiply in humans, so severity depends on worm burden. Low burden can be asymptomatic, while high burden can cause clinical disease.", "optionExplanations": {"A": "Correct. Worm burden is the key determinant because adult worms do not multiply inside humans.", "B": "This contradicts the notes; adult worms generally do not multiply in humans.", "C": "The notes explicitly link clinical severity to worm burden.", "D": "Helminths can clearly cause symptoms such as obstruction, blood loss, and tissue inflammation."}}, {"id": 3, "stem": "A helminth damages intestinal epithelium. The epithelium releases alarmins that initiate a type 2 immune response. Which pair of epithelial cytokines is emphasized in the notes", "topic": "Helminth immune response", "options": {"A": "IL-12 and IFN-gamma", "B": "IL-1 and TNF-alpha", "C": "IL-17 and IL-23", "D": "IL-33 and TSLP"}, "correct": "D", "explanation": "Helminth-related tissue injury causes epithelial release of alarmins, especially IL-33 and TSLP, which help initiate a type 2/Th2 immune response.", "optionExplanations": {"A": "IL-12 and IFN-gamma are more associated with Th1 responses, not the alarmins listed here.", "B": "IL-1 and TNF-alpha are inflammatory cytokines but are not the epithelial alarmin pair highlighted.", "C": "IL-17 and IL-23 are associated with Th17 biology, not the helminth alarmins emphasized.", "D": "Correct. IL-33 and TSLP are the epithelial alarmins listed for initiating the type 2 response."}}, {"id": 4, "stem": "A chronic intestinal helminth infection persists despite a host immune response. The organism promotes FoxP3-positive regulatory T cells through CD103-positive dendritic cells and alters gut microbiota to increase short-chain fatty acids. What is the net immunologic effect", "topic": "Helminth immune evasion", "options": {"A": "Acute neutrophilic eradication of all adult worms", "B": "Immune tolerance that permits chronic infection", "C": "Complete blockade of regulatory T-cell expansion", "D": "Exclusive Th1 polarization with granuloma formation"}, "correct": "B", "explanation": "The notes describe helminth immune modulation through decreased Th2 differentiation, increased FoxP3-positive T-reg cells, microbiota changes with increased SCFAs, and IL-33-driven T-reg expansion. The net effect is immune tolerance and chronic infection.", "optionExplanations": {"A": "The described changes dampen immunity rather than causing neutrophilic eradication.", "B": "Correct. Increased T-reg activity and immune modulation favor tolerance and chronic infection.", "C": "The notes say helminths increase, not block, T-reg expansion.", "D": "The notes emphasize type 2 responses and immune modulation, not exclusive Th1 polarization."}}, {"id": 5, "stem": "A child ingests embryonated eggs from soil contaminated with feces. Larvae hatch in the intestine, enter the portal circulation, migrate to the lungs to mature, ascend the bronchial tree, and are swallowed. He later develops cough, wheezing, and intestinal obstruction. Which organism is most likely", "topic": "Ascaris lumbricoides", "options": {"A": "Ascaris lumbricoides", "B": "Enterobius vermicularis", "C": "Taenia saginata", "D": "Schistosoma mansoni"}, "correct": "A", "explanation": "Ascaris is acquired by ingestion of embryonated eggs. Larvae hatch in the intestine, migrate via the portal system to the lungs, ascend the bronchial tree, and are swallowed. Lung migration can cause L\u00f6ffler-type cough/wheezing, and adult worms can cause intestinal obstruction in children.", "optionExplanations": {"A": "Correct. This life cycle and the combination of lung symptoms plus intestinal obstruction match Ascaris.", "B": "Enterobius causes nocturnal perianal itching from perianal egg deposition.", "C": "Taenia saginata is acquired by eating undercooked beef containing cysticerci and causes intestinal tapeworm infection.", "D": "Schistosoma penetrates skin as cercariae and adult worms live in venous plexuses."}}, {"id": 6, "stem": "A heavily infected child develops abdominal distention and symptoms of small bowel obstruction. Stool studies eventually identify a roundworm whose larvae require lung migration before returning to the intestine. Which mechanism is most responsible for the obstruction", "topic": "Ascaris pathogenesis", "options": {"A": "Eggs punching through the bladder wall", "B": "Blood feeding by adult worms attached to intestinal mucosa", "C": "Large adult worms mechanically obstructing the intestine", "D": "Cysts rupturing in the liver and forming secondary cysts"}, "correct": "C", "explanation": "Ascaris adult worms live in the small intestine. High worm burden can cause mechanical intestinal obstruction, especially in children.", "optionExplanations": {"A": "Eggs punching through the bladder wall is associated with Schistosoma haematobium.", "B": "Blood feeding with anemia is more typical of hookworm infection.", "C": "Correct. Adult Ascaris worms can obstruct the intestine when worm burden is high.", "D": "Rupture with secondary cysts describes hydatid disease from Echinococcus."}}, {"id": 7, "stem": "A 12 year old boy who often walks barefoot has weakness, exertional faintness, pallor, puffy face, epigastric pain, eosinophilia, and a hematocrit of 21 percent. Which organism best explains the anemia", "topic": "Hookworm disease", "options": {"A": "Enterobius vermicularis", "B": "Taenia saginata", "C": "Ascaris lumbricoides", "D": "Necator americanus"}, "correct": "D", "explanation": "Hookworms such as Ancylostoma duodenale and Necator americanus penetrate skin, migrate through the lungs, and mature in the intestine. Adults attach to the intestinal wall and feed on erythrocytes, causing iron-deficiency anemia with pallor, weakness, and eosinophilia.", "optionExplanations": {"A": "Enterobius causes nocturnal perianal pruritus, not severe blood-loss anemia.", "B": "Taenia saginata causes intestinal tapeworm infection after undercooked beef, not the barefoot anemia pattern.", "C": "Ascaris can cause lung symptoms and obstruction, but hookworm is the classic severe anemia plus barefoot exposure organism.", "D": "Correct. Necator americanus is a hookworm that causes blood loss and iron-deficiency anemia."}}, {"id": 8, "stem": "A parasite\u2019s eggs contaminate warm damp soil. Filariform larvae develop, penetrate bare skin, migrate through blood and lymphatics to the lungs, enter alveoli, ascend the respiratory tree, are swallowed, and mature in the upper intestine. Which exposure is most consistent with this life cycle", "topic": "Hookworm transmission and life cycle", "options": {"A": "Eating raw freshwater fish", "B": "Walking barefoot on contaminated soil", "C": "Eating undercooked pork cysticerci", "D": "Scratching perianal skin and ingesting eggs"}, "correct": "B", "explanation": "Hookworm infection occurs when infective filariform larvae in contaminated soil penetrate skin, classically through barefoot exposure. The larvae migrate to the lungs and then return to the intestine.", "optionExplanations": {"A": "Raw or undercooked freshwater fish is associated with Clonorchis/Opisthorchis liver flukes.", "B": "Correct. Barefoot exposure to contaminated soil is the key hookworm transmission clue.", "C": "Undercooked pork cysticerci leads to intestinal Taenia solium infection, not hookworm.", "D": "Scratching perianal skin and ingesting eggs is Enterobius autoinfection."}}, {"id": 9, "stem": "A 7 year old child has intense anal itching that is worst at night. The notes describe pregnant female worms migrating outside the anus nocturnally to lay eggs on the perianal skin. Which organism is most likely", "topic": "Enterobius vermicularis", "options": {"A": "Enterobius vermicularis", "B": "Strongyloides stercoralis", "C": "Trichuris trichiura", "D": "Echinococcus granulosus"}, "correct": "A", "explanation": "Enterobius vermicularis, or pinworm, causes nocturnal perianal pruritus because pregnant female worms migrate out of the anus at night to lay eggs on perianal skin.", "optionExplanations": {"A": "Correct. Nocturnal perianal itching is the board-style clue for Enterobius.", "B": "Strongyloides is associated with larva currens and autoinfection/hyperinfection.", "C": "Trichuris can cause diarrhea, anemia, and rectal prolapse with high worm burden.", "D": "Echinococcus causes hydatid cyst disease, often in liver or lungs."}}, {"id": 10, "stem": "A child with pinworm scratches the perianal area at night and later reinfects himself after inadequate handwashing. Which step is central to this autoinfection cycle", "topic": "Enterobius autoinfection", "options": {"A": "Skin penetration by cercariae from freshwater", "B": "Larvae encysting in striated muscle of cattle", "C": "Ingestion of infective eggs from contaminated fingers", "D": "Metacercariae migrating through the ampulla of Vater"}, "correct": "C", "explanation": "Enterobius eggs are laid on perianal skin and mature quickly. Scratching followed by poor hand hygiene can lead to ingestion of infective eggs and autoinfection.", "optionExplanations": {"A": "Skin penetration by cercariae describes Schistosoma transmission.", "B": "Larvae encysting in striated muscle of cattle describes the Taenia saginata cycle.", "C": "Correct. Enterobius autoinfection occurs by fecal-oral ingestion of eggs after scratching.", "D": "Migration through the ampulla of Vater to biliary ducts describes liver flukes such as Clonorchis."}}, {"id": 11, "stem": "A man returns from rural Central America with diarrhea, abdominal pain, weight loss, eosinophilia, and an itchy rash on his groin and buttocks that moves and appears and disappears during the day. Which organism is the most likely cause", "topic": "Strongyloides stercoralis", "options": {"A": "Fasciola hepatica", "B": "Taenia solium", "C": "Trichuris trichiura", "D": "Strongyloides stercoralis"}, "correct": "D", "explanation": "Strongyloides stercoralis is associated with larva currens, a rapidly moving itchy rash often on the buttocks/groin, plus GI symptoms and eosinophilia. The practice question in the section emphasizes this exact clue pattern.", "optionExplanations": {"A": "Fasciola hepatica is a liver fluke associated with aquatic plants/watercress and biliary/liver disease.", "B": "Taenia solium can cause intestinal tapeworm infection or cysticercosis, but larva currens is not typical.", "C": "Trichuris causes whipworm disease with diarrhea and rectal prolapse in severe cases, not larva currens.", "D": "Correct. Larva currens with GI symptoms and eosinophilia strongly suggests Strongyloides."}}, {"id": 12, "stem": "A helminth infection can persist by an autoinfection cycle in which filariform larvae penetrate the intestinal mucosa or perianal skin, migrate to the lungs, ascend the bronchial tree, are swallowed, and return to the small intestine. Why can this organism cause hyperinfection", "topic": "Strongyloides autoinfection and hyperinfection", "options": {"A": "Its life cycle can repeat within the host without leaving the body", "B": "Adult worms lay eggs only in freshwater snails", "C": "It requires cattle muscle to complete every human infection", "D": "It cannot penetrate human tissue"}, "correct": "A", "explanation": "Strongyloides can autoinfect the host. Filariform larvae can penetrate intestinal mucosa or perianal skin, migrate through the lungs, and return to the small intestine, allowing the cycle to repeat without leaving the host and potentially disseminate as hyperinfection.", "optionExplanations": {"A": "Correct. Strongyloides autoinfection allows persistent infection and hyperinfection.", "B": "Snail involvement is characteristic of trematodes such as Schistosoma and liver flukes, not Strongyloides.", "C": "Cattle muscle is involved in Taenia saginata, not Strongyloides.", "D": "Strongyloides larvae do penetrate tissue, including intestinal mucosa or perianal skin during autoinfection."}}, {"id": 13, "stem": "A child with chronic heavy whipworm infection develops diarrhea, anemia, and rectal prolapse. Which organism is most consistent with these findings", "topic": "Trichuris trichiura", "options": {"A": "Ascaris lumbricoides", "B": "Trichuris trichiura", "C": "Enterobius vermicularis", "D": "Necator americanus"}, "correct": "B", "explanation": "Trichuris trichiura is whipworm. Adult worms burrow into intestinal mucosa with their anterior ends and can cause mild diarrhea; severe infections can cause anemia and rectal prolapse.", "optionExplanations": {"A": "Ascaris is associated with lung migration and intestinal obstruction in children.", "B": "Correct. Severe Trichuris infection is associated with anemia and rectal prolapse.", "C": "Enterobius causes nocturnal perianal pruritus.", "D": "Necator americanus is hookworm and classically causes iron-deficiency anemia after barefoot exposure."}}, {"id": 14, "stem": "A patient ingests eggs that hatch in the small intestine, releasing larvae that develop for about one week and then migrate to the ileocecal area, where they mature over about three months. Adult worms burrow their anterior ends into the intestinal mucosa. Which parasite is described", "topic": "Trichuris life cycle", "options": {"A": "Schistosoma haematobium", "B": "Clonorchis sinensis", "C": "Taenia saginata", "D": "Trichuris trichiura"}, "correct": "D", "explanation": "Trichuris eggs are ingested, hatch in the small intestine, and larvae migrate to the ileocecal area to mature. Adult worms burrow into intestinal mucosa with their anterior ends.", "optionExplanations": {"A": "Schistosoma haematobium penetrates skin as cercariae and lives in the bladder venous plexus.", "B": "Clonorchis sinensis is acquired from raw/undercooked fish and migrates to biliary ducts.", "C": "Taenia saginata is acquired from undercooked beef containing cysticerci.", "D": "Correct. This ileocecal whipworm life cycle describes Trichuris trichiura."}}, {"id": 15, "stem": "A professor describes tapeworm anatomy: an attachment head, egg-filled segments, and larval tissue cysts. Which set of terms matches these structures", "topic": "Cestode anatomy", "options": {"A": "Cercariae, miracidia, and rediae", "B": "Alarmins, DAMPs, and PAMPs", "C": "Scolex, proglottids, and cysticerci", "D": "Rhabditiform larvae, filariform larvae, and ova"}, "correct": "C", "explanation": "For cestodes, the scolex is the attachment head, proglottids are egg-filled segments, and cysticerci are larval tissue cysts.", "optionExplanations": {"A": "Cercariae, miracidia, and rediae are trematode developmental stages.", "B": "Alarmins, DAMPs, and PAMPs describe immune recognition signals, not tapeworm anatomy.", "C": "Correct. Scolex, proglottids, and cysticerci are the cestode terms listed.", "D": "Rhabditiform and filariform larvae are terms used for Strongyloides/hookworm larval forms, not tapeworm anatomy."}}, {"id": 16, "stem": "A man eats undercooked beef containing cysticerci. In his intestine, the cysticerci develop into adult tapeworms that attach to the small intestine by a scolex and produce gravid proglottids. Which disease form does this represent", "topic": "Taeniasis", "options": {"A": "Hydatid liver disease", "B": "Taeniasis", "C": "Schistosomiasis", "D": "Larva currens"}, "correct": "B", "explanation": "Eating raw or undercooked meat containing cysticerci from Taenia saginata or Taenia solium causes intestinal tapeworm infection, or taeniasis. The adult worm attaches to the small intestine via its scolex.", "optionExplanations": {"A": "Hydatid disease occurs when humans ingest Echinococcus eggs and become aberrant intermediate hosts.", "B": "Correct. Undercooked beef or pork cysticerci leading to adult intestinal tapeworms is taeniasis.", "C": "Schistosomiasis involves skin penetration by cercariae from freshwater.", "D": "Larva currens is the moving rash associated with Strongyloides."}}, {"id": 17, "stem": "A patient develops seizures and focal neurologic deficits. Brain imaging shows calcified cystic lesions. The infection occurred after ingestion of eggs, not cysts, from a pork tapeworm. Which diagnosis best fits", "topic": "Neurocysticercosis", "options": {"A": "Intestinal Taenia saginata infection", "B": "Clonorchiasis", "C": "Enterobiasis", "D": "Neurocysticercosis from Taenia solium"}, "correct": "D", "explanation": "Humans who ingest Taenia solium eggs can develop cysticercosis. Neurocysticercosis is associated with seizures, focal deficits, and calcified cysts.", "optionExplanations": {"A": "Intestinal Taenia saginata follows ingestion of undercooked beef cysticerci, not egg ingestion with brain cysts.", "B": "Clonorchiasis causes biliary tract disease after raw fish exposure.", "C": "Enterobiasis causes nocturnal perianal itching.", "D": "Correct. Seizures with calcified cysts after Taenia solium egg ingestion indicates neurocysticercosis."}}, {"id": 18, "stem": "A shepherd develops slowly enlarging cystic lesions in the liver and lungs. The cysts contain protoscolices and daughter cysts. The notes warn that rupture can seed secondary cysts in other tissues. Which organism is most likely", "topic": "Echinococcus hydatid disease", "options": {"A": "Echinococcus", "B": "Enterobius vermicularis", "C": "Trichuris trichiura", "D": "Ancylostoma duodenale"}, "correct": "A", "explanation": "Echinococcus can cause hydatid cyst disease when humans ingest eggs and become aberrant intermediate hosts. Oncospheres lodge primarily in liver and lungs and develop into thick-walled hydatid cysts with protoscolices and daughter cysts. Rupture can lead to secondary echinococcosis.", "optionExplanations": {"A": "Correct. Hydatid cysts with daughter cysts and secondary cyst risk are characteristic of Echinococcus.", "B": "Enterobius causes perianal itching rather than hydatid cysts.", "C": "Trichuris causes whipworm disease involving the ileocecal region and can cause rectal prolapse.", "D": "Ancylostoma duodenale is hookworm and causes blood-loss anemia."}}, {"id": 19, "stem": "A patient who frequently eats raw freshwater fish develops fever, eosinophilia, hepatomegaly, gallstones, pancreatitis, and biliary obstruction. Adult flukes reside in biliary and pancreatic ducts after ascending through the ampulla of Vater. Which organism group is most likely", "topic": "Clonorchis and biliary flukes", "options": {"A": "Hookworms", "B": "Enterobius species", "C": "Clonorchis or Opisthorchis species", "D": "Taenia saginata"}, "correct": "C", "explanation": "Clonorchis sinensis and Opisthorchis species are biliary flukes acquired from raw or undercooked fish. They excyst in the duodenum, ascend through the ampulla of Vater, and reside in biliary or pancreatic ducts, causing obstruction, pancreatitis, gallstones, and cholangiocarcinoma risk.", "optionExplanations": {"A": "Hookworms are acquired by skin penetration from soil and cause iron-deficiency anemia.", "B": "Enterobius causes nocturnal perianal itching.", "C": "Correct. Raw fish plus biliary disease points to Clonorchis/Opisthorchis.", "D": "Taenia saginata is acquired by undercooked beef and causes intestinal tapeworm infection."}}, {"id": 20, "stem": "A patient becomes infected after eating metacercariae encysted on aquatic plants. Parasites excyst in the duodenum, move to the small intestine, attach, and mature into adults. Which exposure best matches the organism emphasized with this route", "topic": "Fasciolopsis buski", "options": {"A": "Barefoot exposure to warm damp soil", "B": "Eating contaminated aquatic plants", "C": "Eating undercooked beef", "D": "Freshwater cercariae penetrating skin"}, "correct": "B", "explanation": "Fasciolopsis buski infection occurs when humans or pigs ingest metacercariae on aquatic plants. The parasites excyst in the duodenum and develop into adult worms in the small intestine.", "optionExplanations": {"A": "Barefoot soil exposure suggests hookworm.", "B": "Correct. Aquatic plants carrying metacercariae match Fasciolopsis buski in the notes.", "C": "Undercooked beef suggests Taenia saginata.", "D": "Freshwater cercariae penetrating skin suggests Schistosoma."}}, {"id": 21, "stem": "A parasite is described as a digenetic fluke with two suckers, often hermaphroditic, requiring a snail intermediate host. Which helminth class is being described", "topic": "Trematode classification", "options": {"A": "Trematodes", "B": "Nematodes", "C": "Cestodes", "D": "Arthropods"}, "correct": "A", "explanation": "Trematodes are flukes. The section describes them as digenetic, with a snail intermediate host, two suckers, and often hermaphroditic biology.", "optionExplanations": {"A": "Correct. These are trematode features.", "B": "Nematodes are roundworms such as Ascaris, hookworms, Enterobius, Strongyloides, and Trichuris.", "C": "Cestodes are tapeworms, with scolex, proglottids, and cysticerci.", "D": "Arthropods include ticks and lice and are not the fluke class described."}}, {"id": 22, "stem": "A swimmer develops itchy skin after freshwater exposure in an endemic region. The infective stage penetrates human skin, enters circulation, matures in portal vasculature, and paired adults migrate to target venous sites. Which parasite group is described", "topic": "Schistosoma transmission", "options": {"A": "Taenia", "B": "Enterobius", "C": "Ascaris", "D": "Schistosoma"}, "correct": "D", "explanation": "Schistosoma cercariae are released from snails into water and penetrate human skin. Larvae enter circulation, mature in portal vasculature, and paired adult worms migrate to venous plexuses. Skin penetration can cause swimmer\u2019s itch.", "optionExplanations": {"A": "Taenia is acquired by ingestion of cysticerci in undercooked meat or eggs for cysticercosis, not skin-penetrating cercariae.", "B": "Enterobius spreads fecal-orally and causes nocturnal perianal pruritus.", "C": "Ascaris is acquired by ingestion of embryonated eggs and migrates through lungs.", "D": "Correct. Freshwater skin penetration by cercariae describes Schistosoma."}}, {"id": 23, "stem": "A patient has schistosomiasis due to adult worms in the mesenteric veins. The eggs are detected in stool. Which Schistosoma species pair is listed with this pattern", "topic": "Schistosoma species localization", "options": {"A": "Schistosoma haematobium only", "B": "Clonorchis sinensis and Fasciola hepatica", "C": "Schistosoma mansoni and Schistosoma japonicum", "D": "Enterobius vermicularis and Trichuris trichiura"}, "correct": "C", "explanation": "The notes state that Schistosoma mansoni and Schistosoma japonicum migrate to mesenteric veins and produce stool eggs.", "optionExplanations": {"A": "Schistosoma haematobium localizes to the bladder plexus and produces urine eggs with terminal hematuria.", "B": "Clonorchis and Fasciola are flukes but not the Schistosoma mesenteric vein stool-egg pair.", "C": "Correct. S. mansoni and S. japonicum are associated with mesenteric veins and stool eggs.", "D": "Enterobius and Trichuris are intestinal nematodes, not Schistosoma species."}}, {"id": 24, "stem": "A patient has terminal hematuria after freshwater exposure. Eggs are passed in urine after adult worms localize to the bladder venous plexus and eggs punch through the bladder wall. Which organism is most likely", "topic": "Schistosoma haematobium", "options": {"A": "Schistosoma mansoni", "B": "Schistosoma haematobium", "C": "Clonorchis sinensis", "D": "Strongyloides stercoralis"}, "correct": "B", "explanation": "Schistosoma haematobium localizes to the bladder plexus and produces urine eggs. Eggs punching through the bladder wall cause terminal hematuria.", "optionExplanations": {"A": "S. mansoni is associated with mesenteric veins and stool eggs, not terminal hematuria.", "B": "Correct. Bladder plexus, urine eggs, and terminal hematuria indicate S. haematobium.", "C": "Clonorchis causes biliary tract disease after raw fish exposure.", "D": "Strongyloides causes larva currens and autoinfection/hyperinfection."}}, {"id": 25, "stem": "A physician sees a traveler with abdominal symptoms, eosinophilia, and a history of environmental exposure. Which exam strategy takeaway from the notes is most useful", "topic": "Exam strategy for helminths", "options": {"A": "Exposure history plus eosinophilia should raise suspicion for helminth infection", "B": "Eosinophilia excludes parasites", "C": "All helminths are diagnosed by blood culture", "D": "Exposure history is irrelevant because all helminths have identical transmission"}, "correct": "A", "explanation": "The exam strategy section emphasizes that exposure history plus eosinophilia is a major clue for helminth infection. It also stresses distinguishing egg ingestion from skin penetration and recognizing pathognomonic rashes/symptoms.", "optionExplanations": {"A": "Correct. Exposure history plus eosinophilia is a high-yield helminth clue.", "B": "Eosinophilia supports, not excludes, many helminth infections.", "C": "The notes do not state that all helminths are diagnosed by blood culture.", "D": "Transmission differs substantially: egg ingestion, cyst ingestion, skin penetration, raw fish, aquatic plants, and others."}}, {"id": 26, "stem": "A student is trying to distinguish helminths acquired by skin penetration from those acquired by ingestion. Which pairing is correct based on the notes", "topic": "Transmission comparison", "options": {"A": "Enterobius and Taenia saginata penetrate skin", "B": "Clonorchis and Echinococcus penetrate skin", "C": "Hookworms and Schistosoma penetrate skin", "D": "Ascaris and Trichuris penetrate skin"}, "correct": "C", "explanation": "Hookworms penetrate skin as filariform larvae during barefoot exposure, and Schistosoma penetrates skin as cercariae in freshwater. Ascaris, Trichuris, Enterobius, Taenia, Echinococcus, and Clonorchis are primarily acquired by ingestion routes in the notes.", "optionExplanations": {"A": "Enterobius is fecal-oral, and Taenia saginata is acquired by undercooked beef cysticerci.", "B": "Clonorchis is acquired by raw/undercooked fish, and Echinococcus by egg ingestion.", "C": "Correct. Hookworms and Schistosoma are the skin-penetration pair emphasized.", "D": "Ascaris and Trichuris are acquired by ingestion of eggs, not skin penetration."}}, {"id": 27, "stem": "A patient with chronic fluke infection develops portal hypertension, cirrhosis, liver failure, swimmer\u2019s itch, and jaundice after repeated freshwater exposures. Which organism group is most directly associated with this pattern in the notes", "topic": "Schistosoma complications", "options": {"A": "Enterobius", "B": "Hookworm", "C": "Taenia saginata", "D": "Schistosoma"}, "correct": "D", "explanation": "The Schistosoma section lists skin penetration and complications including portal hypertension, cirrhosis, liver failure, swimmer\u2019s itch, and jaundice.", "optionExplanations": {"A": "Enterobius causes nocturnal perianal itching.", "B": "Hookworm causes blood-loss iron-deficiency anemia after barefoot soil exposure.", "C": "Taenia saginata causes intestinal taeniasis from undercooked beef.", "D": "Correct. Schistosoma infection is linked to freshwater skin penetration and portal/liver complications."}}, {"id": 28, "stem": "A liver fluke excysts in the duodenum, ascends through the ampulla of Vater, attaches to duct mucosa, and matures in the biliary and pancreatic ducts. What complication is specifically listed for this infection", "topic": "Biliary fluke complications", "options": {"A": "Cholangiocarcinoma", "B": "Nocturnal perianal pruritus", "C": "Rectal prolapse", "D": "Neurocysticercosis"}, "correct": "A", "explanation": "Clonorchis/Opisthorchis biliary flukes can cause duct obstruction with fever, eosinophilia, hepatomegaly, pancreatitis, gallstones, and cholangiocarcinoma.", "optionExplanations": {"A": "Correct. Cholangiocarcinoma is listed as a complication of biliary fluke infection.", "B": "Nocturnal perianal pruritus is Enterobius.", "C": "Rectal prolapse is associated with severe Trichuris infection.", "D": "Neurocysticercosis is from Taenia solium egg ingestion."}}, {"id": 29, "stem": "A researcher describes a host that harbors only developmental stages of a parasite, not sexually mature adults. Which term best describes this host", "topic": "Parasite terminology", "options": {"A": "Definitive host", "B": "Intermediate host", "C": "Ectoparasite", "D": "Endoparasite"}, "correct": "B", "explanation": "An intermediate host harbors developmental stages only. A definitive host harbors the sexually mature parasite.", "optionExplanations": {"A": "A definitive host harbors sexually mature parasites.", "B": "Correct. Intermediate hosts harbor developmental stages only.", "C": "An ectoparasite lives on the host, such as lice.", "D": "An endoparasite lives inside the host, such as pinworm."}}, {"id": 30, "stem": "A parasite infection is described as a zoonosis. Which description best matches the definition used in the notes", "topic": "Zoonosis", "options": {"A": "A parasite living on the host surface only", "B": "A parasite that cannot infect humans", "C": "A sexually mature parasite in the definitive host", "D": "An infection with an animal reservoir that can infect humans, such as bovine or swine tapeworms"}, "correct": "D", "explanation": "Zoonosis means an animal reservoir can lead to human infection. The notes give bovine and swine tapeworms as examples.", "optionExplanations": {"A": "A parasite living on the host surface is an ectoparasite, not the definition of zoonosis.", "B": "Zoonoses do infect humans through an animal reservoir.", "C": "This describes a definitive host concept, not zoonosis.", "D": "Correct. Zoonosis involves an animal reservoir causing human infection, such as bovine or swine tapeworms."}}];
let currentIndex = 0;
const answers = {};
const segmentsEl = document.getElementById('segments');
const progressEl = document.getElementById('progress');
const wrongCountEl = document.getElementById('wrongCount');
const rightCountEl = document.getElementById('rightCount');
const qNumEl = document.getElementById('qNum');
const topicEl = document.getElementById('topic');
const stemEl = document.getElementById('stem');
const optionsEl = document.getElementById('options');
const explanationEl = document.getElementById('explanation');
function renderSegments() {
  segmentsEl.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('button');
    b.className = 'seg' + (idx === currentIndex ? ' active' : '') + (answers[q.id] !== undefined ? ' answered' : '');
    b.title = q.topic || `Question ${idx + 1}`;
    b.setAttribute('aria-label', `Go to question ${idx + 1}`);
    b.onclick = () => { currentIndex = idx; render(); };
    segmentsEl.appendChild(b);
  });
}
function renderCounts() {
  let right = 0, wrong = 0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (q && choice === q.correct) right++; else if (q) wrong++;
  });
  rightCountEl.textContent = right;
  wrongCountEl.textContent = wrong;
}
function renderQuestion() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  const showExplanation = selected !== null;
  progressEl.textContent = `${currentIndex + 1} / ${questions.length}`;
  qNumEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  topicEl.textContent = q.topic ? `Topic: ${q.topic}` : '';
  stemEl.textContent = q.stem + '?';
  optionsEl.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (showExplanation && letter === q.correct) btn.className += ' correct';
    else if (showExplanation && letter === selected && letter !== q.correct) btn.className += ' wrong';
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    optionsEl.appendChild(btn);
  });
  explanationEl.innerHTML = '';
  if (showExplanation) {
    const div = document.createElement('div');
    div.className = 'explanation';
    const isCorrect = selected === q.correct;
    const lines = Object.entries(q.optionExplanations || {}).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('');
    div.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p><p class="${isCorrect ? 'correctText' : 'wrongText'}">${isCorrect ? 'Nice job. ' : 'Good attempt. '}${q.explanation}</p><div><p><strong>Why each option is right or wrong:</strong></p>${lines}</div>`;
    explanationEl.appendChild(div);
  }
}
function render() { renderSegments(); renderCounts(); renderQuestion(); }
document.getElementById('prev').onclick = () => { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); };
document.getElementById('next').onclick = () => { currentIndex = (currentIndex + 1) % questions.length; render(); };
render();
</script>
