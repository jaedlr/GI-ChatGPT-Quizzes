let currentIndex = 0;
let answers = {};
const segmentsEl = document.getElementById('segments');
const progressText = document.getElementById('progressText');
const wrongCount = document.getElementById('wrongCount');
const rightCount = document.getElementById('rightCount');
const qNum = document.getElementById('qNum');
const topic = document.getElementById('topic');
const stem = document.getElementById('stem');
const options = document.getElementById('options');
const explanation = document.getElementById('explanation');
function renderSegments() {
  segmentsEl.innerHTML = '';
  questions.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'seg' + (idx === currentIndex ? ' active' : '') + (answers[q.id] !== undefined && idx !== currentIndex ? ' answered' : '');
    btn.title = q.topic || `Question ${idx + 1}`;
    btn.setAttribute('aria-label', `Go to question ${idx + 1}`);
    btn.onclick = () => { currentIndex = idx; render(); };
    segmentsEl.appendChild(btn);
  });
}
function renderCounts() {
  let right = 0, wrong = 0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (q && choice === q.correct) right++; else if (q) wrong++;
  });
  rightCount.textContent = right;
  wrongCount.textContent = wrong;
}
function render() {
  const q = questions[currentIndex];
  const selected = answers[q.id];
  progressText.textContent = `${currentIndex + 1} / ${questions.length}`;
  qNum.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  topic.textContent = q.topic ? `Topic: ${q.topic}` : '';
  stem.textContent = q.stem + '?';
  options.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (selected !== undefined) {
      if (letter === q.correct) btn.classList.add('correct');
      else if (letter === selected) btn.classList.add('wrong');
    }
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    options.appendChild(btn);
  });
  if (selected !== undefined) {
    const correctText = q.options[q.correct];
    const verdict = selected === q.correct ? 'Nice job. ' : 'Good attempt. ';
    const verdictClass = selected === q.correct ? 'color:#15803d;' : 'color:#b91c1c;';
    const why = Object.entries(q.optionExplanations).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('');
    explanation.style.display = 'block';
    explanation.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${correctText})</p><p style="${verdictClass}">${verdict}${q.explanation}</p><div class="why"><p><strong>Why each option is right or wrong:</strong></p>${why}</div>`;
  } else {
    explanation.style.display = 'none';
    explanation.innerHTML = '';
  }
  renderSegments();
  renderCounts();
}
document.getElementById('prevBtn').onclick = () => { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); };
document.getElementById('nextBtn').onclick = () => { currentIndex = (currentIndex + 1) % questions.length; render(); };
render();
</script>
