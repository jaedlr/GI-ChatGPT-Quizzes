    let currentIndex = 0;
    const answers = {};

    function renderProgress() {
      const progress = document.getElementById('progress');
      progress.innerHTML = '';
      questions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'segment' + (idx === currentIndex ? ' active' : '') + (answers[q.id] !== undefined && idx !== currentIndex ? ' answered' : '');
        btn.title = q.topic || `Question ${idx + 1}`;
        btn.setAttribute('aria-label', `Go to question ${idx + 1}`);
        btn.onclick = () => {
          currentIndex = idx;
          render();
        };
        progress.appendChild(btn);
      });
    }

    function renderCounts() {
      let right = 0;
      let wrong = 0;
      Object.entries(answers).forEach(([qid, choice]) => {
        const q = questions.find(item => item.id === Number(qid));
        if (q && choice === q.correct) right++;
        if (q && choice !== q.correct) wrong++;
      });
      document.getElementById('rightCount').textContent = right;
      document.getElementById('wrongCount').textContent = wrong;
    }

    function selectAnswer(letter) {
      const q = questions[currentIndex];
      answers[q.id] = letter;
      render();
    }

    function render() {
      const q = questions[currentIndex];
      const selected = answers[q.id] || null;
      const showExplanation = selected !== null;
      document.getElementById('counter').textContent = `${currentIndex + 1} / ${questions.length}`;
      document.getElementById('questionNumber').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById('topic').textContent = q.topic ? `Topic: ${q.topic}` : '';
      document.getElementById('stem').textContent = q.stem + '?';

      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      Object.entries(q.options).forEach(([letter, text]) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        if (showExplanation && letter === q.correct) btn.className += ' correct';
        else if (showExplanation && selected === letter && letter !== q.correct) btn.className += ' incorrect';
        btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
        btn.onclick = () => selectAnswer(letter);
        optionsDiv.appendChild(btn);
      });

      const explanationDiv = document.getElementById('explanation');
      if (showExplanation) {
        const isCorrect = selected === q.correct;
        explanationDiv.style.display = 'block';
        const optionExps = Object.entries(q.optionExplanations).map(([letter, text]) =>
          `<p><strong>${letter}.</strong> ${text}</p>`
        ).join('');
        explanationDiv.innerHTML = `
          <p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p>
          <p class="${isCorrect ? 'correct-text' : 'incorrect-text'}">${isCorrect ? 'Nice job. ' : 'Good attempt. '}${q.explanation}</p>
          <div class="option-exp">
            <p><strong>Why each option is right or wrong:</strong></p>
            ${optionExps}
          </div>
        `;
      } else {
        explanationDiv.style.display = 'none';
        explanationDiv.innerHTML = '';
      }

      renderProgress();
      renderCounts();
    }

    function goNext() {
      currentIndex = (currentIndex + 1) % questions.length;
      render();
    }

    function goPrev() {
      currentIndex = (currentIndex - 1 + questions.length) % questions.length;
      render();
    }

    render();
  </script>
