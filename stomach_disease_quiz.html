<script>
const questions = [{"id": 1, "stem": "A physiology instructor asks which stomach compartment primarily acts as a reservoir that can relax to accommodate recently ingested food with minimal pressure increase. Which answer is most accurate", "topic": "Gastroduodenal anatomy and physiology", "options": {"A": "Fundus and proximal one third of the body", "B": "Distal antrum", "C": "Pyloric sphincter", "D": "Lesser curvature of the antrum"}, "correct": "A", "explanation": "The proximal stomach, including the fundus and proximal one third of the body, serves as a reservoir and performs gastric accommodation by relaxing when food or fluid enters.", "optionExplanations": {"A": "Correct. The proximal stomach stores recently ingested food and relaxes with little pressure increase.", "B": "The distal stomach grinds, mixes, and sieves food particles rather than serving primarily as the reservoir.", "C": "The pyloric sphincter regulates passage into the small intestine.", "D": "The lesser curvature is an anatomic region, not the main reservoir function described."}}, {"id": 2, "stem": "A patient develops gastric mucosal injury after severe hypotension because one protective mechanism can no longer maintain normal mucosal pH and integrity. Which protective line is most directly impaired", "topic": "Protective mucosal barrier", "options": {"A": "Mucus and bicarbonate secretion", "B": "Adequate mucosal blood flow", "C": "Pepsinogen secretion by chief cells", "D": "Cell migration and epithelial proliferation"}, "correct": "B", "explanation": "The third line of gastric mucosal defense is adequate blood flow, which helps maintain normal pH and mucosal integrity. Shock or hypotension compromises this defense.", "optionExplanations": {"A": "Mucus and bicarbonate are first-line defenses against H+ back-diffusion and mechanical damage.", "B": "Correct. Hypotension and shock reduce mucosal blood flow, weakening the third line of defense.", "C": "Pepsinogen is a digestive enzyme precursor, not a protective defense layer.", "D": "Cell migration and proliferation are second-line defenses for epithelial renewal."}}, {"id": 3, "stem": "A 44 year old patient reports recurrent upper abdominal discomfort with fullness, bloating, belching, burning, nausea, and occasional retching. No single disease has been diagnosed. What is the best term for this symptom complex", "topic": "Dyspepsia", "options": {"A": "Gastric outlet obstruction", "B": "Peptic ulcer disease", "C": "Dyspepsia", "D": "Dumping syndrome"}, "correct": "C", "explanation": "Dyspepsia is a symptom, not a disease, characterized by acute, chronic, or recurrent upper abdominal pain or discomfort with symptoms such as fullness, burning, bloating, belching, nausea, retching, or vomiting.", "optionExplanations": {"A": "Gastric outlet obstruction causes obstructive symptoms and is not the general term for this symptom cluster.", "B": "PUD requires a mucosal break greater than 5 mm extending through the muscularis mucosa.", "C": "Correct. This is the broad symptom complex of indigestion/dyspepsia.", "D": "Dumping syndrome occurs after gastric surgery with rapid gastric emptying symptoms."}}, {"id": 4, "stem": "A 50 year old patient has gastric lining inflammation and mild epigastric pain, but endoscopy shows no ulcer crater. Which definition best fits gastritis in this section", "topic": "Gastritis definition", "options": {"A": "Full-thickness gastric rupture", "B": "Break greater than 5 mm extending through the muscularis mucosa", "C": "Inflammation, erosion, or damage to the gastric lining that has not yet developed into an ulcer", "D": "Rapid delivery of hyperosmotic food into the small intestine"}, "correct": "C", "explanation": "Gastritis is nonspecific inflammation, erosion, or damage to the gastric lining that has not yet developed into an ulcer.", "optionExplanations": {"A": "Full-thickness rupture is not gastritis.", "B": "This describes peptic ulcer disease rather than gastritis.", "C": "Correct. Gastritis is gastric lining inflammation or damage before ulcer formation.", "D": "This describes dumping syndrome."}}, {"id": 5, "stem": "A patient with autoimmune gastritis has gastric mucosal atrophy, vitamin B12 deficiency, decreased acid production, and achlorhydria. Which gastritis type best matches this presentation", "topic": "Type A gastritis", "options": {"A": "Type A atrophic gastritis", "B": "Erosive hemorrhagic gastritis", "C": "Portal hypertensive gastropathy", "D": "Type B assault gastritis"}, "correct": "A", "explanation": "Type A gastritis is atrophic and associated with autoimmune processes such as vitamin B12 deficiency, diminished acid production, and achlorhydria.", "optionExplanations": {"A": "Correct. Autoimmune atrophy with B12 deficiency and achlorhydria fits Type A gastritis.", "B": "Erosive hemorrhagic gastritis is commonly caused by NSAIDs, alcohol, severe illness, stress, or portal hypertension.", "C": "Portal hypertensive gastropathy is due to portal hypertension causing gastric mucosal and submucosal vascular congestion.", "D": "Type B gastritis is linked to external assaults such as alcohol, NSAIDs, H. pylori, burns, head trauma, or mechanical ventilation."}}, {"id": 6, "stem": "A hospitalized patient develops superficial gastric hemorrhages, petechiae, and focal erosions on endoscopy. The clinician notes recent NSAID use and heavy alcohol exposure. Which category best describes this finding", "topic": "Erosive and hemorrhagic gastritis", "options": {"A": "Erosive and hemorrhagic gastritis", "B": "Nonerosive nonspecific gastritis", "C": "Gastric volvulus", "D": "Late dumping syndrome"}, "correct": "A", "explanation": "Erosive and hemorrhagic gastritis is caused by drugs such as NSAIDs, alcohol, severe illness stress, and portal hypertension. Endoscopy shows superficial hemorrhages, petechiae, and focal or diffuse erosions.", "optionExplanations": {"A": "Correct. NSAIDs/alcohol plus superficial hemorrhage, petechiae, and erosions are classic.", "B": "Nonerosive gastritis may have normal endoscopy despite histologic inflammation.", "C": "Gastric volvulus is twisting of the stomach and can cause obstruction or ischemia.", "D": "Late dumping syndrome presents about 2 hours after meals with hypoglycemic symptoms."}}, {"id": 7, "stem": "A patient taking high-dose NSAIDs develops dyspepsia and gastric erosions. Which mechanism best explains the indirect mucosal injury from NSAIDs", "topic": "NSAID-induced gastritis", "options": {"A": "Increased bicarbonate secretion and increased epithelial proliferation", "B": "Reduced prostaglandins causing decreased mucus, bicarbonate, blood flow, and epithelial proliferation", "C": "Direct stimulation of gastric accommodation", "D": "Increased intrinsic factor production leading to mucosal atrophy"}, "correct": "B", "explanation": "NSAIDs cause gastric injury through direct toxicity and indirect effects from decreased prostaglandins. Prostaglandin inhibition reduces mucus, bicarbonate, blood flow, and epithelial proliferation, lowering mucosal resistance to injury.", "optionExplanations": {"A": "NSAIDs do the opposite; they reduce protective mechanisms.", "B": "Correct. NSAID-induced prostaglandin reduction weakens multiple mucosal defenses.", "C": "Gastric accommodation is a proximal stomach reservoir function, not the injury mechanism.", "D": "Intrinsic factor production is related to parietal cells and B12 absorption, not NSAID injury."}}, {"id": 8, "stem": "A patient with mild NSAID-related dyspepsia asks for initial management. There are no alarm symptoms. Which approach is most consistent with the section", "topic": "NSAID gastritis management", "options": {"A": "Treat with antibiotics alone without assessing H. pylori", "B": "Immediate gastric resection", "C": "Avoid all endoscopy forever", "D": "Reduce dose or take the NSAID with meals"}, "correct": "D", "explanation": "For mild NSAID-induced symptoms, reducing the dose or taking NSAIDs with meals is recommended. Severe symptoms require stopping NSAIDs, and PPIs or H2 blockers may be used if NSAIDs must continue. H. pylori testing is also recommended.", "optionExplanations": {"A": "The section specifically notes testing for H. pylori in this setting.", "B": "Gastric resection is not initial therapy for mild NSAID dyspepsia.", "C": "Alarm symptoms require endoscopy; endoscopy is not categorically avoided.", "D": "Correct. This is the listed approach for mild symptoms."}}, {"id": 9, "stem": "A critically ill ventilated patient develops stress-related gastric mucosal damage after shock and catecholamine-driven hypoperfusion. Which pathophysiologic sequence best explains the injury", "topic": "Stress-related gastric damage", "options": {"A": "Hyperglycemia causes delayed gastric emptying and retained food", "B": "IgA deposition causes villous blunting", "C": "Portal hypertension causes venous congestion in gastric mucosa", "D": "Reduced blood flow causes mucosal ischemia, impaired defenses, erosion, ulceration, and bleeding"}, "correct": "D", "explanation": "Stress-related gastric damage occurs in critically ill patients due to reduced blood flow and mucosal ischemia. Shock, hypotension, and catecholamines decrease perfusion, impair defenses, and can lead to erosion, ulceration, and bleeding.", "optionExplanations": {"A": "This describes gastroparesis, especially in diabetes, not stress-related mucosal injury.", "B": "IgA-related villous blunting is not part of this stomach disease section's stress gastritis mechanism.", "C": "Portal hypertensive gastropathy involves vascular congestion from portal hypertension.", "D": "Correct. Mucosal ischemia from low-flow states is the key mechanism."}}, {"id": 10, "stem": "A resident is choosing stress ulcer prophylaxis for a critically ill patient. Which pair represents the two biggest risk factors highlighted for prophylaxis", "topic": "Stress ulcer prophylaxis risk factors", "options": {"A": "Lactose intolerance and celiac disease", "B": "Pregnancy and obesity", "C": "Coagulopathy and respiratory failure on a ventilator for more than 48 hours", "D": "Benign dyspepsia and episodic belching"}, "correct": "C", "explanation": "The section lists coagulopathy and respiratory failure requiring ventilation for more than 48 hours as the two biggest risk factors for stress-related gastric damage prophylaxis.", "optionExplanations": {"A": "These are not the key ICU stress ulcer prophylaxis risk factors.", "B": "Pregnancy and obesity are not the listed major ICU prophylaxis triggers.", "C": "Correct. Coagulopathy and prolonged mechanical ventilation are the high-yield risk factors.", "D": "Benign dyspepsia and belching alone do not indicate ICU stress ulcer prophylaxis."}}, {"id": 11, "stem": "A man with extensive alcohol consumption develops dyspepsia and a small amount of hematemesis. Which treatment group is listed for alcoholic gastritis", "topic": "Alcoholic gastritis", "options": {"A": "Insulin and metoclopramide", "B": "Octreotide only", "C": "H2 receptor antagonists, PPIs, or sucralfate", "D": "Immediate total gastrectomy"}, "correct": "C", "explanation": "Alcoholic gastritis is associated with extensive alcohol consumption, dyspepsia, and minor hematemesis. The section lists H2 receptor antagonists, PPIs, or sucralfate as treatment.", "optionExplanations": {"A": "Insulin and metoclopramide are more relevant to diabetic gastroparesis management.", "B": "Octreotide is reserved for failed dietary measures in dumping syndrome in this section.", "C": "Correct. H2 blockers, PPIs, and sucralfate are listed treatments.", "D": "Total gastrectomy is not the treatment for uncomplicated alcoholic gastritis."}}, {"id": 12, "stem": "A cirrhotic patient with portal hypertension has gastric mucosal and submucosal congestion of capillaries and venules. Chronic GI bleeding is present. Which therapy is specifically highlighted to reduce recurrent bleeding", "topic": "Portal hypertensive gastropathy", "options": {"A": "Amoxicillin monotherapy", "B": "Lactase supplementation", "C": "Metoclopramide", "D": "Propranolol or nadolol"}, "correct": "D", "explanation": "Portal hypertensive gastropathy is caused by portal hypertension leading to gastric mucosal and submucosal vascular congestion. Nonselective beta blockers such as propranolol or nadolol reduce portal pressure and recurrent acute bleeding.", "optionExplanations": {"A": "Amoxicillin alone is not portal pressure therapy and is not adequate H. pylori therapy.", "B": "Lactase treats lactose intolerance, not portal hypertensive gastropathy.", "C": "Metoclopramide is used for moderate gastroparesis.", "D": "Correct. Nonselective beta blockers are the highlighted treatment."}}, {"id": 13, "stem": "A gastric biopsy shows curved flagellated gram-negative rods associated with chronic gastritis. The organism is usually lifelong without antibiotics and is transmitted fecal-orally. Which organism is most likely", "topic": "Helicobacter pylori characteristics", "options": {"A": "Clostridioides difficile", "B": "Staphylococcus aureus", "C": "Helicobacter pylori", "D": "Listeria monocytogenes"}, "correct": "C", "explanation": "H. pylori is described as curved, flagellated, gram-negative rods transmitted by the fecal-oral route. It causes gastritis and peptic ulcer disease and requires antibiotic eradication.", "optionExplanations": {"A": "C. difficile causes antibiotic-associated diarrhea and pseudomembranous colitis, not chronic gastric colonization.", "B": "S. aureus is a gram-positive coccus and a cause of food intoxication, not this chronic gastritis organism.", "C": "Correct. Curved flagellated gram-negative rods with chronic gastritis point to H. pylori.", "D": "Listeria is a gram-positive rod associated with unpasteurized dairy and invasive disease in high-risk groups."}}, {"id": 14, "stem": "A patient has H. pylori infection with corpus-predominant atrophic gastritis and intestinal metaplasia. Which downstream malignancy risk is most emphasized", "topic": "H. pylori cancer risk", "options": {"A": "Intestinal-type gastric adenocarcinoma", "B": "Pancreatic neuroendocrine tumor only", "C": "Esophageal squamous cell carcinoma only", "D": "Hepatocellular carcinoma"}, "correct": "A", "explanation": "The section emphasizes that H. pylori with atrophic gastritis or corpus-predominant gastritis and intestinal metaplasia increases risk for intestinal-type gastric cancer.", "optionExplanations": {"A": "Correct. Atrophic/corpus-predominant gastritis with intestinal metaplasia increases intestinal-type gastric cancer risk.", "B": "Gastrinomas are neuroendocrine tumors in ZES but are not the H. pylori-associated cancer risk here.", "C": "This section links H. pylori patterns to gastric adenocarcinoma, not specifically esophageal SCC.", "D": "Hepatocellular carcinoma is not the emphasized H. pylori-associated malignancy."}}, {"id": 15, "stem": "A patient on proton pump inhibitors requires testing for H. pylori. Which approach is described as most expensive, high sensitivity, and better for patients taking PPIs", "topic": "H. pylori diagnosis", "options": {"A": "Plain abdominal radiographs", "B": "Serologic antibody test only", "C": "Endoscopy with biopsy", "D": "Fecal occult blood testing"}, "correct": "C", "explanation": "Endoscopic testing with biopsy is described as the most expensive and highly sensitive approach, and it is better for patients taking PPIs.", "optionExplanations": {"A": "Plain films do not diagnose H. pylori infection.", "B": "Serology is less accurate and does not confirm active eradication well.", "C": "Correct. Endoscopy with biopsy is high sensitivity and useful in patients taking PPIs.", "D": "FOBT may detect bleeding but does not diagnose H. pylori."}}, {"id": 16, "stem": "A patient with H. pylori is started on a first-line regimen listed as PPI, clarithromycin, amoxicillin, and metronidazole. Which regimen name best fits this", "topic": "H. pylori therapy", "options": {"A": "Quadruple therapy", "B": "Dual acid suppression", "C": "Metoclopramide rescue therapy", "D": "Octreotide suppression therapy"}, "correct": "A", "explanation": "The section lists first-line quadruple therapy as PPI, clarithromycin, amoxicillin, and metronidazole. It also notes triple therapy with PPI, clarithromycin, and amoxicillin for selected cases.", "optionExplanations": {"A": "Correct. Four agents make this the listed quadruple therapy.", "B": "This regimen includes antibiotics, not just acid suppression.", "C": "Metoclopramide is for gastroparesis, not H. pylori eradication.", "D": "Octreotide is used for dumping syndrome after failed dietary measures."}}, {"id": 17, "stem": "A patient treated for H. pylori asks when eradication should be confirmed. According to the section, when should follow-up confirmation occur", "topic": "H. pylori follow-up", "options": {"A": "Immediately after the first dose", "B": "Only if hematemesis develops", "C": "Six months before therapy", "D": "Four weeks after therapy completion"}, "correct": "D", "explanation": "The section states that eradication should be confirmed 4 weeks after therapy completion.", "optionExplanations": {"A": "Testing immediately after the first dose does not confirm eradication.", "B": "Follow-up confirmation is recommended after therapy, not only after bleeding.", "C": "This is temporally impossible and not a treatment follow-up plan.", "D": "Correct. Confirmation is performed 4 weeks after completing therapy."}}, {"id": 18, "stem": "A 49 year old man has epigastric burning, gnawing pain that is worse on an empty stomach, improves with food or antacids, then recurs 2 to 4 hours later. Which diagnosis best matches this pain rhythm", "topic": "Peptic ulcer disease presentation", "options": {"A": "Peptic ulcer disease", "B": "Portal hypertensive gastropathy", "C": "Gastric volvulus", "D": "Early dumping syndrome"}, "correct": "A", "explanation": "PUD classically causes epigastric burning, gnawing, or hunger-like pain. Pain often occurs on an empty stomach and may be relieved by food or antacids, especially in duodenal ulcers, then recur 2 to 4 hours later.", "optionExplanations": {"A": "Correct. This is the hallmark PUD pain pattern described.", "B": "Portal hypertensive gastropathy is usually asymptomatic or causes chronic bleeding, not this classic ulcer rhythm.", "C": "Gastric volvulus causes sudden severe pain, retching with little vomitus, and inability to pass an NG tube.", "D": "Early dumping occurs about 30 minutes after meals with vasomotor symptoms."}}, {"id": 19, "stem": "A pathology exam asks for the definition of peptic ulcer disease. Which finding is required", "topic": "Peptic ulcer disease definition", "options": {"A": "Any gastric erythema without depth criteria", "B": "A break in gastric or duodenal mucosa greater than 5 mm extending through the muscularis mucosa", "C": "Only superficial petechiae without mucosal penetration", "D": "A twisted stomach causing ischemia"}, "correct": "B", "explanation": "PUD is defined as a break in the gastric or duodenal mucosa greater than 5 mm in diameter that extends through the muscularis mucosa.", "optionExplanations": {"A": "Gastric erythema alone is not PUD.", "B": "Correct. Size greater than 5 mm and extension through muscularis mucosa define PUD.", "C": "Superficial petechiae fit erosive gastritis rather than ulcer disease.", "D": "A twisted stomach describes gastric volvulus."}}, {"id": 20, "stem": "A smoker with chronic epigastric pain is diagnosed with PUD. Which pair of primary causes is emphasized in the section", "topic": "Peptic ulcer disease risk factors", "options": {"A": "Vagotomy and octreotide", "B": "Giardia and lactose", "C": "Portal hypertension and propranolol", "D": "H. pylori and NSAIDs"}, "correct": "D", "explanation": "The section identifies H. pylori and NSAIDs as the primary causes of PUD. Smoking also increases risk and delays healing.", "optionExplanations": {"A": "Vagotomy can contribute to gastroparesis and octreotide treats dumping syndrome; neither is the primary PUD cause pair.", "B": "Giardia and lactose relate to diarrheal disease or intolerance, not primary PUD causes.", "C": "Portal hypertension causes portal hypertensive gastropathy, not primary PUD.", "D": "Correct. H. pylori and NSAID use are the key primary causes."}}, {"id": 21, "stem": "A patient with PUD has constant epigastric pain radiating to the back rather than intermittent hunger-like pain. What complication should this pattern raise concern for", "topic": "PUD complication clues", "options": {"A": "Benign dyspepsia only", "B": "Penetration or perforation", "C": "Lactose intolerance", "D": "Late dumping syndrome"}, "correct": "B", "explanation": "In the section, constant or radiating pain is a warning clue that may indicate penetration or perforation in PUD.", "optionExplanations": {"A": "Constant radiating pain is not treated as benign dyspepsia only.", "B": "Correct. Constant or radiating pain is concerning for penetration or perforation.", "C": "Lactose intolerance causes gas, bloating, and diarrhea with dairy exposure.", "D": "Late dumping causes vasomotor/hypoglycemic symptoms about 2 hours after meals."}}, {"id": 22, "stem": "A patient has recurrent ulcers refractory to treatment, a giant ulcer greater than 2 cm, and ulcers distal to the duodenal bulb despite no NSAID use and negative H. pylori testing. Which disorder should be screened for", "topic": "Zollinger-Ellison syndrome screening", "options": {"A": "Alcoholic gastritis", "B": "Portal hypertensive gastropathy", "C": "Gastric volvulus", "D": "Zollinger-Ellison syndrome"}, "correct": "D", "explanation": "Zollinger-Ellison syndrome screening is indicated for ulcers refractory to treatment, giant ulcers greater than 2 cm, ulcers distal to the duodenal bulb, ulcers in H. pylori-negative/non-NSAID users, and ulcer complications.", "optionExplanations": {"A": "Alcoholic gastritis may cause dyspepsia or minor hematemesis but does not explain refractory distal ulcers.", "B": "Portal hypertensive gastropathy causes congestive mucosal bleeding, not gastrin-driven ulcer clusters.", "C": "Gastric volvulus presents with twisting/obstruction symptoms.", "D": "Correct. Refractory, giant, distal, H. pylori-negative/non-NSAID ulcers suggest ZES."}}, {"id": 23, "stem": "A suspected gastrinoma patient has fasting gastrin of 650 pg/mL. Secretin stimulation testing is performed and gastrin rises by more than 200 pg/mL. How should this be interpreted", "topic": "Zollinger-Ellison diagnosis", "options": {"A": "It rules out gastrinoma", "B": "It confirms lactose intolerance", "C": "It supports Zollinger-Ellison syndrome", "D": "It indicates portal hypertension"}, "correct": "C", "explanation": "For suspected ZES, fasting gastrin greater than 1000 pg/mL is diagnostic. If gastrin is 181 to 1000, a secretin-stimulated rise greater than 200 pg/mL is diagnostic.", "optionExplanations": {"A": "A rise greater than 200 after secretin supports the diagnosis rather than ruling it out.", "B": "Lactose intolerance is assessed clinically or with hydrogen breath testing, not secretin stimulation.", "C": "Correct. This is the diagnostic secretin stimulation response in the intermediate gastrin range.", "D": "Secretin-stimulated gastrin does not diagnose portal hypertension."}}, {"id": 24, "stem": "A patient with Zollinger-Ellison syndrome undergoes staging. Which finding is described as the most important predictor of survival", "topic": "Zollinger-Ellison prognosis", "options": {"A": "Presence of early satiety alone", "B": "Degree of belching", "C": "Hepatic metastasis", "D": "Use of antacids before meals"}, "correct": "C", "explanation": "The section states that hepatic metastasis is the most important predictor of survival in Zollinger-Ellison syndrome.", "optionExplanations": {"A": "Early satiety alone is more typical of dyspepsia or gastroparesis and is not the key ZES survival predictor.", "B": "Belching is a nonspecific dyspepsia symptom.", "C": "Correct. Liver metastasis drives prognosis.", "D": "Antacid use does not predict ZES survival."}}, {"id": 25, "stem": "A diabetic patient has early satiety, bloating, and vomiting of food 1 to 3 hours after meals. Endoscopy shows no mechanical obstruction. Which diagnosis best fits", "topic": "Gastroparesis presentation", "options": {"A": "Rapid gastric emptying", "B": "Gastroparesis", "C": "PUD with perforation", "D": "Portal hypertensive gastropathy"}, "correct": "B", "explanation": "Gastroparesis is delayed gastric emptying without a mechanical lesion. Diabetes is the most common etiology, and symptoms include early satiety, nausea, postprandial vomiting 1 to 3 hours after meals, and bloating.", "optionExplanations": {"A": "Rapid gastric emptying is dumping syndrome and usually follows gastric surgery.", "B": "Correct. Diabetes plus retained postprandial vomiting without obstruction fits gastroparesis.", "C": "PUD perforation causes severe constant pain and peritoneal findings, not delayed emptying symptoms.", "D": "Portal hypertensive gastropathy is vascular congestion from portal hypertension."}}, {"id": 26, "stem": "A patient with moderate gastroparesis needs medication after dietary measures. Which agent is listed as first-line for moderate disease", "topic": "Gastroparesis treatment", "options": {"A": "Metoclopramide", "B": "Propranolol", "C": "Amoxicillin", "D": "Octreotide"}, "correct": "A", "explanation": "For moderate gastroparesis, metoclopramide is listed as first-line. Erythromycin can stimulate motilin receptors; opioids and anticholinergics should be avoided because they slow gastric emptying.", "optionExplanations": {"A": "Correct. Metoclopramide is first-line for moderate gastroparesis.", "B": "Propranolol is used for portal hypertensive gastropathy bleeding risk, not gastroparesis.", "C": "Amoxicillin is part of H. pylori therapy, not a prokinetic.", "D": "Octreotide is used for dumping syndrome when diet fails, not first-line gastroparesis treatment."}}, {"id": 27, "stem": "A patient with diabetic gastroparesis is counseled about glucose control. Which target is listed in the section", "topic": "Gastroparesis diabetes management", "options": {"A": "Allow glucose above 400 mg/dL to speed gastric emptying", "B": "Maintain glucose below 200 mg/dL", "C": "Stop all carbohydrates permanently", "D": "Use alcohol to stimulate motility"}, "correct": "B", "explanation": "The section specifically notes diabetes management in gastroparesis: maintain glucose below 200 mg/dL, since hyperglycemia slows gastric emptying.", "optionExplanations": {"A": "Hyperglycemia slows gastric emptying and worsens gastroparesis.", "B": "Correct. Keeping glucose below 200 mg/dL is the listed goal.", "C": "Dietary modification is important, but permanent complete carbohydrate elimination is not the listed target.", "D": "Alcohol is not used to stimulate motility and can contribute to gastric injury."}}, {"id": 28, "stem": "A patient develops epigastric fullness, pain, nausea, vomiting, flushing, palpitations, and diaphoresis 30 minutes after gastric surgery meals. Which condition is most likely", "topic": "Early dumping syndrome", "options": {"A": "Late dumping syndrome", "B": "NSAID-induced gastritis", "C": "Zollinger-Ellison syndrome", "D": "Early dumping syndrome"}, "correct": "D", "explanation": "Early dumping syndrome occurs about 30 minutes after meals due to early delivery of osmotically active food to the small intestine, causing GI symptoms and vasomotor symptoms such as flushing, palpitations, and diaphoresis.", "optionExplanations": {"A": "Late dumping occurs around 2 hours after meals and is linked to hypoglycemia from rebound hyperinsulinemia.", "B": "NSAID gastritis causes erosions and dyspepsia but not classic post-surgical rapid emptying symptoms.", "C": "ZES causes acid hypersecretion with refractory ulcers, GERD, diarrhea, and steatorrhea.", "D": "Correct. The 30-minute timing plus vasomotor symptoms after gastric surgery fits early dumping."}}, {"id": 29, "stem": "A post-gastric surgery patient develops diaphoresis, tremulousness, and weakness 2 hours after eating. The mechanism is thought to be hypoglycemia from rebound hyperinsulinemia. Which diagnosis best fits", "topic": "Late dumping syndrome", "options": {"A": "Alcoholic gastritis", "B": "Late dumping syndrome", "C": "Gastric volvulus", "D": "Acute H. pylori infection"}, "correct": "B", "explanation": "Late dumping syndrome occurs about 2 hours after meals and can cause diaphoresis, tremulousness, and weakness due to hypoglycemia from rebound hyperinsulinemia.", "optionExplanations": {"A": "Alcoholic gastritis causes dyspepsia and minor hematemesis, not timed postprandial hypoglycemic symptoms.", "B": "Correct. Two-hour postprandial hypoglycemic symptoms fit late dumping.", "C": "Gastric volvulus causes sudden severe pain, retching with scant vomitus, and inability to pass an NG tube.", "D": "H. pylori infection is chronic/lifelong without antibiotics and causes gastritis/PUD, not this post-surgical dumping pattern."}}, {"id": 30, "stem": "A patient presents with sudden severe upper abdominal and chest pain, persistent retching with scant vomitus, and inability to pass a nasogastric tube. Which diagnosis is most likely", "topic": "Gastric volvulus", "options": {"A": "Benign dyspepsia", "B": "Portal hypertensive gastropathy", "C": "Nonerosive gastritis", "D": "Gastric volvulus"}, "correct": "D", "explanation": "Gastric volvulus is twisting of the stomach that may cause obstruction, ischemia, or necrosis. Sudden severe upper abdominal/chest pain, persistent retching with little vomitus, and inability to pass an NG tube are classic clues requiring emergency surgical evaluation.", "optionExplanations": {"A": "Benign dyspepsia does not cause inability to pass an NG tube or severe obstructive symptoms.", "B": "Portal hypertensive gastropathy causes mucosal vascular congestion and bleeding risk, not stomach twisting.", "C": "Nonerosive gastritis may have normal endoscopy despite histologic inflammation and does not cause this obstructive triad.", "D": "Correct. Severe pain, retching with scant vomitus, and inability to pass an NG tube point to gastric volvulus."}}];
let currentIndex = 0;
let answers = {};
function renderProgress() {
  const progress = document.getElementById('progress');
  progress.innerHTML = '';
  questions.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'segment' + (answers[q.id] ? ' answered' : '') + (idx === currentIndex ? ' active' : '');
    btn.title = q.topic || `Question ${idx + 1}`;
    btn.onclick = () => { currentIndex = idx; render(); };
    progress.appendChild(btn);
  });
}
function renderScore() {
  let right = 0; let wrong = 0;
  Object.entries(answers).forEach(([id, selected]) => {
    const q = questions.find(item => item.id === Number(id));
    if (!q) return;
    if (selected === q.correct) right++; else wrong++;
  });
  document.getElementById('rightCount').textContent = right;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('counter').textContent = `${currentIndex + 1} / ${questions.length}`;
}
function render() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  document.getElementById('questionNumber').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('topic').textContent = q.topic ? `Topic: ${q.topic}` : '';
  document.getElementById('stem').textContent = q.stem + '?';
  const answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (selected) {
      if (letter === q.correct) btn.classList.add('correct');
      else if (letter === selected) btn.classList.add('incorrect');
    }
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    answersDiv.appendChild(btn);
  });
  const exp = document.getElementById('explanation');
  if (selected) {
    const correctness = selected === q.correct ? 'Nice job.' : 'Good attempt.';
    const optionRows = Object.entries(q.optionExplanations).map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`).join('');
    exp.style.display = 'block';
    exp.innerHTML = `<p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p><p>${correctness} ${q.explanation}</p><div class="option-exp"><p><strong>Why each option is right or wrong:</strong></p>${optionRows}</div>`;
  } else { exp.style.display = 'none'; exp.innerHTML = ''; }
  renderProgress(); renderScore();
}
function goNext() { currentIndex = (currentIndex + 1) % questions.length; render(); }
function goPrev() { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); }
function resetQuiz() { answers = {}; currentIndex = 0; render(); }
render();
</script>
