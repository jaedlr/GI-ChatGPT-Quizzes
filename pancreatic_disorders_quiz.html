<script>
const questions = [{"id": 1, "stem": "A 46 year old man develops severe epigastric pain radiating to the back with nausea and vomiting after a weekend of heavy alcohol use. Labs show leukocytosis and elevated pancreatic enzymes. Which cellular event is the central mechanism of his disease?", "topic": "Acute pancreatitis mechanism", "options": {"A": "Immune destruction of pancreatic beta cells", "B": "Intracellular activation of trypsinogen to trypsin within acinar cells", "C": "Obstruction of the pancreatic duct by mucin-producing malignant epithelium", "D": "IgG4 plasma cell infiltration centered around pancreatic ducts"}, "correct": "B", "explanation": "Acute pancreatitis is driven by premature intracellular activation of trypsinogen to trypsin inside acinar cells. Trypsin then activates additional digestive enzymes, producing pancreatic self-digestion, local tissue injury, neutrophilic inflammation, and possible systemic inflammatory complications.", "optionExplanations": {"A": "This describes type 1 diabetes pathogenesis, not acute pancreatitis.", "B": "Correct. Premature acinar cell trypsin activation is the central mechanism of acute pancreatitis.", "C": "Duct obstruction can contribute to pancreatic disease, but this answer describes a neoplastic mechanism rather than the central acute pancreatitis mechanism.", "D": "IgG4-rich duct-centric inflammation describes autoimmune pancreatitis, a chronic pancreatitis variant."}}, {"id": 2, "stem": "A 34 year old woman with gallstones has sudden severe epigastric pain radiating to the back. Which additional finding would satisfy the Revised Atlanta criteria when paired with this characteristic abdominal pain?", "topic": "Acute pancreatitis diagnosis", "options": {"A": "Hemoglobin A1c greater than 6.5 percent", "B": "Fecal elastase below the reference range", "C": "Lipase or amylase at least 3 times the upper limit of normal", "D": "CA 19-9 elevation alone"}, "correct": "C", "explanation": "The Revised Atlanta diagnostic framework requires 2 of 3 findings: characteristic abdominal pain, serum lipase or amylase at least 3 times the upper limit of normal, and abdominal imaging consistent with pancreatitis. In this patient, the characteristic pain plus a 3-fold enzyme elevation is sufficient.", "optionExplanations": {"A": "This supports diabetes mellitus, not acute pancreatitis diagnostic criteria.", "B": "Fecal elastase relates more to pancreatic exocrine insufficiency, especially chronic disease.", "C": "Correct. Enzyme elevation at least 3 times the upper limit of normal is one of the major diagnostic criteria.", "D": "CA 19-9 can be elevated in pancreatic carcinoma follow-up but is not diagnostic for acute pancreatitis."}}, {"id": 3, "stem": "A patient with acute pancreatitis develops bluish discoloration around the umbilicus. Which term best describes this physical finding?", "topic": "Acute pancreatitis physical signs", "options": {"A": "Cullen sign", "B": "Grey Turner sign", "C": "Courvoisier sign", "D": "Trousseau sign"}, "correct": "A", "explanation": "Cullen sign is periumbilical ecchymosis associated with hemorrhagic pancreatitis. It reflects tracking of blood into the periumbilical subcutaneous tissue.", "optionExplanations": {"A": "Correct. Cullen sign is periumbilical ecchymosis.", "B": "Grey Turner sign is flank ecchymosis.", "C": "Courvoisier sign is a palpable, nontender gallbladder with painless jaundice, classically from malignant obstruction.", "D": "Trousseau sign in this context refers to migratory thrombophlebitis associated with malignancy such as pancreatic carcinoma."}}, {"id": 4, "stem": "A 39 year old man with pancreatitis has flank ecchymoses, hypotension, and a falling serum calcium level. The calcium abnormality most directly reflects which pathologic process?", "topic": "Fat necrosis and saponification", "options": {"A": "Direct autoimmune destruction of parathyroid tissue", "B": "Increased insulin secretion from beta cells", "C": "Bacterial conversion of bilirubin to urobilinogen", "D": "Calcium deposition in areas of enzymatic fat necrosis"}, "correct": "D", "explanation": "In acute pancreatitis, activated pancreatic lipases damage peripancreatic fat, producing fat necrosis. Fatty acids bind calcium and form chalky calcium deposits, a process called saponification; a decreased serum calcium level is associated with worse prognosis.", "optionExplanations": {"A": "The hypocalcemia is not caused by autoimmune parathyroid disease.", "B": "Insulin secretion does not explain hypocalcemia in pancreatitis.", "C": "This relates to bilirubin metabolism, not pancreatic fat necrosis.", "D": "Correct. Fat necrosis with saponification consumes calcium and can lower serum calcium."}}, {"id": 5, "stem": "A 28 year old patient has recurrent pancreatitis. Genetic testing shows a gain of function mutation causing trypsin to resist breakdown. Which gene is most consistent with this mechanism?", "topic": "Hereditary pancreatitis genes", "options": {"A": "PRSS1", "B": "SPINK1", "C": "KRAS", "D": "CDKN2A"}, "correct": "A", "explanation": "PRSS1 gain of function mutations can make trypsin resistant to degradation, increasing the risk of inappropriate trypsin activity and pancreatitis. This promotes the same self-digestion pathway seen in acute pancreatitis.", "optionExplanations": {"A": "Correct. PRSS1 gain of function causes trypsin resistance to breakdown.", "B": "SPINK1 loss of function impairs a trypsin inhibitor rather than making trypsin itself resistant to breakdown.", "C": "KRAS is an oncogene altered in most pancreatic ductal adenocarcinomas.", "D": "CDKN2A is a tumor suppressor gene implicated in pancreatic carcinoma progression."}}, {"id": 6, "stem": "A child has recurrent episodes of pancreatitis due to ineffective inhibition of activated trypsin. Which mutation best explains this inherited predisposition?", "topic": "SPINK1 and trypsin inhibition", "options": {"A": "KRAS gain of function", "B": "CDKN2A loss of function", "C": "SPINK1 loss of function", "D": "TP53 loss of function"}, "correct": "C", "explanation": "SPINK1 encodes a pancreatic secretory trypsin inhibitor. Loss of function makes the trypsin inhibitor ineffective, permitting uncontrolled trypsin activity and predisposing to pancreatitis.", "optionExplanations": {"A": "KRAS gain of function is linked to pancreatic carcinoma, not trypsin inhibition.", "B": "CDKN2A loss affects cell-cycle control in pancreatic cancer, not trypsin inhibition.", "C": "Correct. SPINK1 loss of function removes an important brake on trypsin activity.", "D": "TP53 is not the inherited trypsin inhibitor abnormality emphasized in this section."}}, {"id": 7, "stem": "A 52 year old man develops acute pancreatitis after an impacted gallstone. What is the main obstructive mechanism by which gallstones trigger pancreatitis?", "topic": "Gallstone pancreatitis", "options": {"A": "They directly mutate KRAS in pancreatic ducts", "B": "They increase pancreatic ductal pressure and promote premature enzyme activation", "C": "They cause IgG4 plasma cell infiltration of the pancreatic ducts", "D": "They selectively destroy pancreatic endocrine islets"}, "correct": "B", "explanation": "Gallstones are one of the major causes of acute pancreatitis. Obstruction can raise ductal pressure, contributing to acinar cell injury and premature enzyme activation, especially conversion of trypsinogen to trypsin.", "optionExplanations": {"A": "KRAS mutation is a pancreatic carcinoma event, not the mechanism of gallstone pancreatitis.", "B": "Correct. Obstruction increases ductal pressure and promotes pancreatic enzyme activation.", "C": "IgG4-rich duct-centric inflammation describes autoimmune pancreatitis.", "D": "Endocrine islet destruction is not the initiating mechanism of gallstone-induced acute pancreatitis."}}, {"id": 8, "stem": "A patient with acute pancreatitis deteriorates with hypoxemia, renal failure, and shock. Which systemic process best explains this clinical decline?", "topic": "Acute pancreatitis systemic complications", "options": {"A": "Purely localized pancreatic duct dilation without systemic involvement", "B": "Delayed malignant transformation of cyst epithelium", "C": "Systemic inflammatory response from pancreatic enzyme-mediated injury", "D": "Selective vitamin K malabsorption from bile duct obstruction"}, "correct": "C", "explanation": "Acute pancreatitis can trigger a systemic inflammatory response syndrome due to enzyme-mediated tissue damage and inflammatory mediator release. Severe cases can progress to ARDS, renal failure, sepsis, and shock.", "optionExplanations": {"A": "Severe pancreatitis is not purely localized; it can produce major systemic complications.", "B": "Malignant cyst transformation is not the cause of acute ARDS and shock in pancreatitis.", "C": "Correct. Pancreatic self-digestion and inflammation can trigger SIRS, ARDS, renal failure, and shock.", "D": "Vitamin K malabsorption does not explain the acute systemic inflammatory collapse."}}, {"id": 9, "stem": "Gross examination of an inflamed pancreas shows edema, hemorrhage, loss of lobulation, and yellow-white chalky foci. Microscopy shows acinar necrosis with many neutrophils. Which diagnosis best fits?", "topic": "Acute pancreatitis morphology", "options": {"A": "Acute pancreatitis", "B": "Chronic pancreatitis", "C": "Serous cystadenoma", "D": "Pancreatic ductal adenocarcinoma"}, "correct": "A", "explanation": "Acute pancreatitis is characterized grossly by edema, hemorrhage, loss of lobulation, and chalky fat necrosis. Microscopically it shows neutrophils, acinar necrosis, and calcium deposits from saponification.", "optionExplanations": {"A": "Correct. These gross and microscopic findings are classic for acute pancreatitis.", "B": "Chronic pancreatitis instead shows fibrosis, atrophy, duct dilation, calcifications, protein plugs, and mononuclear inflammation.", "C": "Serous cystadenoma is a benign cystic neoplasm with clear fluid-filled spaces lined by low cuboidal cells.", "D": "Pancreatic ductal adenocarcinoma forms hard, stellate, gray-white poorly defined masses with desmoplasia."}}, {"id": 10, "stem": "A 55 year old man with long-term alcohol abuse has chronic unrelenting abdominal pain. Imaging shows a hard pancreas with dilated ducts and calcifications. Which histologic finding is most likely?", "topic": "Chronic pancreatitis morphology", "options": {"A": "Predominance of neutrophils and acinar necrosis only", "B": "Parenchymal fibrosis with reduced acini and dilated ducts containing protein plugs", "C": "Low cuboidal cells surrounding small clear fluid-filled cystic spaces", "D": "Moderately differentiated malignant glands in desmoplastic stroma"}, "correct": "B", "explanation": "Chronic pancreatitis causes irreversible damage to exocrine parenchyma with fibrosis, atrophy, calcification, and ductal changes. Microscopy shows parenchymal fibrosis, reduced acini, dilated ducts with protein plugs, and mononuclear inflammatory infiltrates.", "optionExplanations": {"A": "Neutrophil-predominant acinar necrosis is more characteristic of acute pancreatitis.", "B": "Correct. Fibrosis, acinar loss, protein plugs, and mononuclear infiltrates are chronic pancreatitis findings.", "C": "This describes serous cystadenoma.", "D": "This describes pancreatic ductal adenocarcinoma."}}, {"id": 11, "stem": "A patient with chronic pancreatitis develops pale fatty stools and weight loss. Approximately how much pancreatic damage is typically required before pancreatic insufficiency produces these findings?", "topic": "Pancreatic insufficiency threshold", "options": {"A": "Only pancreatic head involvement without exocrine injury is present", "B": "Less than 5 percent of the organ is damaged", "C": "Only transient acinar edema is present", "D": "More than 90 percent of the organ is damaged"}, "correct": "D", "explanation": "Pancreatic insufficiency in chronic pancreatitis occurs only after extensive destruction, typically when more than 90 percent of the pancreas is damaged. Loss of exocrine function causes maldigestion, steatorrhea, pale fatty stools, and weight loss.", "optionExplanations": {"A": "Location alone is not enough; the key is severe exocrine parenchymal loss.", "B": "Minimal damage would not usually cause clinically significant pancreatic insufficiency.", "C": "Transient edema is more acute and reversible, not the chronic extensive destruction needed for steatorrhea.", "D": "Correct. Exocrine insufficiency usually requires greater than 90 percent pancreatic damage."}}, {"id": 12, "stem": "A 48 year old man with a long alcohol history has chronic pancreatitis. Which process best accounts for the irreversible architectural distortion of the gland?", "topic": "Chronic pancreatitis fibrosis", "options": {"A": "Bacterial invasion causing pseudomembrane formation", "B": "Ductal carcinoma producing mucin plugs alone", "C": "Fibrosis driven by injury to exocrine parenchyma and stellate cell activation", "D": "Autoimmune hemolysis causing iron deposition"}, "correct": "C", "explanation": "Chronic pancreatitis features irreversible damage to exocrine parenchyma followed by fibrosis, with stellate cells contributing to fibrotic remodeling. Endocrine parenchyma can be destroyed later.", "optionExplanations": {"A": "Pseudomembranes are not a feature of chronic pancreatitis.", "B": "Ductal carcinoma can obstruct ducts, but this does not explain the general chronic pancreatitis fibrosis mechanism.", "C": "Correct. Chronic pancreatic injury activates fibrogenic pathways, including stellate cell-driven fibrosis.", "D": "Autoimmune hemolysis and iron deposition are unrelated to chronic pancreatitis fibrosis."}}, {"id": 13, "stem": "A 62 year old man has a pancreatic mass concerning for carcinoma. Biopsy instead shows duct-centric mixed inflammation with many IgG4-producing plasma cells. Which treatment is most appropriate based on this diagnosis?", "topic": "Autoimmune pancreatitis", "options": {"A": "Immediate Whipple procedure for all cases", "B": "Steroid therapy", "C": "Palliative biliary stenting only", "D": "Broad-spectrum antibiotics alone"}, "correct": "B", "explanation": "Lymphoplasmacytic sclerosing autoimmune pancreatitis can clinically mimic pancreatic cancer. The section emphasizes duct-centric mixed inflammatory infiltrates with increased IgG4-producing plasma cells and high responsiveness to steroids.", "optionExplanations": {"A": "Surgery is not the standard initial treatment once autoimmune pancreatitis is identified.", "B": "Correct. IgG4-related autoimmune pancreatitis is highly responsive to steroids.", "C": "Palliative stenting may be used in obstructive cancer, but it does not treat the autoimmune inflammation.", "D": "Antibiotics alone do not treat IgG4-related autoimmune pancreatitis."}}, {"id": 14, "stem": "A 44 year old patient is found to have the most common congenital pancreatic anomaly. The anomaly involves failed fusion of the fetal dorsal and ventral pancreatic ducts. Which diagnosis is this?", "topic": "Pancreas divisum", "options": {"A": "Annular pancreas", "B": "Ectopic pancreas", "C": "Pancreas divisum", "D": "Congenital pancreatic cyst"}, "correct": "C", "explanation": "Pancreas divisum is the most common congenital pancreatic anomaly and results from failure of the fetal dorsal and ventral pancreatic ducts to fuse. It is often asymptomatic but can be associated with chronic pancreatitis.", "optionExplanations": {"A": "Annular pancreas is congenital but is not the failed dorsal-ventral duct fusion described here.", "B": "Ectopic pancreas is pancreatic tissue outside the normal pancreas.", "C": "Correct. Pancreas divisum is due to failure of dorsal and ventral duct fusion.", "D": "Congenital pancreatic cysts are anomalous duct development and are often part of multi-organ disease."}}, {"id": 15, "stem": "A patient with autosomal dominant polycystic kidney disease is found to have multiple small thin-walled pancreatic cysts filled with clear serous fluid. What is the most likely origin of these cysts?", "topic": "Congenital pancreatic cysts", "options": {"A": "Anomalous development of pancreatic ducts", "B": "Metastatic spread from renal cell carcinoma", "C": "Premature activation of trypsinogen within acinar cells", "D": "KRAS-driven pancreatic intraepithelial neoplasia"}, "correct": "A", "explanation": "Congenital pancreatic cysts usually occur as part of multiple-organ diseases such as autosomal dominant polycystic kidney disease. They result from anomalous development of pancreatic ducts and are lined by flattened epithelium with clear serous fluid.", "optionExplanations": {"A": "Correct. Congenital pancreatic cysts arise from abnormal pancreatic duct development.", "B": "The described cysts are congenital developmental lesions, not metastatic carcinoma.", "C": "Premature trypsin activation causes acute pancreatitis, not congenital cyst formation.", "D": "PanIN with KRAS mutation is a precursor pathway for pancreatic ductal adenocarcinoma."}}, {"id": 16, "stem": "A 50 year old man has a cystic lesion adjacent to the body of the pancreas several weeks after acute pancreatitis. Pathology shows hemorrhagic material surrounded by a fibrous wall with no epithelial lining. Which lesion is most likely?", "topic": "Pancreatic pseudocyst", "options": {"A": "Serous cystadenoma", "B": "Mucinous cystic neoplasm", "C": "Congenital pancreatic cyst", "D": "Pancreatic pseudocyst"}, "correct": "D", "explanation": "A pancreatic pseudocyst commonly follows acute or chronic pancreatitis. It is non-neoplastic and consists of hemorrhagic or enzyme-rich material surrounded by fibrous tissue without an epithelial lining.", "optionExplanations": {"A": "Serous cystadenoma is a true cystic neoplasm lined by low cuboidal cells.", "B": "Mucinous cystic neoplasm is a true cystic neoplasm, usually in women and arising in the body or tail.", "C": "Congenital pancreatic cysts are lined by flattened epithelium and often associated with multi-organ cystic disease.", "D": "Correct. Lack of epithelial lining after pancreatitis defines a pancreatic pseudocyst."}}, {"id": 17, "stem": "A 61 year old man with chronic alcohol-related pancreatitis develops a solitary cystic collection near the pancreatic tail. Which statement best describes this lesion?", "topic": "Pancreatic pseudocyst complications", "options": {"A": "It accounts for most pancreatic cysts and may become infected or compress adjacent organs", "B": "It is a benign epithelial tumor that is always cured without surgery", "C": "It is a congenital duct anomaly seen only in childhood", "D": "It is defined by KRAS mutations in 95 percent of cases"}, "correct": "A", "explanation": "Pancreatic pseudocysts account for 75 to 85 percent of pancreatic cysts and usually follow pancreatitis, alcohol, gallstones, or trauma. They may become infected or compress/perforate into adjacent organs.", "optionExplanations": {"A": "Correct. Pseudocysts are the majority of pancreatic cysts and can cause infection or mass effect complications.", "B": "Pseudocysts are not epithelial tumors and may require intervention if complicated.", "C": "They are acquired after pancreatitis, not congenital duct anomalies.", "D": "KRAS alteration is emphasized for pancreatic carcinoma, not pseudocysts."}}, {"id": 18, "stem": "A 72 year old woman has a well-circumscribed mass in the pancreatic tail with many small clear fluid-filled spaces. Microscopy shows low cuboidal cells lining the spaces. Which diagnosis is most likely?", "topic": "Serous cystadenoma", "options": {"A": "Pancreatic ductal adenocarcinoma", "B": "Chronic pancreatitis", "C": "Serous cystadenoma", "D": "Pancreatic pseudocyst"}, "correct": "C", "explanation": "Serous cystadenoma is a benign cystic neoplasm, more common in women in their seventh decade, usually located in the pancreatic tail. It appears as a well-circumscribed mass with small fluid-filled areas lined by low cuboidal cells and can be cured by surgery.", "optionExplanations": {"A": "Ductal adenocarcinoma is a hard, stellate, poorly defined invasive mass, usually with desmoplasia.", "B": "Chronic pancreatitis shows fibrosis, atrophy, calcifications, and dilated ducts with protein plugs.", "C": "Correct. This is the classic gross and microscopic description of serous cystadenoma.", "D": "A pseudocyst lacks an epithelial lining and follows pancreatitis."}}, {"id": 19, "stem": "A cystic pancreatic neoplasm is identified in the body of the pancreas of a woman. The lesion is mucin-producing and has malignant potential. Which diagnosis best fits the section description?", "topic": "Mucinous cystic neoplasm", "options": {"A": "Mucinous cystic neoplasm", "B": "Serous cystadenoma", "C": "Pancreas divisum", "D": "Acute pancreatitis"}, "correct": "A", "explanation": "Mucinous cystic neoplasms occur overwhelmingly in women, arise in the body or tail of the pancreas, and can be benign or malignant. Their malignant potential distinguishes them from benign serous cystadenomas.", "optionExplanations": {"A": "Correct. Mucinous cystic neoplasms are typically in women and arise in the body or tail with benign or malignant behavior.", "B": "Serous cystadenoma is benign and composed of small clear fluid-filled cystic spaces lined by low cuboidal cells.", "C": "Pancreas divisum is a congenital duct-fusion abnormality, not a mucinous neoplasm.", "D": "Acute pancreatitis is inflammatory, not a cystic mucin-producing neoplasm."}}, {"id": 20, "stem": "A 70 year old man presents with progressive weight loss, anorexia, malaise, and painless obstructive jaundice. Imaging reveals a mass in the head of the pancreas obstructing the distal common bile duct. Which tumor is most likely?", "topic": "Pancreatic ductal adenocarcinoma presentation", "options": {"A": "Serous cystadenoma", "B": "Pancreatic pseudocyst", "C": "Mucinous cystic neoplasm", "D": "Pancreatic ductal adenocarcinoma"}, "correct": "D", "explanation": "Pancreatic ductal adenocarcinoma often remains silent until it invades adjacent structures. Tumors in the pancreatic head commonly obstruct the distal common bile duct, producing painless obstructive jaundice with weight loss, anorexia, malaise, and weakness.", "optionExplanations": {"A": "Serous cystadenoma is benign and usually a well-circumscribed cystic lesion in the tail.", "B": "A pseudocyst follows pancreatitis and lacks an epithelial lining.", "C": "Mucinous cystic neoplasms usually arise in the body or tail in women.", "D": "Correct. Painless obstructive jaundice from a pancreatic head mass is classic for pancreatic ductal adenocarcinoma."}}, {"id": 21, "stem": "A patient with pancreatic ductal adenocarcinoma is found to have an oncogene altered in approximately 95 percent of cases. Which gene is this?", "topic": "Pancreatic carcinoma genetics", "options": {"A": "SPINK1", "B": "KRAS", "C": "PRSS1", "D": "CFTR"}, "correct": "B", "explanation": "Pancreatic ductal adenocarcinoma develops through precursor lesions such as PanIN and is strongly associated with KRAS oncogene alterations, present in approximately 95 percent of pancreatic cancers in the section.", "optionExplanations": {"A": "SPINK1 loss of function predisposes to pancreatitis by impairing trypsin inhibition.", "B": "Correct. KRAS is the oncogene altered in about 95 percent of pancreatic cancers.", "C": "PRSS1 gain of function predisposes to pancreatitis by making trypsin resistant to breakdown.", "D": "CFTR is associated with cystic fibrosis and pancreatic disease but is not the 95 percent oncogene alteration described here."}}, {"id": 22, "stem": "A pancreatic ductal adenocarcinoma progresses through PanIN lesions and loses a tumor suppressor involved in cell-cycle regulation. Which gene listed in the section best matches this role?", "topic": "CDKN2A in pancreatic carcinoma", "options": {"A": "CDKN2A", "B": "PRSS1", "C": "SPINK1", "D": "AMY2A"}, "correct": "A", "explanation": "The section identifies CDKN2A as a tumor suppressor gene involved in pancreatic carcinoma. Loss of tumor suppressor function promotes neoplastic progression through pancreatic intraepithelial neoplasia toward invasive ductal adenocarcinoma.", "optionExplanations": {"A": "Correct. CDKN2A is the tumor suppressor gene highlighted for pancreatic carcinoma.", "B": "PRSS1 is linked to hereditary pancreatitis, not a tumor suppressor role in pancreatic carcinoma.", "C": "SPINK1 is a trypsin inhibitor gene linked to pancreatitis predisposition.", "D": "AMY2A encodes pancreatic amylase and is not the tumor suppressor highlighted in this section."}}, {"id": 23, "stem": "A 68 year old man with pancreatic ductal adenocarcinoma develops recurrent superficial venous thromboses that migrate from one site to another. Which paraneoplastic finding is described?", "topic": "Trousseau sign in pancreatic cancer", "options": {"A": "Grey Turner sign", "B": "Cullen sign", "C": "Trousseau sign", "D": "Murphy sign"}, "correct": "C", "explanation": "Migratory thrombophlebitis is Trousseau sign. The section notes it is seen in pancreatic, gastric, and lung cancer and occurs in a minority of pancreatic carcinoma patients due to procoagulants from the carcinoma.", "optionExplanations": {"A": "Grey Turner sign is flank ecchymosis in pancreatitis.", "B": "Cullen sign is periumbilical ecchymosis in pancreatitis.", "C": "Correct. Migratory thrombophlebitis associated with cancer is Trousseau sign.", "D": "Murphy sign is right upper quadrant inspiratory arrest in cholecystitis, not migratory thrombophlebitis."}}, {"id": 24, "stem": "A pancreatic tumor is described as a hard, stellate, gray-white, poorly defined mass with a marked fibrotic stromal response. Which gross feature is most characteristic of this tumor type?", "topic": "Pancreatic carcinoma morphology", "options": {"A": "Multiple thin-walled cysts lined by flattened epithelium", "B": "Yellow-white chalky fat necrosis with neutrophils", "C": "Protein plugs in dilated ducts with mononuclear inflammation", "D": "Locally invasive desmoplastic ductal adenocarcinoma"}, "correct": "D", "explanation": "Pancreatic ductal adenocarcinoma is grossly a hard, stellate, gray-white, poorly defined mass. Two emphasized features are high local invasiveness and a desmoplastic, fibrotic response.", "optionExplanations": {"A": "This describes congenital pancreatic cysts.", "B": "This describes acute pancreatitis with enzymatic fat necrosis.", "C": "This describes chronic pancreatitis.", "D": "Correct. Hard stellate gray-white masses with desmoplasia are typical of pancreatic ductal adenocarcinoma."}}, {"id": 25, "stem": "A 73 year old man is diagnosed with pancreatic ductal adenocarcinoma. Which site is most commonly involved grossly according to the section?", "topic": "Pancreatic carcinoma location", "options": {"A": "Ampulla-free jejunum", "B": "Pancreatic tail only", "C": "Accessory spleen", "D": "Pancreatic head"}, "correct": "D", "explanation": "The section states that approximately 60 percent of pancreatic ductal adenocarcinomas occur in the pancreatic head. Head tumors are especially likely to obstruct the distal common bile duct and present with painless jaundice.", "optionExplanations": {"A": "Jejunum is not a pancreatic site.", "B": "Tail lesions are common for some cystic neoplasms but not the most common site for ductal adenocarcinoma in the section.", "C": "Accessory spleen is not a pancreatic carcinoma site.", "D": "Correct. The pancreatic head is the most common site listed for pancreatic ductal adenocarcinoma."}}, {"id": 26, "stem": "A 65 year old patient with suspected pancreatic ductal adenocarcinoma has elevated carcinoembryonic antigen and CA 19-9. Which statement best describes these tumor markers in the section?", "topic": "Tumor markers in pancreatic carcinoma", "options": {"A": "They replace histologic diagnosis because they are fully specific", "B": "They are elevated tumor markers but CA 19-9 is nonspecific and mainly useful for follow-up", "C": "They are diagnostic only for acute pancreatitis", "D": "They prove the tumor is benign"}, "correct": "B", "explanation": "Pancreatic carcinoma can be associated with elevated carcinoembryonic antigen and CA 19-9. The notes emphasize CA 19-9 as nonspecific and useful for follow-up or tracking rather than as a stand-alone definitive diagnostic test.", "optionExplanations": {"A": "These markers are not fully specific and do not replace tissue diagnosis/staging.", "B": "Correct. CA 19-9 can be elevated but is nonspecific and mainly useful for follow-up.", "C": "Amylase and lipase, not CEA/CA 19-9, are used in acute pancreatitis criteria.", "D": "Elevated tumor markers do not prove benign disease."}}, {"id": 27, "stem": "A patient with pancreatic ductal adenocarcinoma asks about prognosis. Which statement best reflects the section?", "topic": "Pancreatic carcinoma prognosis", "options": {"A": "Most patients are eligible for curative resection at diagnosis", "B": "Overall 5-year survival is approximately 6 percent with median survival about 6 months", "C": "It has the lowest mortality among common GI cancers", "D": "It usually remains indolent for decades after diagnosis"}, "correct": "B", "explanation": "Pancreatic ductal adenocarcinoma has extremely poor prognosis. The section lists it as the fourth leading cause of cancer deaths in the United States, with overall 5-year survival around 6 percent and median survival around 6 months.", "optionExplanations": {"A": "The section notes that fewer than 20 percent are resectable at diagnosis.", "B": "Correct. The prognosis is poor, with about 6 percent 5-year survival and median survival around 6 months.", "C": "The section emphasizes very high mortality, not low mortality.", "D": "The course is typically brief and progressive, not indolent for decades."}}, {"id": 28, "stem": "A pancreatic cystic lesion is removed from a woman in her seventh decade. It is benign, located in the tai let currentIndex = 0;
const answers = {};
const segmentsEl = document.getElementById('segments');
const progressEl = document.getElementById('progress');
const wrongCountEl = document.getElementById('wrongCount');
const rightCountEl = document.getElementById('rightCount');
const qNumEl = document.getElementById('qNum');
const topicEl = document.getElementById('topic');
const stemEl = document.getElementById('stem');
const optionsEl = document.getElementById('options');
const explanationEl = document.getElementById('explanation');
function renderSegments() {
  segmentsEl.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('button');
    b.className = 'seg' + (idx === currentIndex ? ' active' : '') + (answers[q.id] !== undefined ? ' answered' : '');
    b.title = q.topic || `Question ${idx + 1}`;
    b.setAttribute('aria-label', `Go to question ${idx + 1}`);
    b.onclick = () => { currentIndex = idx; render(); };
    segmentsEl.appendChild(b);
  });
}
function renderCounts() {
  let right=0, wrong=0;
  Object.entries(answers).forEach(([id, choice]) => {
    const q = questions.find(x => x.id === Number(id));
    if (q && choice === q.correct) right++; else if (q) wrong++;
  });
  rightCountEl.textContent = right;
  wrongCountEl.textContent = wrong;
}
function render() {
  const q = questions[currentIndex];
  const selected = answers[q.id] || null;
  progressEl.textContent = `${currentIndex + 1} / ${questions.length}`;
  qNumEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  topicEl.textContent = q.topic ? `Topic: ${q.topic}` : '';
  stemEl.textContent = q.stem + '?';
  optionsEl.innerHTML = '';
  Object.entries(q.options).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (selected && letter === q.correct) btn.classList.add('correct');
    else if (selected && letter === selected && letter !== q.correct) btn.classList.add('wrong');
    btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
    btn.onclick = () => { answers[q.id] = letter; render(); };
    optionsEl.appendChild(btn);
  });
  if (selected) {
    const correct = selected === q.correct;
    let html = `<div class="explanation"><p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p>`;
    html += `<p class="${correct ? 'correctText' : 'wrongText'}">${correct ? 'Nice job. ' : 'Good attempt. '}${q.explanation}</p>`;
    html += `<p><strong>Why each option is right or wrong:</strong></p>`;
    Object.entries(q.optionExplanations).forEach(([letter, text]) => { html += `<p><strong>${letter}.</strong> ${text}</p>`; });
    html += `</div>`;
    explanationEl.innerHTML = html;
  } else { explanationEl.innerHTML = ''; }
  renderCounts();
  renderSegments();
}
document.getElementById('prev').onclick = () => { currentIndex = (currentIndex - 1 + questions.length) % questions.length; render(); };
document.getElementById('next').onclick = () => { currentIndex = (currentIndex + 1) % questions.length; render(); };
render();
</script>
