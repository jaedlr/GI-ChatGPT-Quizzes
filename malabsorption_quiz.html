    let currentIndex = 0;
    const answers = {};

    const segmentsEl = document.getElementById("segments");
    const progressText = document.getElementById("progressText");
    const wrongCount = document.getElementById("wrongCount");
    const rightCount = document.getElementById("rightCount");
    const questionMeta = document.getElementById("questionMeta");
    const topicMeta = document.getElementById("topicMeta");
    const stemEl = document.getElementById("stem");
    const optionsEl = document.getElementById("options");
    const explanationEl = document.getElementById("explanation");

    function renderSegments() {
      segmentsEl.innerHTML = "";
      questions.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = "segment" + (answers[q.id] ? " answered" : "") + (idx === currentIndex ? " active" : "");
        btn.setAttribute("aria-label", `Go to question ${idx + 1}`);
        btn.title = q.topic || `Question ${idx + 1}`;
        btn.addEventListener("click", () => {
          currentIndex = idx;
          render();
        });
        segmentsEl.appendChild(btn);
      });
    }

    function scoreCounts() {
      let right = 0;
      let wrong = 0;
      Object.entries(answers).forEach(([id, choice]) => {
        const q = questions.find(item => item.id === Number(id));
        if (!q) return;
        if (choice === q.correct) right++;
        else wrong++;
      });
      rightCount.textContent = right;
      wrongCount.textContent = wrong;
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      const selected = answers[q.id] || null;
      const showExplanation = selected !== null;

      progressText.textContent = `${currentIndex + 1} / ${questions.length}`;
      questionMeta.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      topicMeta.textContent = q.topic ? `Topic: ${q.topic}` : "";
      stemEl.textContent = q.stem.endsWith("?") ? q.stem : q.stem + "?";

      optionsEl.innerHTML = "";
      Object.entries(q.options).forEach(([letter, text]) => {
        const btn = document.createElement("button");
        btn.className = "option";
        if (showExplanation && letter === q.correct) btn.classList.add("correct");
        if (showExplanation && letter === selected && letter !== q.correct) btn.classList.add("incorrect");
        btn.innerHTML = `<strong>${letter}.</strong> ${text}`;
        btn.addEventListener("click", () => {
          answers[q.id] = letter;
          render();
        });
        optionsEl.appendChild(btn);
      });

      if (showExplanation) {
        const isCorrect = selected === q.correct;
        const optionExplanations = Object.entries(q.optionExplanations || {})
          .map(([letter, text]) => `<p><strong>${letter}.</strong> ${text}</p>`)
          .join("");
        explanationEl.style.display = "block";
        explanationEl.innerHTML = `
          <p><strong>Correct answer: ${q.correct}</strong> (${q.options[q.correct]})</p>
          <p class="${isCorrect ? "correct-text" : "incorrect-text"}">${isCorrect ? "Nice job. " : "Good attempt. "}${q.explanation}</p>
          <div>
            <p><strong>Why each option is right or wrong:</strong></p>
            ${optionExplanations}
          </div>
        `;
      } else {
        explanationEl.style.display = "none";
        explanationEl.innerHTML = "";
      }
    }

    function render() {
      renderSegments();
      scoreCounts();
      renderQuestion();
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      currentIndex = currentIndex === 0 ? questions.length - 1 : currentIndex - 1;
      render();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIndex = currentIndex === questions.length - 1 ? 0 : currentIndex + 1;
      render();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      Object.keys(answers).forEach(key => delete answers[key]);
      currentIndex = 0;
      render();
    });

    render();
  </script>
